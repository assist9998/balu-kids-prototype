    padding-left: env(safe-area-inset-left);

  /* hide scrollbars inside the device */
  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }

  /* press feedback */
  .bk-press { transition: transform .12s cubic-bezier(.22,1,.36,1), filter .12s, opacity .12s; }
  .bk-press:active { transform: scale(0.96); filter: brightness(0.98); }

  /* screen transitions */
  @keyframes scrFwd  { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
  @keyframes scrBack { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }
  .scr-fwd  { animation: scrFwd  .34s cubic-bezier(.22,1,.36,1); }
  .scr-back { animation: scrBack .30s cubic-bezier(.22,1,.36,1); }

  /* pull-to-refresh spinner */
  @keyframes bk-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* toast */
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .bk-toast { animation: toastIn .3s cubic-bezier(.22,1,.36,1); }

  @media (prefers-reduced-motion: reduce) {
    .scr-fwd, .scr-back, .bk-toast { animation: none; }
  }

<script>
// data.js — Балу Кидс. CHILDREN грузится из API (Google Sheets), остальное демо/декоративное.
window.API_BASE = "https://rmxois1uv0a24xrbi2dfcfac.95.179.188.141.sslip.io";

// Auto-attach the per-login token to every request to our own API, and
// force a re-login if the backend ever rejects it (expired/restarted
// session) — without this, every /children, /attendance, etc. call would
// be readable by anyone who just knows the API URL, login or not.
(function () {
  const _origFetch = window.fetch.bind(window);
  function currentToken() {
    try { return (JSON.parse(localStorage.getItem('balu_role') || 'null') || {}).token || null; }
    catch { return null; }
  }
  window.fetch = function (url, opts) {
    const isApiCall = typeof url === 'string' && url.startsWith(window.API_BASE);
    const isLogin = isApiCall && url.endsWith('/auth/login');
    const token = isApiCall && !isLogin ? currentToken() : null;
    if (isApiCall && !isLogin) {
      opts = Object.assign({}, opts, {
        headers: Object.assign({}, opts && opts.headers, token ? { Authorization: 'Bearer ' + token } : {}),
      });
    }
    return _origFetch(url, opts).then((res) => {
      // Only a *previously valid* session going stale (backend restarted,
      // token expired) should force a re-login. Some data loads fire before
      // any login (e.g. the home screen's initial fetch attempt) and 401
      // there is normal/expected — reloading on those would loop forever,
      // tearing the page down before the user can even submit the login form.
      if (isApiCall && !isLogin && token && res.status === 401) {
        try { localStorage.removeItem('balu_role'); } catch {}
        window.location.reload();
      }
      return res;
    });
  };
})();

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',

      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',

      {/* shine */}

      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>

  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,

        padding: '0 16px',

        fontSize: 34, fontWeight: 700, lineHeight: '41px',

  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';

function IOSList({ header, children, dark = false }) {

function IOSDevice({

function IOSKeyboard({ dark = false }) {

      <div style={{

        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',

        position: 'relative',

        {['"The"', 'the', 'to'].map((w, i) => (

              flex: 1, textAlign: 'center',

        position: 'relative',
      }}>

        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>

          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}

      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}

    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

// ui.jsx — shared visual atoms for Балу Кидс. Exported to window.
// Colors come from CSS vars set on the app root: --accent, --ink, --bg, --card, --ok, --no, --warn

function clsx() { return Array.prototype.filter.call(arguments, Boolean).join(' '); }

// "Scout badge" style — bigger circular icon + label, for the child's hero card.
// Reused at compact size (see `careBadges`) for the group list and attendance roster.
const BADGE_TONES = {
  warn:    { bg: '#FBD9E1', ink: '#9C3A1F' },
  ok:      { bg: '#D4F0DF', ink: '#1F6B4A' },
  info:    { bg: '#CDE8FB', ink: '#1F5F86' },
  amenity: { bg: '#FBE0C0', ink: '#7A3D00' },
  special: { bg: '#E8D5FB', ink: '#6B3FA0' },
  emerald: { bg: '#C7F0DD', ink: '#0E7C54' },
  halal:   { bg: '#7FE3B4', ink: '#06492E' },
  neutral: { bg: '#E7E1D9', ink: '#6B5C4A' },
};

function ScoutBadge({ emoji, text, dot, label, tone, bg, ink, compact }) {
  const base = BADGE_TONES[tone] || BADGE_TONES.amenity;
  const palette = { bg: bg || base.bg, ink: ink || base.ink };
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: compact ? 3 : 6, whiteSpace: 'nowrap',
      padding: compact ? '2px 7px 2px 5px' : '7px 13px 7px 10px', borderRadius: 999, border: `1px solid ${palette.ink}33`,
      background: palette.bg, color: palette.ink, fontSize: compact ? 9.5 : 13, fontWeight: 700,
    }}>
      {dot
        ? <span style={{ width: compact ? 5 : 8, height: compact ? 5 : 8, borderRadius: '50%', background: dot, flexShrink: 0 }} />
        : <span style={{ fontSize: text ? (compact ? 8 : 11) : (compact ? 10 : 15), fontWeight: text ? 800 : 400 }}>{text || emoji}</span>}
      {label}
    </span>
  );
}

function allergyEmoji(text) {
  const s = text.toLowerCase();
  if (s.includes('grapefruit')) return '🍊🚫';
  if (s.includes('citrus') || s.includes('orange') || s.includes('lemon')) return '🍊🚫';
  if (s.includes('shellfish') || s.includes('seafood') || s.includes('морепродукт')) return '🦐🚫';
  if (s.includes('pork') || s.includes('pig')) return '🐖🚫';
  if (s.includes('gluten') || s.includes('wheat')) return '🌾🚫';
  if (s.includes('milk') || s.includes('dairy') || s.includes('lactose')) return '🥛🚫';
  if (s.includes('peanut') || s.includes('nut')) return '🥜🚫';
  if (s.includes('egg')) return '🥚🚫';
  if (s.includes('fish')) return '🐟🚫';
  if (s.includes('soy')) return '🌱🚫';
  if (s.includes('chocolate') || s.includes('cocoa')) return '🍫🚫';
  if (s.includes('strawberry') || s.includes('berry')) return '🍓🚫';
  if (s.includes('dust')) return '🌫️🚫';
  if (s.includes('pollen')) return '🌼🚫';
  return '⚠️';
}

function careBadges(kid, { includeMeals = true } = {}) {
  const badges = [];
  if (kid.allergyEn) {
    const seenEmoji = new Set();
    kid.allergyEn.split(/[,./]+/).map(a => a.trim()).filter(Boolean)
      .forEach(a => {
        if (a.toLowerCase().includes('halal')) { badges.push({ text: 'HALAL', label: 'Meals', tone: 'halal' }); return; }
        const emoji = allergyEmoji(a);
        if (seenEmoji.has(emoji)) return;
        seenEmoji.add(emoji);
        const withNo = a.toLowerCase().startsWith('no ') ? a : `No ${a}`;
        const label = withNo.charAt(0).toUpperCase() + withNo.slice(1);
        badges.push({ emoji, label, tone: 'warn' });
      });
  }
  if (kid.paracetamol === 'no') badges.push({ emoji: '💊🚫', label: 'No paracetamol', tone: 'warn' });
  if (kid.photoConsent === 'no') badges.push({ emoji: '📸🚫', label: 'No photos', tone: 'warn' });
  if (kid.adaptation) badges.push({ emoji: '🌱', label: 'Adaptation', tone: 'special' });
  if (includeMeals && kid.mealsIncluded) badges.push(kid.mealsHalal
    ? { text: 'HALAL', label: 'Meals', tone: 'halal' }
    : { emoji: '🍽️', label: 'Meals', tone: 'emerald' });
  return badges;
}

function ScoutBadgeRow({ kid, grp, status, onEdit, onDelete }) {
  const group = grp ? { emoji: grp.emoji, label: Lo(grp), bg: grp.color, ink: grp.ink } : null;
  const petals = [];
  if (status) petals.push(status === 'present'
    ? { dot: 'var(--ok)', label: t('present'), tone: 'ok' }
    : { dot: 'var(--ink-faint)', label: t('absent'), tone: 'neutral' });
  if (kid.paidUntil && normDate(kid.paidUntil) < todayStr()) petals.push({ emoji: '⚠️', label: 'Overdue', tone: 'warn' });
  if (kid.contract === 'tourist') petals.push({ emoji: '🧳', label: kid.dayType ? `Short term · ${kid.dayType}` : 'Short term', tone: 'info' });
  if (kid.contract && kid.contract !== 'tourist') petals.push({ emoji: '🏠', label: kid.dayType ? `Long term · ${kid.dayType}` : 'Long term', tone: 'ok' });
  petals.push(...careBadges(kid));
  if (kid.napTime) petals.push({ emoji: '😴', label: 'Nap time', tone: 'info' });
  if (kid.afterSchool) petals.push({ emoji: '🏫', label: 'After school', tone: 'amenity' });
  DATA.CLUBS.filter(c => c.kids.includes(kid.id)).forEach(c =>
    petals.push({ emoji: c.emoji, label: Lo(c), bg: c.color, ink: c.ink })
  );
  const all = group ? [group, ...petals] : petals;

  const actionStyle = {
    display: 'inline-flex', alignItems: 'center', gap: 5, whiteSpace: 'nowrap',
    padding: '7px 12px', borderRadius: 999, border: '1px solid rgba(107,92,74,0.2)',
    background: '#E7E1D9', color: '#6B5C4A', fontSize: 13, fontWeight: 700,
    fontFamily: 'inherit', cursor: 'pointer',
  };

  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, justifyContent: 'center', margin: '14px 0 4px' }}>
      {all.map((b, bi) => <ScoutBadge key={bi} {...b} />)}
      {onEdit && <button onClick={onEdit} className="bk-press" style={actionStyle}>✏️</button>}
      {onDelete && <button onClick={onDelete} className="bk-press" style={actionStyle}>🗑️</button>}
    </div>
  );
}

function Avatar({ emoji, color = '#eee', size = 46, ring, onClick }) {
  return (
    <div onClick={onClick} className={onClick ? 'bk-press' : ''} style={{
      width: size, height: size, borderRadius: '50%', background: color,
      display: 'grid', placeItems: 'center', flexShrink: 0,
      fontSize: size * 0.5, lineHeight: 1, cursor: onClick ? 'pointer' : 'default',
      boxShadow: ring ? `0 0 0 3px var(--bg), 0 0 0 ${3 + 2}px ${color}` : 'none',
    }}>{emoji}</div>
  );
}

const AVATAR_BASES = ['🧒', '👦', '👧', '👶'];
const AVATAR_TONES = ['', '🏻', '🏼', '🏽', '🏾', '🏿'];

function EmojiPickerSheet({ kid, onClose }) {
  const [saving, setSaving] = React.useState(null); // emoji being saved
  const [error, setError] = React.useState(null);

  async function pick(emoji) {
    setSaving(emoji);
    setError(null);
    try {
      await window.setChildEmoji(kid.id, emoji);
      onClose();
    } catch (e) {
      setError(e.message);
      setSaving(null);
    }
  }

  const allEmojis = AVATAR_BASES.flatMap(base => AVATAR_TONES.map(tone => base + tone));

  return (
    <Portal>
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'flex', alignItems: 'flex-end',
      background: 'rgba(0,0,0,0.35)' }} onClick={onClose}>
      <div style={{ width: '100%', background: 'var(--bg)', borderRadius: '24px 24px 0 0',
        padding: '20px 20px 36px', maxHeight: '72vh', display: 'flex', flexDirection: 'column' }}
        onClick={e => e.stopPropagation()}>
        <div style={{ fontSize: 15, fontWeight: 800, color: 'var(--ink)', textAlign: 'center',
          marginBottom: 16, fontFamily: 'var(--font-display)', flexShrink: 0 }}>
          {L('Выбрать аватар', 'Choose avatar')}
        </div>
        <div style={{ overflowY: 'auto', display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12 }}>
          {allEmojis.map(combo => {
            const isCurrent = kid.emoji === combo;
            return (
              <button key={combo} onClick={() => pick(combo)} disabled={!!saving} className="bk-press" style={{
                aspectRatio: '1', border: 'none', borderRadius: '50%', cursor: 'pointer',
                background: isCurrent ? '#B07848' : '#FBF7F2',
                boxShadow: isCurrent ? '0 4px 14px -4px #B07848' : 'none',
                fontSize: 28, lineHeight: 1,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                opacity: saving && saving !== combo ? 0.35 : 1,
                transition: 'opacity 0.15s',
              }}>{combo}</button>
            );
          })}
        </div>
        {error && (
          <div style={{ marginTop: 12, textAlign: 'center', fontSize: 12.5, color: 'var(--no)', fontWeight: 600, flexShrink: 0 }}>
            {error}
          </div>
        )}
      </div>
    </div>
    </Portal>
  );
}

// ── status: dot, chip ──────────────────────────────────────────
const STATUS_COLOR = { present: 'var(--ok)', absent: '#6B5C4A', late: '#6B5C4A' };
const STATUS_KEY   = { present: 'present', absent: 'absent', late: 'absent' };
const STATUS_TONE  = { present: { bg: '#D4F0DF', ink: '#1F6B4A' }, absent: { bg: '#E7E1D9', ink: '#6B5C4A' }, late: { bg: '#E7E1D9', ink: '#6B5C4A' } };

function StatusDot({ status, size = 9 }) {
  return <span style={{ width: size, height: size, borderRadius: '50%', background: STATUS_COLOR[status], display: 'inline-block', flexShrink: 0 }} />;
}

function StatusChip({ status, onClick }) {
  const label = t(STATUS_KEY[status]);
  const tone = STATUS_TONE[status];
  return (
    <button onClick={onClick} className="bk-press" style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minWidth: 64,
      padding: '6px 11px', borderRadius: 999, border: 'none', cursor: onClick ? 'pointer' : 'default',
      background: tone.bg, color: tone.ink,
      fontFamily: 'inherit', fontWeight: 700, fontSize: 13, letterSpacing: '-0.01em',
    }}>
      {label}
    </button>
  );
}

// ── donut ring with center label ───────────────────────────────
function Ring({ pct, size = 132, stroke = 14, color = 'var(--accent)', track = 'rgba(0,0,0,0.06)', children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - pct / 100);
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={track} strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}
          style={{ transition: 'stroke-dashoffset 0.9s cubic-bezier(.22,1,.36,1)' }} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', textAlign: 'center' }}>
        {children}
      </div>
    </div>
  );
}

// ── horizontal bar row (e.g. by-group attendance) ──────────────
function BarRow({ label, value, max = 100, color = 'var(--accent)', right }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
      <div style={{ width: 78, fontSize: 14, fontWeight: 600, color: 'var(--ink)', flexShrink: 0 }}>{label}</div>
      <div style={{ flex: 1, height: 10, borderRadius: 999, background: 'rgba(0,0,0,0.05)', overflow: 'hidden' }}>
        <div style={{ width: `${(value / max) * 100}%`, height: '100%', borderRadius: 999, background: color,
          transition: 'width 0.8s cubic-bezier(.22,1,.36,1)' }} />
      </div>
      <div style={{ width: 42, textAlign: 'right', fontSize: 13, fontWeight: 700, color: 'var(--ink-soft)', flexShrink: 0 }}>{right}</div>
    </div>
  );
}

// ── soft card ──────────────────────────────────────────────────
function Card({ children, style, onClick, pad = 16 }) {
  return (
    <div onClick={onClick} className={onClick ? 'bk-press' : ''} style={{
      background: 'var(--card)', borderRadius: 22, padding: pad,
      boxShadow: '0 1px 2px rgba(60,40,20,0.04), 0 8px 24px -16px rgba(60,40,20,0.18)',
      cursor: onClick ? 'pointer' : 'default', ...style,
    }}>{children}</div>
  );
}

// ── small section label ────────────────────────────────────────
function SectionLabel({ children, right }) {
  return (
    <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', margin: '0 4px 10px' }}>
      <div style={{ fontSize: 13, fontWeight: 700, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--ink-soft)' }}>{children}</div>
      {right}
    </div>
  );
}

// ── chevron ────────────────────────────────────────────────────
function Chevron({ dir = 'right', size = 16, color = 'var(--ink-faint)' }) {
  const rot = { right: 0, left: 180, down: 90, up: -90 }[dir];
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" style={{ transform: `rotate(${rot}deg)`, flexShrink: 0 }}>
      <path d="M6 3l5 5-5 5" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

Object.assign(window, { clsx, Avatar, StatusDot, StatusChip, Ring, BarRow, Card, SectionLabel, Chevron, STATUS_COLOR });

</script>
<script type="text/babel">
// screens1.jsx — Home + Children flow. Exported to window.
// Globals available: t(), L(ru,en), Lo(obj), DATA, Avatar, StatusChip, StatusDot, Ring, Card, SectionLabel, Chevron

// ════════════════════════════════════════════════════════════════
//  HOME
// ════════════════════════════════════════════════════════════════
function HomeScreen({ go, statuses, feed, homeStyle }) {
  const kids = activeKids();
  const present = kids.filter(k => statuses[k.id] !== 'absent').length;
  const rate = Math.round((kids.filter(k => statuses[k.id] === 'present').length) / kids.length * 100);
  const unread = feed.filter(f => f.unread).length;

  const TILES = [
    { key: 'children',      emoji: '👦🏼', color: '#D4F0DF', colorLight: '#EAF8F0', colorDark: '#A9C8B2', ink: '#1f7a55', go: 'children',
      badge: `${kids.length} ${t('kids')}` },
    { key: 'attendance',    emoji: '📋', color: '#CDE8FB', colorLight: '#E8F4FD', colorDark: '#A4BCE9', ink: '#1f5f86', go: 'attendance',
      badge: `${present}/${kids.length}` },
    // teachers don't handle money — director/staff only, see also the
    // route guard in App() that catches direct navigation there too
    ...(window.__isTeacher ? [] : [
      { key: 'payments', emoji: '💰', color: '#FBE0C0', colorLight: '#FDF4EA', colorDark: '#C9A882', ink: '#8a5010', go: 'payments',
        badge: null },
    ]),
    { key: 'activities',    emoji: '🎨', color: '#E8D5FB', colorLight: '#F5EFFD', colorDark: '#B8A0D8', ink: '#5a2a86', go: 'activities',
      badge: null },
    { key: 'summary',       emoji: '🗞️', color: '#FBE7A8', colorLight: '#FDFAF0', colorDark: '#C9B986', ink: '#8a6410', go: 'summary',
      badge: `${rate}%` },
    { key: 'notifications', emoji: '⭐', color: '#FBD9E1', colorLight: '#FDF0F3', colorDark: '#C9ADBA', ink: '#a8456a', go: 'notifications',
      badge: unread ? `${unread} ${t('unread')}` : null, dot: unread > 0, count: unread },
    // director-only (Ольга + Alex) — staff module, not for teachers.
    // Opens straight into today's Journal (marking who's in/out) rather
    // than the staff-cards list — that's the thing actually used day to
    // day, cards are one tap away from there instead.
    ...(window.__isDirector ? [
      { key: 'team', emoji: '👩‍🏫', color: '#E8E0D5', colorLight: '#F2EDE8', colorDark: '#C0B5A8', ink: '#5a4a30', go: 'staff-daily',
        badge: null },
    ] : []),
  ];

  const hour = new Date().getHours();
  const greet = hour < 12 ? t('greetingAM') : t('greetingPM');
  const greetName = window.__isDirector ? L('Ольга', 'Olga')
    : ((window.__isTeacher || window.__isStaff) && window.__teacherName) ? window.__teacherName
    : L('Команда', 'Team');

  return (
    <div style={{ padding: '8px 20px 28px' }}>
      {/* greeting hero */}
      <div style={{ position: 'relative', overflow: 'hidden', borderRadius: 26, padding: 16, margin: '4px 0 22px',
        background: '#fde6df',
        boxShadow: '0 1px 2px rgba(60,40,20,0.04), 0 16px 32px -24px rgba(60,40,20,0.55)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 13 }}>
          <div style={{ width: 52, height: 52, borderRadius: '50%', background: 'var(--card)',
            display: 'grid', placeItems: 'center', fontSize: 29, flexShrink: 0,
            boxShadow: '0 8px 18px -10px var(--accent)' }}>🐻</div>
          <div style={{ flex: 1, minWidth: 0, lineHeight: 1.22 }}>
            <div style={{ fontSize: 13.5, color: 'var(--ink-soft)', fontWeight: 600 }}>{greet},</div>
            <div style={{ fontSize: 21, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)' }}>{greetName}</div>
          </div>
          <div style={{ textAlign: 'right', lineHeight: 1.2, flexShrink: 0 }}>
            <div style={{ fontSize: 11.5, color: 'var(--ink-faint)', fontWeight: 700 }}>{t('today')}</div>
            <div style={{ fontSize: 14, color: 'var(--ink)', fontWeight: 800 }}>{(() => { const d = new Date(); return L(`${d.getDate()} ${['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()]}`, `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]} ${d.getDate()}`); })()}</div>
          </div>
        </div>
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, marginTop: 14,
          background: 'var(--card)', borderRadius: 999, padding: '7px 14px 7px 11px',
          boxShadow: '0 1px 2px rgba(60,40,20,0.05)' }}>
          <span style={{ width: 9, height: 9, borderRadius: '50%', background: 'var(--ok)', flexShrink: 0 }} />
          <span style={{ fontSize: 13.5, color: 'var(--ink)', fontWeight: 700 }}>
            <b style={{ fontWeight: 800 }}>{present}/{kids.length}</b> {L('детей в саду', 'kids present')}
          </span>
        </div>
      </div>

      {homeStyle === 'list'   && <HomeList   tiles={TILES} go={go} />}
      {homeStyle === 'cards'  && <HomeCards  tiles={TILES} go={go} />}
      {(homeStyle === 'circles' || !homeStyle) && <HomeCircles tiles={TILES} go={go} />}
    </div>
  );
}

// reference layout: big pastel circles, 2×2
function HomeCircles({ tiles, go }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '26px 18px', marginTop: 8 }}>
      {tiles.map(tile => (
        <button key={tile.key} onClick={() => go(tile.go)} className="bk-press" style={{
          border: 'none', background: 'none', cursor: 'pointer', fontFamily: 'inherit',
          display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14, padding: 0 }}>
          <div style={{ position: 'relative', width: 132, height: 132, borderRadius: '50%',
            background: tile.color,
            display: 'grid', placeItems: 'center', fontSize: 52,
            boxShadow: '0 4px 16px rgba(60,40,20,0.08)' }}>
            <span>{tile.emoji}</span>
            {tile.key === 'notifications' && tile.count > 0 && (
              <span style={{ position: 'absolute', top: 4, right: '10%', background: 'var(--card)', color: tile.ink,
                fontSize: 12, fontWeight: 800, padding: '4px 9px', borderRadius: 999,
                boxShadow: '0 2px 8px -2px rgba(60,40,20,0.25)' }}>
                {tile.count}
              </span>
            )}
          </div>
          <div style={{ fontSize: 13, fontWeight: 800, color: '#B07848', fontFamily: 'var(--font-display)', background: 'transparent', padding: '5px 14px', borderRadius: 999, border: '2px solid #B07848' }}>{t(tile.key)}</div>
        </button>
      ))}
    </div>
  );
}

// informative rounded cards, 2×2
function HomeCards({ tiles, go }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
      {tiles.map(tile => (
        <button key={tile.key} onClick={() => go(tile.go)} className="bk-press" style={{
          border: 'none', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left',
          background: `color-mix(in srgb, ${tile.color} 55%, var(--card))`, borderRadius: 24, padding: 16,
          display: 'flex', flexDirection: 'column', gap: 14, minHeight: 132,
          boxShadow: '0 1px 2px rgba(60,40,20,0.04), 0 10px 24px -18px rgba(60,40,20,0.4)' }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' }}>
            <div style={{ width: 50, height: 50, borderRadius: '50%', background: tile.color,
              display: 'grid', placeItems: 'center', fontSize: 26 }}>{tile.emoji}</div>
            {tile.badge && (
              <span style={{ background: 'var(--card)', color: tile.ink, fontSize: 12, fontWeight: 800,
                padding: '5px 10px', borderRadius: 999, boxShadow: '0 2px 6px -2px rgba(60,40,20,0.2)' }}>{tile.badge}</span>
            )}
          </div>
          <div style={{ marginTop: 'auto' }}>
            <div style={{ fontSize: 17, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)' }}>{t(tile.key)}</div>
            <div style={{ fontSize: 12.5, color: 'var(--ink-soft)', fontWeight: 600, marginTop: 2 }}>{t(tile.key + '_sub')}</div>
          </div>
        </button>
      ))}
    </div>
  );
}

// compact full-width rows
function HomeList({ tiles, go }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      {tiles.map(tile => (
        <button key={tile.key} onClick={() => go(tile.go)} className="bk-press" style={{
          border: 'none', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left', width: '100%',
          background: 'var(--card)', borderRadius: 20, padding: '14px 16px',

};

const ALLERGENS = [
  { id: 'nuts',       en: 'Nuts',       ru: 'Орехи',        emoji: '🥜🚫' },
  { id: 'dairy',      en: 'Dairy',      ru: 'Молоко',       emoji: '🥛🚫' },
  { id: 'eggs',       en: 'Eggs',       ru: 'Яйца',         emoji: '🥚🚫' },
  { id: 'gluten',     en: 'Gluten',     ru: 'Глютен',       emoji: '🌾🚫' },
  { id: 'soy',        en: 'Soy',        ru: 'Соя',          emoji: '🌱🚫' },
  { id: 'fish',       en: 'Fish',       ru: 'Рыба',         emoji: '🐟🚫' },
  { id: 'shellfish',  en: 'Shellfish',  ru: 'Морепродукты', emoji: '🦐🚫' },
  { id: 'strawberry', en: 'Strawberry', ru: 'Клубника',     emoji: '🍓🚫' },
  { id: 'citrus',     en: 'Citrus',     ru: 'Цитрусы',      emoji: '🍊🚫' },
  { id: 'grapefruit', en: 'Grapefruit', ru: 'Грейпфрут',   emoji: '🍊🚫' },
  { id: 'chocolate',  en: 'Chocolate',  ru: 'Шоколад',      emoji: '🍫🚫' },
];

const _ALLERGEN_ALIASES = {
  citrus:    ['citrus', 'orange', 'lemon', 'цитрус'],
  chocolate: ['chocolate', 'cocoa', 'шоколад', 'какао'],
  shellfish: ['shellfish', 'seafood', 'морепродукт'],
  strawberry:['strawberry', 'berry', 'клубник', 'ягод'],
};

function parseAllergens(str) {
  const s = str || '';
  const found = ALLERGENS.filter(a => {
    const aliases = _ALLERGEN_ALIASES[a.id] || [a.en.toLowerCase(), a.ru.toLowerCase()];
    return aliases.some(kw => new RegExp('\\b' + kw, 'i').test(s));
  }).map(a => a.id);
  let note = s;
  for (const a of ALLERGENS.filter(x => found.includes(x.id))) {
    note = note.replace(new RegExp(',?\\s*' + a.en + '\\s*,?', 'gi'), ',');
    note = note.replace(new RegExp(',?\\s*' + a.ru + '\\s*,?', 'gi'), ',');
  }
  note = note.replace(/^[,\s]+|[,\s]+$/g, '').trim();
  return { allergens: found, allergyNote: note };
}

  const toggle = id => {

function ageFromDob(dob) {
  if (!dob) return '—';
  const [d, m, y] = dob.split('.').map(Number);
  if (!d || !m || !y || isNaN(d) || isNaN(m) || isNaN(y)) return '—';
  const now = new Date();
  let a = now.getFullYear() - y;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) a--;
  return `${a} ${t('years')}`;
}

<script type="text/babel">
// screens2.jsx — Attendance, Summary, Notifications, Compose. Exported to window.

// ════════════════════════════════════════════════════════════════
//  ATTENDANCE — tap to cycle present → late → absent
// ════════════════════════════════════════════════════════════════
const CYCLE = { present: 'absent', absent: 'present', late: 'present' };

function Portal({ children }) {
  const el = React.useMemo(() => {
    const div = document.createElement('div');
    document.body.appendChild(div);
    return div;
  }, []);
  React.useEffect(() => () => { if (document.body.contains(el)) document.body.removeChild(el); }, [el]);
  return ReactDOM.createPortal(children, el);
}

function MiniCalendar({ selected, onSelect, onClose, disableWeekends = true, disableFuture = true }) {
  const today = todayStr();
  const init = new Date((selected || today) + 'T12:00:00');
  const [viewYear,  setViewYear]  = React.useState(init.getFullYear());
  const [viewMonth, setViewMonth] = React.useState(init.getMonth());

  const MR = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const ME = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DH = [L('Пн','Mo'),L('Вт','Tu'),L('Ср','We'),L('Чт','Th'),L('Пт','Fr'),L('Сб','Sa'),L('Вс','Su')];

  const todayDate  = new Date(today + 'T12:00:00');
  const isAtLatest = disableFuture && (viewYear > todayDate.getFullYear() ||
    (viewYear === todayDate.getFullYear() && viewMonth >= todayDate.getMonth()));

  function prevMonth() {
    if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); }
    else setViewMonth(m => m - 1);
  }
  function nextMonth() {
    if (isAtLatest) return;
    if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); }
    else setViewMonth(m => m + 1);
  }

  const firstDay = new Date(viewYear, viewMonth, 1);
  let startDow = firstDay.getDay(); if (startDow === 0) startDow = 7; startDow -= 1;
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const cells = [...Array(startDow).fill(null), ...Array.from({length: daysInMonth}, (_, i) => i + 1)];

  function ds(d) {
    return `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 250, background: 'rgba(0,0,0,0.4)',
      display: 'flex', alignItems: 'flex-end' }} onClick={onClose}>
      <div style={{ width: '100%', background: 'var(--bg)', borderRadius: '24px 24px 0 0',
        padding: '12px 20px 36px' }} onClick={e => e.stopPropagation()}>
        <div style={{ width: 40, height: 4, background: 'rgba(60,40,20,0.15)', borderRadius: 2, margin: '0 auto 14px' }} />
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <button onClick={prevMonth} style={{ border:'none', background:'none', fontSize:24, cursor:'pointer', color:'var(--ink)', padding:'0 10px' }}>‹</button>
          <div style={{ fontSize:16, fontWeight:800, color:'var(--ink)', fontFamily:'var(--font-display)' }}>
            {L(MR[viewMonth], ME[viewMonth])} {viewYear}
          </div>
          <button onClick={nextMonth} style={{ border:'none', background:'none', fontSize:24, cursor:'pointer',
            color: isAtLatest ? 'var(--ink-faint)' : 'var(--ink)', padding:'0 10px' }}>›</button>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom:4 }}>
          {DH.map((d,i) => <div key={d} style={{ textAlign:'center', fontSize:11, fontWeight:700,
            color: i>=5 ? '#C09080' : 'var(--ink-faint)', padding:'3px 0' }}>{d}</div>)}
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2 }}>
          {cells.map((d, i) => {
            if (!d) return <div key={`e${i}`} />;
            const dateStr = ds(d);
            const date    = new Date(dateStr + 'T12:00:00');
            const wday    = date.getDay();
            const isWknd  = wday === 0 || wday === 6;
            const isFuture= dateStr > today;
            const isSel   = dateStr === selected;
            const isTdy   = dateStr === today;
            const disabled= (disableWeekends && isWknd) || (disableFuture && isFuture);
            return (
              <button key={d} disabled={disabled}
                onClick={() => { if (!disabled) { onSelect(dateStr); onClose(); } }}
                style={{ border:'none', borderRadius:10, padding:'9px 2px', fontSize:14,
                  fontWeight: isSel||isTdy ? 800 : 500, cursor: disabled ? 'default' : 'pointer',
                  background: isSel ? '#B07848' : isTdy ? '#F0E4D4' : 'transparent',
                  color: isSel ? '#fff' : (disableWeekends && isWknd) ? '#D4B8B0' : (disableFuture && isFuture) ? 'var(--ink-faint)' : 'var(--ink)',
                  opacity: (disableFuture && isFuture) ? 0.35 : 1 }}>
                {d}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function dayCount(a, b) {
  const d1 = new Date(a + 'T12:00:00'), d2 = new Date(b + 'T12:00:00');
  return Math.round((d2 - d1) / 86400000) + 1;
}

// picks whichever log entry covers furthest into the future — mirrors the
// backend's _best_coverage, used client-side for clubs since a kid's
// per-club coverage is never cached anywhere, only derived from the log
function bestCoverage(entries) {
  let best = null;
  entries.forEach(e => {
    if (!e.until) return;
    if (!best || normDate(e.until) > normDate(best.until)) best = e;
  });
  return best ? { from: best.from, until: best.until } : { from: '', until: '' };
}

// Shared day-cell visual language for the Payments and Attendance calendars,
// so they read identically wherever they're opened from: green fill = the
// kid was present that day, small coin badge = the day is covered by a
// payment (never on weekends — daycare's closed then, so "paid" doesn't
// mean anything for those days), pink = weekend, brown = actively picking
// a new payment range (Payments calendar only, takes priority over green
// since it's the thing being actively edited).
function calendarCellVisual({ isEdge, inRange, isWknd, isPresent, isTdy }) {
  // the exact start/end of a range you're picking gets a beige mark so you
  // can see your two taps; everything between them stays plain — the
  // sticker preview (rendered separately, see isPicking) carries that
  // signal instead of a solid fill, and weekends keep looking like
  // weekends throughout instead of getting swallowed by range shading
  if (isEdge)     return { background: '#F0E4D4', color: 'var(--ink)' };
  if (isWknd)     return { background: '#FBD9E1', color: 'var(--ink)' };
  if (inRange)    return { background: 'transparent', color: 'var(--ink)' };
  if (isPresent)  return { background: '#8FCB9E', color: '#1a4a2c' };
  if (isTdy)      return { background: '#F7EFE4', color: 'var(--ink)' };
  return { background: 'transparent', color: 'var(--ink)' };
}

// "Paid" badge, styled like a little sticker slapped on top of the day
// cell — gradient + lift shadow + a slight tilt — rather than a flat icon.
function PaidBadge({ muted }) {
  return (
    <span style={{
      position: 'absolute', top: -6, right: -6, width: 16, height: 16, borderRadius: '50%',
      background: 'linear-gradient(135deg, #F0D060, #C2941A)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: 9.5, fontWeight: 900, color: '#4a3705', lineHeight: 1,
      boxShadow: '0 2px 3px rgba(60,40,10,0.35), 0 0 0 2px var(--bg)',
      opacity: muted ? 0.4 : 1, transition: 'opacity 0.4s ease',
      transform: 'rotate(-9deg)' }}>✓</span>
  );
}

function PayRangeSheet({ kid, tariff, price, loadHistory, loadAttendanceHistory, legacyCoverage, onConfirm, onDelete, onClose }) {
  const today = todayStr();
  const init = new Date(today + 'T12:00:00');
  const [viewYear,  setViewYear]  = React.useState(init.getFullYear());
  const [viewMonth, setViewMonth] = React.useState(init.getMonth());
  const [rangeFrom, setRangeFrom] = React.useState(null);
  const [rangeTo,   setRangeTo]   = React.useState(null);
  const [amount,        setAmount]        = React.useState('');
  const [amountTouched, setAmountTouched] = React.useState(false);
  const [history,    setHistory]    = React.useState([]);
  const [attHistory, setAttHistory] = React.useState({});
  const [saving,     setSaving]     = React.useState(false);
  // Payment history can grow long for an active kid (every carried-over day
  // adds its own row) — the calendar above still needs the *full* history
  // to correctly shade any month, but the list below only ever shows the
  // most recent HISTORY_PAGE_SIZE, with "load more" revealing more of what
  // was already fetched (one network call, not one per page).
  const HISTORY_PAGE_SIZE = 10;
  const [visibleCount, setVisibleCount] = React.useState(HISTORY_PAGE_SIZE);

  React.useEffect(() => {
    loadHistory().then(setHistory).catch(() => {});
    // Garden (no prop passed) shows whether the kid was at the garden;
    // Clubs pass their own loader so the calendar shows whether the kid
    // showed up to THAT club instead — they're different attendance sheets.
    (loadAttendanceHistory || (() => window.loadAttendanceHistory(kid.id)))()
      .then(setAttHistory).catch(() => {});
  }, [kid.id]);

  // every day covered by an already-logged payment, for the "you can already
  // see what's paid" highlight — separate from the new range being picked.
  // Also folds in legacyCoverage (the child's cached Paid from/until) for
  // kids whose current coverage predates the payment log entirely — the
  // log would otherwise be empty and show nothing highlighted even though
  // they're actually marked paid right now.
  const paidDays = React.useMemo(() => {
    const set = new Set();
    const entries = legacyCoverage && legacyCoverage.from && legacyCoverage.until
      ? [...history, legacyCoverage] : history;
    entries.forEach(h => {
      const from = normDate(h.from), until = normDate(h.until);
      if (!from || !until) return;
      let d = new Date(from + 'T12:00:00');
      const end = new Date(until + 'T12:00:00');
      while (d <= end) {
        set.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
        d.setDate(d.getDate() + 1);
      }
    });
    // A carried-over day moves the paid mark from the missed day it names
    // (embedded in Marked by, e.g. "Система: перенос пропуска 21.07.2026")
    // onto the new day it adds — the total count of paid days doesn't grow,
    // it just shifts by one, so the missed day itself no longer shows as
    // paid. Detected off Marked by's text rather than Tariff, since Club
    // payment log has no Tariff column at all (only the garden one does).
    entries.forEach(h => {
      const m = (h.markedBy || '').match(/^Система: перенос пропуска (\d{2}\.\d{2}\.\d{4})/);
      if (m) set.delete(normDate(m[1]));
    });
    return set;
  }, [history, legacyCoverage]);

  React.useEffect(() => {
    if (amountTouched || !rangeFrom || !rangeTo) return;
    // price === undefined means the caller didn't pass one at all (garden
    // rows), so fall back to the child's own price; price === null means
    // the caller (clubs) explicitly has no price on record — don't guess
    // by falling back to an unrelated field, just leave the amount blank
    const basePrice = Number(price !== undefined ? price : kid.price) || 0;
    const suggested = tariff === 'tourist' ? basePrice * dayCount(rangeFrom, rangeTo) : basePrice;
    setAmount(suggested ? String(suggested) : '');
  }, [rangeFrom, rangeTo, tariff]);

  const MR = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const ME = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DH = [L('Пн','Mo'),L('Вт','Tu'),L('Ср','We'),L('Чт','Th'),L('Пт','Fr'),L('Сб','Sa'),L('Вс','Su')];

  function prevMonth() {
    if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); }
    else setViewMonth(m => m - 1);
  }
  function nextMonth() {
    if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); }
    else setViewMonth(m => m + 1);
  }

  const firstDay = new Date(viewYear, viewMonth, 1);
  let startDow = firstDay.getDay(); if (startDow === 0) startDow = 7; startDow -= 1;
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const cells = [...Array(startDow).fill(null), ...Array.from({length: daysInMonth}, (_, i) => i + 1)];

  function ds(d) {
    return `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  // first tap starts a fresh range; second tap closes it (swapping if picked before the start)
  function handlePick(dateStr) {
    if (saving || justConfirmed) return;
    if (!rangeFrom || rangeTo) { setRangeFrom(dateStr); setRangeTo(null); }
    else if (dateStr < rangeFrom) { setRangeTo(rangeFrom); setRangeFrom(dateStr); }
    else { setRangeTo(dateStr); }
  }

  const [deletingId, setDeletingId] = React.useState(null);
  // held true for a beat after a successful confirm so the just-picked
  // range's stickers can visibly brighten before the sheet closes, instead
  // of the days you just paid for silently vanishing off-screen
  const [justConfirmed, setJustConfirmed] = React.useState(false);
  const canConfirm = !!(rangeFrom && rangeTo && Number(amount) > 0) && !saving && !justConfirmed;
  const fmt = d => d ? d.split('-').reverse().join('.') : '—';

  async function handleDelete(id) {
    setDeletingId(id);
    try {
      await onDelete(id);
      // re-fetch rather than locally filter — deleting shifts every later
      // row's sheet row number, so a second delete in the same session
      // needs fresh ids, not the ones fetched before the first delete
      const fresh = await loadHistory();
      setHistory(fresh);
    } catch (e) {
      window.showToast(L('Не удалось удалить: ', 'Failed to delete: ') + String(e));
    } finally {
      setDeletingId(null);
    }
  }

  async function handleConfirm() {
    if (!canConfirm) return;
    setSaving(true);
    try {
      await onConfirm(rangeFrom, rangeTo, amount);
      setSaving(false);
      setJustConfirmed(true);
      setTimeout(onClose, 1100);
    } catch (e) {
      setSaving(false);
    }
  }

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 260, background: 'rgba(0,0,0,0.4)',
      display: 'flex', alignItems: 'flex-end' }} onClick={onClose}>
      <div style={{ width: '100%', maxHeight: '80vh', overflowY: 'auto', background: 'var(--bg)', borderRadius: '24px 24px 0 0',
        padding: '12px 20px 32px' }} onClick={e => e.stopPropagation()}>
        {/* drag-handle doubles as an explicit close tap target — the backdrop
            strip above the sheet can end up too thin to reliably hit on a
            real phone, this always works regardless of sheet height */}
        <div onClick={onClose} style={{ padding: '6px 0 10px', margin: '-6px 0 4px', cursor: 'pointer' }}>
          <div style={{ width: 40, height: 4, background: 'rgba(60,40,20,0.15)', borderRadius: 2, margin: '0 auto' }} />
        </div>
        <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-soft)', textAlign: 'center', marginBottom: 12 }}>
          {Lo(kid)}
        </div>
        <div style={{ display: 'flex', justifyContent: 'center', gap: 20, marginBottom: 16, flexWrap: 'wrap' }}>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)', marginBottom: 2 }}>{L('Оплачено с', 'Paid from')}</div>
            <div style={{ fontSize: 16, fontWeight: 800, fontFamily: 'var(--font-display)',
              color: rangeFrom ? 'var(--ink)' : 'var(--ink-faint)' }}>{fmt(rangeFrom)}</div>
          </div>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)', marginBottom: 2 }}>{L('Оплачено до', 'Paid until')}</div>
            <div style={{ fontSize: 16, fontWeight: 800, fontFamily: 'var(--font-display)',
              color: rangeTo ? 'var(--ink)' : 'var(--ink-faint)' }}>{fmt(rangeTo)}</div>
          </div>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)', marginBottom: 2 }}>{L('Сумма', 'Amount')}</div>
            <input type="number" inputMode="numeric" value={amount}
              onChange={e => { setAmount(e.target.value); setAmountTouched(true); }}
              placeholder="0"
              style={{ width: 110, textAlign: 'center', fontSize: 16, fontWeight: 800, fontFamily: 'var(--font-display)',
                border: 'none', borderBottom: '2px solid #E7DCC8', background: 'transparent', color: 'var(--ink)',
                outline: 'none', padding: '0 4px 2px' }} />
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <button onClick={prevMonth} style={{ border:'none', background:'none', fontSize:24, cursor:'pointer', color:'var(--ink)', padding:'0 10px' }}>‹</button>
          <div style={{ fontSize:16, fontWeight:800, color:'var(--ink)', fontFamily:'var(--font-display)' }}>
            {L(MR[viewMonth], ME[viewMonth])} {viewYear}
          </div>
          <button onClick={nextMonth} style={{ border:'none', background:'none', fontSize:24, cursor:'pointer', color:'var(--ink)', padding:'0 10px' }}>›</button>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom:4 }}>
          {DH.map((d,i) => <div key={d} style={{ textAlign:'center', fontSize:11, fontWeight:700,
            color: i>=5 ? '#C0748E' : 'var(--ink-faint)', padding:'3px 0' }}>{d}</div>)}
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom: 10 }}>
          {cells.map((d, i) => {
            if (!d) return <div key={`e${i}`} />;
            const dateStr = ds(d);
            const dow     = new Date(dateStr + 'T12:00:00').getDay();
            const isWknd  = dow === 0 || dow === 6;
            const isEdge  = dateStr === rangeFrom || dateStr === rangeTo;
            const inRange = rangeFrom && rangeTo && dateStr > rangeFrom && dateStr < rangeTo;
            const isPaidDay = paidDays.has(dateStr);
            const isTdy   = dateStr === today;
            const isPresent = attHistory[dateStr] === 'present';
            const { background, color } = calendarCellVisual({ isEdge, inRange, isWknd, isPresent, isTdy });
            // the range you're actively picking previews as a dim sticker —
            // "this is about to be marked paid" — then brightens for a beat
            // once Confirm actually saves it, instead of just vanishing
            const isPicking = (isEdge || inRange) && !isWknd && !isPaidDay;
            return (
              <button key={d} onClick={() => handlePick(dateStr)}
                style={{ position: 'relative', border:'none', borderRadius: 10, padding:'9px 2px', fontSize:14,
                  fontWeight: isEdge||isTdy ? 800 : 500, cursor: 'pointer',
                  background, color }}>
                {d}
                {isPaidDay && !isWknd && <PaidBadge />}
                {isPicking && <PaidBadge muted={!justConfirmed} />}
              </button>
            );
          })}
        </div>
        <div style={{ display: 'flex', gap: 12, fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)',
          justifyContent: 'center', marginBottom: 20, flexWrap: 'wrap' }}>
          <span><span style={{ display:'inline-block', width:9, height:9, borderRadius:3, background:'#8FCB9E', marginRight:4 }} />{L('был в саду', 'was here')}</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
            <span style={{ position: 'relative', width: 12, height: 12, display: 'inline-block' }}><PaidBadge /></span>
            {L('оплачено', 'paid')}
          </span>
          <span><span style={{ display:'inline-block', width:9, height:9, borderRadius:3, background:'#FBD9E1', marginRight:4 }} />{L('выходной', 'weekend')}</span>
        </div>
        {history.length > 0 && (
          <div style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.03em' }}>
              {L('История платежей', 'Payment history')}
            </div>
            {history.length > visibleCount && (
              // Above the list, not below — with a long history, a button
              // at the bottom would mean scrolling all the way past
              // everything already loaded just to ask for more of it.
              <button onClick={() => setVisibleCount(n => n + HISTORY_PAGE_SIZE)} className="bk-press" style={{
                width: '100%', border: 'none', cursor: 'pointer', background: '#EFE6D8', color: 'var(--ink-soft)',
                fontFamily: 'inherit', fontSize: 12, fontWeight: 700, padding: '8px 12px', borderRadius: 12,
                marginBottom: 6 }}>
                {L('Загрузить ещё', 'Load more')}
              </button>
            )}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {history.slice().reverse().slice(0, visibleCount).map(h => (
                <div key={h.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  background: '#FBF7F2', borderRadius: 12, padding: '8px 12px' }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink)' }}>
                    {h.from.split('.').slice(0,2).join('.')}–{h.until} · {fmtMoney(h.amount)}
                    {h.markedBy && (
                      <div style={{ fontSize: 11, fontWeight: 500, color: 'var(--ink-faint)', marginTop: 1 }}>
                        {formatMarkedBy(h.markedBy)}
                      </div>
                    )}
                  </span>
                  <button onClick={() => handleDelete(h.id)} disabled={deletingId === h.id}
                    style={{ border: 'none', background: 'none', cursor: 'pointer', fontSize: 16,
                      color: '#c0392b', padding: 4, opacity: deletingId === h.id ? 0.4 : 1 }}>✕</button>
                </div>
              ))}
            </div>
          </div>
        )}
        <button onClick={handleConfirm} disabled={!canConfirm} className="bk-press"
          style={{ width: '100%', border: 'none', cursor: canConfirm ? 'pointer' : 'default',
            fontFamily: 'var(--font-display)',
            background: justConfirmed ? '#F2A81D' : canConfirm ? '#B07848' : '#E7E1D9',
            color: justConfirmed ? '#3E2510' : canConfirm ? '#fff' : 'var(--ink-faint)',
            fontSize: 17, fontWeight: 800, padding: 15, borderRadius: 18, transition: 'background 0.25s, color 0.25s',
            boxShadow: justConfirmed ? '0 10px 24px -8px #F2A81D' : canConfirm ? '0 10px 24px -8px #B07848' : 'none' }}>
          {justConfirmed ? L('Сохранено ✓', 'Saved ✓') : saving ? L('Сохраняю…', 'Saving…') : L('Подтвердить оплату', 'Confirm payment')}
        </button>
      </div>
    </div>
  );
}

// Per-kid history — same day-cell visual language as PayRangeSheet (green
// fill = was in the garden that day, coin badge = covered by a payment).
// Tap a past/today day to toggle attendance right there — same
// present/absent flip the Journal uses, it just writes through
// window.saveAttendance for that one (date, kid) pair instead of the
// whole day's roster. Unlike the Payments calendar, this one only edits
// attendance, never payments, and future dates stay disabled.
function AttendanceHistorySheet({ kid, onClose }) {
  const today = todayStr();
  const init = new Date(today + 'T12:00:00');
  const [viewYear,  setViewYear]  = React.useState(init.getFullYear());
  const [viewMonth, setViewMonth] = React.useState(init.getMonth());
  const [history,   setHistory]   = React.useState(null);
  const [log,       setLog]       = React.useState([]);
  const [pending,   setPending]   = React.useState(null);

  React.useEffect(() => {
    Promise.all([
      window.loadAttendanceHistory(kid.id),
      window.loadPaymentLog(kid.id).catch(() => []),
    ]).then(([h, l]) => { setHistory(h); setLog(l); }).catch(() => setHistory({}));
  }, [kid.id]);

  // most real kids have no Paid-from on record — default the start to today,
  // same fallback PaymentsGardenScreen uses, or the dot would never show up
  const legacyCoverage = { from: kid.paidFrom || todayStr(), until: kid.paidUntil };
  const paidDays = React.useMemo(() => {
    const set = new Set();
    const entries = legacyCoverage.from && legacyCoverage.until ? [...log, legacyCoverage] : log;
    entries.forEach(h => {
      const from = normDate(h.from), until = normDate(h.until);
      if (!from || !until) return;
      let d = new Date(from + 'T12:00:00');
      const end = new Date(until + 'T12:00:00');
      while (d <= end) {
        set.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
        d.setDate(d.getDate() + 1);
      }
    });
    // Same shift as PayRangeSheet's calendar: a carried-over day moves the
    // paid mark from the missed day it names onto the new day it adds, so
    // this calendar (opened by tapping a kid straight from the Journal)
    // doesn't disagree with the one under Payments about which day is paid.
    entries.forEach(h => {
      const m = (h.markedBy || '').match(/^Система: перенос пропуска (\d{2}\.\d{2}\.\d{4})/);
      if (m) set.delete(normDate(m[1]));
    });
    return set;
  }, [log, kid.paidFrom, kid.paidUntil]);

  const MR = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const ME = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DH = [L('Пн','Mo'),L('Вт','Tu'),L('Ср','We'),L('Чт','Th'),L('Пт','Fr'),L('Сб','Sa'),L('Вс','Su')];

  function prevMonth() {
    if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); }
    else setViewMonth(m => m - 1);
  }
  function nextMonth() {
    if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); }
    else setViewMonth(m => m + 1);
  }

  const firstDay = new Date(viewYear, viewMonth, 1);
  let startDow = firstDay.getDay(); if (startDow === 0) startDow = 7; startDow -= 1;
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const cells = [...Array(startDow).fill(null), ...Array.from({length: daysInMonth}, (_, i) => i + 1)];

  function ds(d) {
    return `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  async function toggleDay(dateStr) {
    if (dateStr > today || pending) return;
    const cur = (history || {})[dateStr] || 'absent';
    const next = cur === 'present' ? 'absent' : 'present';
    setPending(dateStr);
    setHistory(h => ({ ...h, [dateStr]: next }));
    try {
      await window.saveAttendance(dateStr, { [kid.id]: next });
    } catch (e) {
      setHistory(h => ({ ...h, [dateStr]: cur }));
      window.showToast(L('Не удалось сохранить: ', 'Failed to save: ') + String(e));
    } finally {
      setPending(null);
    }
  }

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 260, background: 'rgba(0,0,0,0.4)',
      display: 'flex', alignItems: 'flex-end' }} onClick={onClose}>
      <div style={{ width: '100%', maxHeight: '88vh', overflowY: 'auto', background: 'var(--bg)', borderRadius: '24px 24px 0 0',
        padding: '12px 20px 32px' }} onClick={e => e.stopPropagation()}>
        <div style={{ width: 40, height: 4, background: 'rgba(60,40,20,0.15)', borderRadius: 2, margin: '0 auto 14px' }} />
        <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-soft)', textAlign: 'center', marginBottom: 12 }}>
          {Lo(kid)}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <button onClick={prevMonth} style={{ border:'none', background:'none', fontSize:24, cursor:'pointer', color:'var(--ink)', padding:'0 10px' }}>‹</button>
          <div style={{ fontSize:16, fontWeight:800, color:'var(--ink)', fontFamily:'var(--font-display)' }}>
            {L(MR[viewMonth], ME[viewMonth])} {viewYear}
          </div>
          <button onClick={nextMonth} style={{ border:'none', background:'none', fontSize:24, cursor:'pointer', color:'var(--ink)', padding:'0 10px' }}>›</button>
        </div>
        {history === null ? (
          <div style={{ textAlign: 'center', padding: 40, color: 'var(--ink-faint)', fontSize: 15 }}>…</div>
        ) : (
        <>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom:4 }}>
          {DH.map((d,i) => <div key={d} style={{ textAlign:'center', fontSize:11, fontWeight:700,
            color: i>=5 ? '#C0748E' : 'var(--ink-faint)', padding:'3px 0' }}>{d}</div>)}
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom: 10 }}>
          {cells.map((d, i) => {
            if (!d) return <div key={`e${i}`} />;
            const dateStr = ds(d);
            const dow      = new Date(dateStr + 'T12:00:00').getDay();
            const isWknd   = dow === 0 || dow === 6;
            const isFuture = dateStr > today;
            const isTdy    = dateStr === today;
            const isPresent = history[dateStr] === 'present';
            const isPaidDay = paidDays.has(dateStr);
            const { background, color } = calendarCellVisual({ isWknd, isPresent, isTdy });
            return (
              <button key={d} onClick={() => toggleDay(dateStr)} disabled={isFuture}
                style={{ position: 'relative', border:'none', borderRadius: 10, padding:'9px 2px', fontSize:14,
                  fontWeight: isTdy ? 800 : 500, cursor: isFuture ? 'default' : 'pointer',
                  opacity: isFuture ? 0.35 : (pending === dateStr ? 0.5 : 1),
                  background, color }}>
                {d}
                {isPaidDay && !isWknd && <PaidBadge />}
              </button>
            );
          })}
        </div>
        <div style={{ display: 'flex', gap: 12, fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)',
          justifyContent: 'center', flexWrap: 'wrap' }}>
