  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const cells = [...Array(startDow).fill(null), ...Array.from({length: daysInMonth}, (_, i) => i + 1)];

  function ds(d) {
    return `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  // first tap starts a fresh range; second tap closes it (swapping if picked before the start)
  function handlePick(dateStr) {
    if (saving || justConfirmed || readOnly) return;
    if (!rangeFrom || rangeTo) { setRangeFrom(dateStr); setRangeTo(null); }
    else if (dateStr < rangeFrom) { setRangeTo(rangeFrom); setRangeFrom(dateStr); }
    else { setRangeTo(dateStr); }
  }

  const [deletingId, setDeletingId] = React.useState(null);
  // held true for a beat after a successful confirm so the just-picked
  // range's stickers can visibly brighten before the sheet closes, instead
  // of the days you just paid for silently vanishing off-screen
  const [justConfirmed, setJustConfirmed] = React.useState(false);
  const canConfirm = !!(rangeFrom && rangeTo && Number(amount) > 0) && !saving && !justConfirmed;
  const fmt = d => d ? d.split('-').reverse().join('.') : '—';

  async function handleDelete(id) {
    setDeletingId(id);
    try {
      await onDelete(id);
      // re-fetch rather than locally filter — deleting shifts every later
      // row's sheet row number, so a second delete in the same session
      // needs fresh ids, not the ones fetched before the first delete
      const fresh = await loadHistory();
      setHistory(fresh);
    } catch (e) {
      window.showToast(L('Не удалось удалить: ', 'Failed to delete: ') + String(e));
    } finally {
      setDeletingId(null);
    }
  }

  async function handleConfirm() {
    if (!canConfirm) return;
    setSaving(true);
    try {
      await onConfirm(rangeFrom, rangeTo, amount);
      setSaving(false);
      setJustConfirmed(true);
      setTimeout(onClose, 1100);
    } catch (e) {
      setSaving(false);
    }
  }

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 260, background: 'rgba(0,0,0,0.4)',
      display: 'flex', alignItems: 'flex-end' }} onClick={onClose}>
      <div style={{ width: '100%', maxHeight: '80vh', overflowY: 'auto', background: 'var(--bg)', borderRadius: '24px 24px 0 0',
        padding: '12px 20px 32px' }} onClick={e => e.stopPropagation()}>
        {/* drag-handle doubles as an explicit close tap target — the backdrop
            strip above the sheet can end up too thin to reliably hit on a
            real phone, this always works regardless of sheet height */}
        <div onClick={onClose} style={{ padding: '6px 0 10px', margin: '-6px 0 4px', cursor: 'pointer' }}>
          <div style={{ width: 40, height: 4, background: 'rgba(60,40,20,0.15)', borderRadius: 2, margin: '0 auto' }} />
        </div>
        <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-soft)', textAlign: 'center', marginBottom: 12 }}>
          {Lo(kid)}
        </div>
        {!readOnly && (
        <div style={{ display: 'flex', justifyContent: 'center', gap: 20, marginBottom: 16, flexWrap: 'wrap' }}>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)', marginBottom: 2 }}>{L('Оплачено с', 'Paid from')}</div>
            <div style={{ fontSize: 16, fontWeight: 800, fontFamily: 'var(--font-display)',
              color: rangeFrom ? 'var(--ink)' : 'var(--ink-faint)' }}>{fmt(rangeFrom)}</div>
          </div>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)', marginBottom: 2 }}>{L('Оплачено до', 'Paid until')}</div>
            <div style={{ fontSize: 16, fontWeight: 800, fontFamily: 'var(--font-display)',
              color: rangeTo ? 'var(--ink)' : 'var(--ink-faint)' }}>{fmt(rangeTo)}</div>
          </div>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)', marginBottom: 2 }}>{L('Сумма', 'Amount')}</div>
            <input type="number" inputMode="numeric" value={amount}
              onChange={e => { setAmount(e.target.value); setAmountTouched(true); }}
              placeholder="0"
              style={{ width: 110, textAlign: 'center', fontSize: 16, fontWeight: 800, fontFamily: 'var(--font-display)',
                border: 'none', borderBottom: '2px solid #E7DCC8', background: 'transparent', color: 'var(--ink)',
                outline: 'none', padding: '0 4px 2px' }} />
          </div>
        </div>
        )}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <button onClick={prevMonth} style={{ border:'none', background:'none', fontSize:24, cursor:'pointer', color:'var(--ink)', padding:'0 10px' }}>‹</button>
          <div style={{ fontSize:16, fontWeight:800, color:'var(--ink)', fontFamily:'var(--font-display)' }}>
            {L(MR[viewMonth], ME[viewMonth])} {viewYear}
          </div>
          <button onClick={nextMonth} style={{ border:'none', background:'none', fontSize:24, cursor:'pointer', color:'var(--ink)', padding:'0 10px' }}>›</button>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom:4 }}>
          {DH.map((d,i) => <div key={d} style={{ textAlign:'center', fontSize:11, fontWeight:700,
            color: i>=5 ? '#C0748E' : 'var(--ink-faint)', padding:'3px 0' }}>{d}</div>)}
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom: 10 }}>
          {cells.map((d, i) => {
            if (!d) return <div key={`e${i}`} />;
            const dateStr = ds(d);
            const dow     = new Date(dateStr + 'T12:00:00').getDay();
            const isWknd  = dow === 0 || dow === 6;
            const isPresent = attHistory[dateStr] === 'present';
            // A club's non-meeting days — never tappable, never part of a
            // picked range, no matter where they fall between two real
            // session dates. null/empty allowedWeekdays (garden, or a club
            // with no schedule on record) means no restriction at all.
            // Attendance marked present here is an exception, not a rule —
            // a rescheduled session (see ClubScreen's "Перенос занятия")
            // genuinely happened on this off-schedule day, so it should be
            // pickable/payable too.
            const notAllowedDay = allowedWeekdays && allowedWeekdays.length > 0
              && !allowedWeekdays.includes(dow) && !isPresent;
            const isEdge  = dateStr === rangeFrom || dateStr === rangeTo;
            const inRange = rangeFrom && rangeTo && dateStr > rangeFrom && dateStr < rangeTo && !notAllowedDay;
            const isPaidDay = paidDays.has(dateStr);
            const isTdy   = dateStr === today;
            const { background, color } = calendarCellVisual({ isEdge, inRange, isWknd, isPresent, isTdy, notAllowedDay });
            // the range you're actively picking previews as a dim sticker —
            // "this is about to be marked paid" — then brightens for a beat
            // once Confirm actually saves it, instead of just vanishing
            const isPicking = (isEdge || inRange) && !isWknd && !isPaidDay;
            return (
              <button key={d} disabled={notAllowedDay} onClick={() => { if (!notAllowedDay) handlePick(dateStr); }}
                style={{ position: 'relative', border:'none', borderRadius: 10, padding:'9px 2px', fontSize:14,
                  fontWeight: isEdge||isTdy ? 800 : 500, cursor: notAllowedDay ? 'default' : 'pointer',
                  background, color }}>
                {d}
                {isPaidDay && !isWknd && <PaidBadge />}
                {isPicking && <PaidBadge muted={!justConfirmed} />}
              </button>
            );
          })}
        </div>
        <div style={{ display: 'flex', gap: 12, fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)',
          justifyContent: 'center', marginBottom: 20, flexWrap: 'wrap' }}>
          <span><span style={{ display:'inline-block', width:9, height:9, borderRadius:3, background:'#8FCB9E', marginRight:4 }} />{L('был в саду', 'was here')}</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
            <span style={{ position: 'relative', width: 12, height: 12, display: 'inline-block' }}><PaidBadge /></span>
            {L('оплачено', 'paid')}
          </span>
          <span><span style={{ display:'inline-block', width:9, height:9, borderRadius:3, background:'#FBD9E1', marginRight:4 }} />{L('выходной', 'weekend')}</span>
        </div>
        {history.length > 0 && (
          <div style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.03em' }}>
              {L('История платежей', 'Payment history')}
            </div>
            {history.length > visibleCount && (
              // Above the list, not below — with a long history, a button
              // at the bottom would mean scrolling all the way past
              // everything already loaded just to ask for more of it.
              <button onClick={() => setVisibleCount(n => n + HISTORY_PAGE_SIZE)} className="bk-press" style={{
                width: '100%', border: 'none', cursor: 'pointer', background: '#EFE6D8', color: 'var(--ink-soft)',
                fontFamily: 'inherit', fontSize: 12, fontWeight: 700, padding: '8px 12px', borderRadius: 12,
                marginBottom: 6 }}>
                {L('Загрузить ещё', 'Load more')}
              </button>
            )}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {history.slice().reverse().slice(0, visibleCount).map(h => (
                <div key={h.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  background: '#FBF7F2', borderRadius: 12, padding: '8px 12px' }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink)' }}>
                    {h.from.split('.').slice(0,2).join('.')}–{h.until} · {fmtMoney(h.amount)}
                    {h.markedBy && (
                      <div style={{ fontSize: 11, fontWeight: 500, color: 'var(--ink-faint)', marginTop: 1 }}>
                        {formatMarkedBy(h.markedBy)}
                      </div>
                    )}
                  </span>
                  {!readOnly && (
                    <button onClick={() => handleDelete(h.id)} disabled={deletingId === h.id}
                      style={{ border: 'none', background: 'none', cursor: 'pointer', fontSize: 16,
                        color: '#c0392b', padding: 4, opacity: deletingId === h.id ? 0.4 : 1 }}>✕</button>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}
        {/* Кружки → Участники opens this read-only — actually logging or
            deleting a payment only happens through the Оплаты block, this
            view is just for checking paid/attendance status at a glance. */}
        {!readOnly && (
        <button onClick={handleConfirm} disabled={!canConfirm} className="bk-press"
          style={{ width: '100%', border: 'none', cursor: canConfirm ? 'pointer' : 'default',
            fontFamily: 'var(--font-display)',
            background: justConfirmed ? '#F2A81D' : canConfirm ? '#B07848' : '#E7E1D9',
            color: justConfirmed ? '#3E2510' : canConfirm ? '#fff' : 'var(--ink-faint)',
            fontSize: 17, fontWeight: 800, padding: 15, borderRadius: 18, transition: 'background 0.25s, color 0.25s',
            boxShadow: justConfirmed ? '0 10px 24px -8px #F2A81D' : canConfirm ? '0 10px 24px -8px #B07848' : 'none' }}>
          {justConfirmed ? L('Сохранено ✓', 'Saved ✓') : saving ? L('Сохраняю…', 'Saving…') : L('Подтвердить оплату', 'Confirm payment')}
        </button>
        )}
      </div>
    </div>
  );
}

// Per-kid history — same day-cell visual language as PayRangeSheet (green
// fill = was in the garden that day, coin badge = covered by a payment).
// Tap a past/today day to toggle attendance right there — same
// present/absent flip the Journal uses, it just writes through
// window.saveAttendance for that one (date, kid) pair instead of the
// whole day's roster. Unlike the Payments calendar, this one only edits
// attendance, never payments, and future dates stay disabled.
function AttendanceHistorySheet({ kid, onClose }) {
  const today = todayStr();
  const init = new Date(today + 'T12:00:00');
  const [viewYear,  setViewYear]  = React.useState(init.getFullYear());
  const [viewMonth, setViewMonth] = React.useState(init.getMonth());
  const [history,   setHistory]   = React.useState(null);
  const [log,       setLog]       = React.useState([]);
  const [pending,   setPending]   = React.useState(null);

  React.useEffect(() => {
    Promise.all([
      withRetry(() => window.loadAttendanceHistory(kid.id)),
      withRetry(() => window.loadPaymentLog(kid.id)).catch(() => []),
    ]).then(([h, l]) => { setHistory(h); setLog(l); }).catch(() => setHistory({}));
  }, [kid.id]);

  // most real kids have no Paid-from on record — default the start to today,
  // same fallback PaymentsGardenScreen uses, or the dot would never show up
  const legacyCoverage = { from: kid.paidFrom || todayStr(), until: kid.paidUntil };
  const paidDays = React.useMemo(() => {
    const set = new Set();
    const entries = legacyCoverage.from && legacyCoverage.until ? [...log, legacyCoverage] : log;
    entries.forEach(h => {
      const from = normDate(h.from), until = normDate(h.until);
      if (!from || !until) return;
      let d = new Date(from + 'T12:00:00');
      const end = new Date(until + 'T12:00:00');
      while (d <= end) {
        set.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
        d.setDate(d.getDate() + 1);
      }
    });
    // Same shift as PayRangeSheet's calendar: a carried-over day moves the
    // paid mark from the missed day it names onto the new day it adds, so
    // this calendar (opened by tapping a kid straight from the Journal)
    // doesn't disagree with the one under Payments about which day is paid.
    entries.forEach(h => {
      const m = (h.markedBy || '').match(/^Система: перенос пропуска (\d{2}\.\d{2}\.\d{4})/);
      if (m) set.delete(normDate(m[1]));
    });
    return set;
  }, [log, kid.paidFrom, kid.paidUntil]);

  const MR = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const ME = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DH = [L('Пн','Mo'),L('Вт','Tu'),L('Ср','We'),L('Чт','Th'),L('Пт','Fr'),L('Сб','Sa'),L('Вс','Su')];

  function prevMonth() {
    if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); }
    else setViewMonth(m => m - 1);
  }
  function nextMonth() {
    if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); }
    else setViewMonth(m => m + 1);
  }

  const firstDay = new Date(viewYear, viewMonth, 1);
  let startDow = firstDay.getDay(); if (startDow === 0) startDow = 7; startDow -= 1;
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const cells = [...Array(startDow).fill(null), ...Array.from({length: daysInMonth}, (_, i) => i + 1)];

  function ds(d) {
    return `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  async function toggleDay(dateStr) {
    if (dateStr > today || pending) return;
    const cur = (history || {})[dateStr] || 'absent';
    const next = cur === 'present' ? 'absent' : 'present';
    setPending(dateStr);
    setHistory(h => ({ ...h, [dateStr]: next }));
    try {
      await window.saveAttendance(dateStr, { [kid.id]: next });
    } catch (e) {
      setHistory(h => ({ ...h, [dateStr]: cur }));
      window.showToast(L('Не удалось сохранить: ', 'Failed to save: ') + String(e));
    } finally {
      setPending(null);
    }
  }

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 260, background: 'rgba(0,0,0,0.4)',
      display: 'flex', alignItems: 'flex-end' }} onClick={onClose}>
      <div style={{ width: '100%', maxHeight: '88vh', overflowY: 'auto', background: 'var(--bg)', borderRadius: '24px 24px 0 0',
        padding: '12px 20px 32px' }} onClick={e => e.stopPropagation()}>
        <div style={{ width: 40, height: 4, background: 'rgba(60,40,20,0.15)', borderRadius: 2, margin: '0 auto 14px' }} />
        <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-soft)', textAlign: 'center', marginBottom: 12 }}>
          {Lo(kid)}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <button onClick={prevMonth} style={{ border:'none', background:'none', fontSize:24, cursor:'pointer', color:'var(--ink)', padding:'0 10px' }}>‹</button>
          <div style={{ fontSize:16, fontWeight:800, color:'var(--ink)', fontFamily:'var(--font-display)' }}>
            {L(MR[viewMonth], ME[viewMonth])} {viewYear}
          </div>
          <button onClick={nextMonth} style={{ border:'none', background:'none', fontSize:24, cursor:'pointer', color:'var(--ink)', padding:'0 10px' }}>›</button>
        </div>
        {history === null ? (
          <div style={{ textAlign: 'center', padding: 40, color: 'var(--ink-faint)', fontSize: 15 }}>…</div>
        ) : (
        <>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom:4 }}>
          {DH.map((d,i) => <div key={d} style={{ textAlign:'center', fontSize:11, fontWeight:700,
            color: i>=5 ? '#C0748E' : 'var(--ink-faint)', padding:'3px 0' }}>{d}</div>)}
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom: 10 }}>
          {cells.map((d, i) => {
            if (!d) return <div key={`e${i}`} />;
            const dateStr = ds(d);
            const dow      = new Date(dateStr + 'T12:00:00').getDay();
            const isWknd   = dow === 0 || dow === 6;
            const isFuture = dateStr > today;
            const isTdy    = dateStr === today;
            const isPresent = history[dateStr] === 'present';
            const isPaidDay = paidDays.has(dateStr);
            const { background, color } = calendarCellVisual({ isWknd, isPresent, isTdy });
            return (
              <button key={d} onClick={() => toggleDay(dateStr)} disabled={isFuture}
                style={{ position: 'relative', border:'none', borderRadius: 10, padding:'9px 2px', fontSize:14,
                  fontWeight: isTdy ? 800 : 500, cursor: isFuture ? 'default' : 'pointer',
                  opacity: isFuture ? 0.35 : (pending === dateStr ? 0.5 : 1),
                  background, color }}>
                {d}
                {isPaidDay && !isWknd && <PaidBadge />}
              </button>
            );
          })}
        </div>
        <div style={{ display: 'flex', gap: 12, fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)',
          justifyContent: 'center', flexWrap: 'wrap' }}>
          <span><span style={{ display:'inline-block', width:9, height:9, borderRadius:3, background:'#8FCB9E', marginRight:4 }} />{L('был в саду', 'was here')}</span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
            <span style={{ position: 'relative', width: 12, height: 12, display: 'inline-block' }}><PaidBadge /></span>
            {L('оплачено', 'paid')}
          </span>
          <span><span style={{ display:'inline-block', width:9, height:9, borderRadius:3, background:'#FBD9E1', marginRight:4 }} />{L('выходной', 'weekend')}</span>
        </div>
        </>
        )}
      </div>
    </div>
  );
}

function AttendanceScreen({ statuses, actions, go, selDate, setSelDate, calOpen, setCalOpen }) {
  const [filter,    setFilter]    = React.useState('all');
  const [loading,   setLoading]   = React.useState(false);
  const [allMarked, setAllMarked] = React.useState(false);
  const [calKid,    setCalKid]    = React.useState(null);
  const snapRef = React.useRef(null);

  const isToday = selDate === todayStr();

  const makeLocal = (src) => {
    const m = {}; activeKids().forEach(k => { m[k.id] = (src||{})[k.id] || 'absent'; }); return m;
  };
  const [local,      setLocal]      = React.useState(() => makeLocal(statuses));
  const [savedLocal, setSavedLocal] = React.useState(() => makeLocal(statuses));

  // sync today statuses when they change externally
  React.useEffect(() => {
    if (!isToday) return;
    const m = makeLocal(statuses);
    setLocal(m); setSavedLocal(m);
  }, [statuses, isToday]);

  // load past date from API
  React.useEffect(() => {
    if (isToday) return;
    setLoading(true); setAllMarked(false);
    withRetry(() => window.loadAttendance(selDate))
      .then(data => { const m = makeLocal(data); setLocal(m); setSavedLocal(m); })
      .catch(()  => { const m = makeLocal({});   setLocal(m); setSavedLocal(m); })
      .finally(() => setLoading(false));
  }, [selDate]);

  const kids   = activeKids().filter(k => filter === 'all' || k.group === filter);
  const counts = {
    present: activeKids().filter(k => local[k.id] === 'present').length,
    absent:  activeKids().filter(k => local[k.id] !== 'present').length,
  };
  const hasChanges = activeKids().some(k => local[k.id] !== savedLocal[k.id]);

  function toggleMarkAll() {
    if (!allMarked) {
      snapRef.current = { ...local };
      const all = {}; activeKids().forEach(k => { all[k.id] = 'present'; });
      setLocal(all); setAllMarked(true);
    } else {
      setLocal(snapRef.current || makeLocal(statuses)); setAllMarked(false);
    }
  }
  function setStatus(id, st) {
    if (st === 'present' && local[id] !== 'present') {
      const kid = activeKids().find(k => k.id === id);
      const covered = kid && kid.paidUntil && normDate(kid.paidUntil) >= selDate;
      if (kid && !covered) {
        actions.toast(L('Не оплачено — обратитесь к бухгалтеру/директору', 'Not paid — contact the accountant/director'));
      }
    }
    setLocal(m => ({ ...m, [id]: st }));
    setAllMarked(false);
  }
  const [saveErr, setSaveErr] = React.useState(null);
  async function handleSave() {
    setSaveErr(null);
    if (!hasChanges) return;
    // Only send what this user actually changed since the last save — not
    // everyone's status. The backend now records who marked each kid
    // (Marked by), and a kid who stays "absent" all day untouched gets an
    // explicit row from the end-of-day sweep instead of from us resending
    // the whole roster. Sending everyone here would (a) wrongly attribute
    // kids nobody touched to whoever happens to hit Save, and (b) let two
    // people editing different kids at once stomp each other's changes.
    const delta = {};
    activeKids().forEach(k => { if (local[k.id] !== savedLocal[k.id]) delta[k.id] = local[k.id]; });
    try {
      if (isToday) {
        await actions.saveStatuses(local, delta);
      } else {
        await window.saveAttendance(selDate, delta);
      }
      setSavedLocal({ ...local });
    } catch (e) {
      setSaveErr(L('Ошибка сохранения', 'Save failed'));
    }
  }

  const chips = [{ id: 'all', label: t('all'), emoji: '🗂️' }, ...DATA.GROUPS.map(g => ({ id: g.id, label: Lo(g), emoji: g.emoji }))];

  const selDateObj = new Date(selDate + 'T12:00:00');
  const selIsWeekend = isWeekend(selDateObj);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>

      {selIsWeekend ? (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
          minHeight:'60vh', gap:12, padding:32, textAlign:'center' }}>
          <div style={{ fontSize:48 }}>🌅</div>
          <div style={{ fontSize:20, fontWeight:800, color:'var(--ink)', fontFamily:'var(--font-display)' }}>
            {L('Выходной день', 'Weekend')}
          </div>
          <div style={{ fontSize:14, color:'var(--ink-soft)' }}>
            {L('Журнал посещаемости доступен только в будние дни', 'Attendance journal is only available on weekdays')}
          </div>
        </div>
      ) : loading ? (
        <div style={{ textAlign:'center', padding:40, color:'var(--ink-faint)', fontSize:15 }}>…</div>
      ) : (
        <>
        {/* group filter */}

function WeekChart() {
  const LABELS = [
    { ru: 'Пн', en: 'Mo' }, { ru: 'Вт', en: 'Tu' }, { ru: 'Ср', en: 'We' },
    { ru: 'Чт', en: 'Th' }, { ru: 'Пт', en: 'Fr' },
  ];
  const [data, setData] = React.useState(LABELS.map(d => ({ ...d, v: null })));
  const total = activeKids().length;

  React.useEffect(() => {
    if (!total) return;
    const now = new Date();
    const todayMid = new Date(now); todayMid.setHours(0, 0, 0, 0);
    const dow = now.getDay() || 7;
    const monday = new Date(now); monday.setDate(now.getDate() - (dow - 1));
    const days = LABELS.map((lbl, i) => {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const mid = new Date(d); mid.setHours(0, 0, 0, 0);
      const iso = d.toISOString().slice(0, 10);
      return { ...lbl, iso, future: mid > todayMid };
    });
    Promise.all(days.map(d => d.future
      ? Promise.resolve({})
      : withRetry(() => fetch(`${window.API_BASE}/attendance/${d.iso}`).then(r => r.ok ? r.json() : Promise.reject(new Error('bad status')))).catch(() => ({}))
    )).then(results => {
      setData(days.map((d, i) => {
        if (d.future) return { ru: d.ru, en: d.en, v: null };
        const present = Object.values(results[i]).filter(v => v !== 'absent').length;
        return { ru: d.ru, en: d.en, v: Math.round(present / total * 100) };
      }));
    });
  }, [total]);

  const vals = data.map(d => d.v ?? 0);
  const max = Math.max(...vals, 1);
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 10, height: 110, marginTop: 8 }}>
      {data.map((d, i) => {
        const isFuture = d.v === null;
        const h = isFuture ? 4 : Math.max((d.v / max) * 78, 4);
        return (
          <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, height: '100%', justifyContent: 'flex-end' }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: isFuture ? 'transparent' : 'var(--ink-soft)' }}>{isFuture ? '' : d.v}</div>
            <div style={{ width: '100%', maxWidth: 30, height: `${h}px`, borderRadius: 8,
              background: !isFuture && d.v === max ? '#B07848' : '#EDE8E0',
              opacity: isFuture ? 0.3 : 1,
              transition: 'height 0.8s cubic-bezier(.22,1,.36,1)' }} />
            <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--ink-faint)' }}>{Lo(d)}</div>
          </div>
        );
      })}
    </div>
  );
}

function fmtFeedTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.toDateString() === now.toDateString()) return L(`Сегодня ${hm}`, `Today ${hm}`);
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return L(`Вчера ${hm}`, `Yesterday ${hm}`);
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)} ${hm}`;
}

      {confirm && (

// ════════════════════════════════════════════════════════════════
function ComposeScreen({ back, actions }) {
  const [text,    setText]    = React.useState('');
  const [ruText,  setRuText]  = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [typeIdx, setTypeIdx] = React.useState(0);
  const types = [
    { id: 'alert',  emoji: '📢', label: t('typeAlert'),  color: '#FBE0C0' },
    { id: 'urgent', emoji: '⚠️', label: t('typeUrgent'), color: '#FBD9E1' },
    { id: 'dayoff', emoji: '🏖️', label: t('typeDayOff'), color: '#CDE8FB' },
    { id: 'event',  emoji: '📅', label: t('typeEvent'),  color: '#D4F0DF' },
  ];
  const type = types[typeIdx].id;
  const touchTypeRef = React.useRef(null);

  async function translate() {
    if (!text.trim()) return;
    setLoading(true);
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.trim())}&langpair=ru|en`);
      const data = await res.json();
      const en = data.responseData?.translatedText;
      if (en) { setRuText(text); setText(en); }
    } catch {}
    finally { setLoading(false); }
  }

  const [sending, setSending] = React.useState(false);
  async function send() {
    if (!text.trim() || sending) return;
    setSending(true);
    try {
      const chosen = types[typeIdx];
      await actions.addPost({ ru: ruText || text, en: text, emoji: chosen.emoji, type });
      actions.toast(t('noteSaved') + ' ✓');
      back();
    } catch(e) {
      setSending(false);
    }
  }

  return (
    <div style={{ padding: '6px 20px 30px', display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div
        onTouchStart={e => { touchTypeRef.current = e.touches[0].clientX; }}
        onTouchEnd={e => {
          if (touchTypeRef.current === null) return;
          const dx = e.changedTouches[0].clientX - touchTypeRef.current;
          touchTypeRef.current = null;
          if (dx < -50 && typeIdx < types.length - 1) setTypeIdx(i => i + 1);
          else if (dx > 50 && typeIdx > 0) setTypeIdx(i => i - 1);
        }}
        style={{ borderRadius: 22, padding: '20px 18px 16px', background: types[typeIdx].color,
          boxShadow: '0 1px 2px rgba(60,40,20,0.04), 0 12px 28px -20px rgba(60,40,20,0.35)',
          userSelect: 'none' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
          <button onClick={() => typeIdx > 0 && setTypeIdx(i => i - 1)} style={{ border: 'none', background: 'none', padding: 0,
            fontSize: 20, color: '#B07848', fontWeight: 800, opacity: typeIdx > 0 ? 1 : 0.2, cursor: typeIdx > 0 ? 'pointer' : 'default' }}>‹</button>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 40, lineHeight: 1, marginBottom: 6 }}>{types[typeIdx].emoji}</div>
            <div style={{ fontSize: 16, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)' }}>{types[typeIdx].label}</div>
          </div>
          <button onClick={() => typeIdx < types.length - 1 && setTypeIdx(i => i + 1)} style={{ border: 'none', background: 'none', padding: 0,
            fontSize: 20, color: '#B07848', fontWeight: 800, opacity: typeIdx < types.length - 1 ? 1 : 0.2, cursor: typeIdx < types.length - 1 ? 'pointer' : 'default' }}>›</button>
        </div>
        <div style={{ display: 'flex', gap: 5, justifyContent: 'center' }}>
          {types.map((_, i) => (
            <div key={i} onClick={() => setTypeIdx(i)} style={{ height: 5, borderRadius: 3, cursor: 'pointer', transition: 'all 0.2s',
              width: i === typeIdx ? 18 : 5, background: i === typeIdx ? '#B07848' : 'rgba(176,120,72,0.3)' }} />
          ))}
        </div>
      </div>

      <div style={{ position: 'relative' }}>
        <textarea value={text} onChange={e => { setText(e.target.value); setRuText(''); }}
          placeholder={t('noteTextPlaceholder')}
          rows={4} style={{ width: '100%', boxSizing: 'border-box', resize: 'none', border: 'none',
          background: '#FBF7F2', borderRadius: 18, padding: 16, paddingBottom: 44, fontFamily: 'inherit', fontSize: 15.5,
          color: 'var(--ink)', fontWeight: 600, lineHeight: 1.4, outline: 'none',
          boxShadow: '0 1px 2px rgba(60,40,20,0.05)' }} />
        <button onClick={translate} disabled={!text.trim() || loading} className="bk-press" style={{
          position: 'absolute', bottom: 10, right: 10,
          border: 'none', cursor: text.trim() && !loading ? 'pointer' : 'default',
          fontSize: 20, lineHeight: 1, padding: '4px 8px', borderRadius: 10,
          background: 'rgba(255,255,255,0.7)', opacity: loading ? 0.4 : text.trim() ? 1 : 0.3,
          transition: 'opacity .2s', boxShadow: '0 1px 4px rgba(60,40,20,0.1)' }}>
          🇬🇧
        </button>
      </div>

      {text.trim() && (
        <div style={{ position: 'sticky', bottom: 0, marginTop: 4, padding: '14px 0 26px',
          background: 'linear-gradient(to top, var(--bg) 62%, transparent)' }}>
          <button onClick={send} disabled={sending} className="bk-press" style={{
            width: '100%', border: 'none', cursor: sending ? 'default' : 'pointer', fontFamily: 'var(--font-display)',
            background: '#B07848', color: '#fff', fontSize: 17, fontWeight: 800,
            padding: 15, borderRadius: 18, boxShadow: '0 10px 24px -8px #B07848',
            opacity: sending ? 0.7 : 1 }}>
            {sending ? '…' : t('save')}
          </button>
        </div>
      )}
    </div>
  );
}

const PAY_PALETTE = ['#FBE7A8','#CDE8FB','#D4F0DF','#FBD9E1','#FBE0C0','#E8D5FB'];

function fmtMoney(n) {
  if (n == null) return '—';
  if (!n) return '0';
  return n % 1000 === 0 ? `${n / 1000}k` : String(n);
}

function PayStats({ cp, cu, total, filter, onFilter, dateSquare }) {
  const statBox = (id, count, label, color) => {
    const active = filter === id;
    return (
      <div onClick={() => onFilter(active ? 'all' : id)} className="bk-press" style={{
        flex: 1, borderRadius: 18, padding: '12px 8px', textAlign: 'center', cursor: 'pointer',
        background: active ? '#B07848' : '#FBF7F2',
        boxShadow: active ? '0 6px 18px -6px #B07848' : 'none', transition: 'all 0.18s' }}>
        <div style={{ fontSize: 24, fontWeight: 600, lineHeight: 1,
          color: active ? '#fff' : color }}>{count}</div>
        <div style={{ fontSize: 12, fontWeight: 600, marginTop: 4,
          color: active ? 'rgba(255,255,255,0.8)' : 'var(--ink-soft)' }}>{label}</div>
      </div>
    );
  };
  return (
    <div style={{ display: 'flex', gap: 10, padding: '0 20px 16px' }}>
      {dateSquare}
      {statBox('paid',   cp, L('Оплатили', 'Paid'),      'var(--ok)')}
      {statBox('unpaid', cu, L('Не оплатили', 'Unpaid'), 'var(--no)')}
      {!window.__isStaff && (
      <div style={{ flex: 1.4, background: '#FBF7F2', borderRadius: 18, padding: '12px 8px', textAlign: 'center' }}>
        <div style={{ fontSize: 22, fontWeight: 600, color: '#B07848', lineHeight: 1 }}>{fmtMoney(total)}</div>
        <div style={{ fontSize: 12, color: 'var(--ink-soft)', fontWeight: 600, marginTop: 4 }}>{L('Собрано', 'Collected')}</div>
      </div>
      )}
    </div>
  );
}

function fmtTourDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  const mRu = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const mEn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return L(`${d.getDate()} ${mRu[d.getMonth()]}`, `${mEn[d.getMonth()]} ${d.getDate()}`);
}

    background: '#FEF0ED', color: '#c0392b' }}>{L('Не оплачено', 'Unpaid')}</span>;

function PaymentsGardenScreen() {
  const [tariff,    setTariff]    = React.useState('longterm');
  const [group,     setGroup]     = React.useState('all');
  const [payFilter, setPayFilter] = React.useState('all');
  const [selDate,   setSelDate]   = React.useState(todayStr);
  const [calOpen,   setCalOpen]   = React.useState(false);
  // Confirming or deleting a logged payment patches kid.paidFrom/paidUntil
  // in place on the shared DATA.CHILDREN object (see confirmPayment below) —
  // this tick just forces a re-render so the list picks that up immediately.
  const [, forceTick] = React.useReducer(x => x + 1, 0);

  // "Журнал" — a flat, newest-first list of every garden payment ever
  // logged, across every child — Ольга: same idea as the Payment log
  // sheet, but visible without opening Sheets.
  const [journal,        setJournal]        = React.useState([]);
  const [journalLoading, setJournalLoading] = React.useState(false);
  React.useEffect(() => {
    if (tariff !== 'journal') return;
    setJournalLoading(true);
    withRetry(window.loadPaymentLogJournal).then(setJournal).catch(() => setJournal([])).finally(() => setJournalLoading(false));
  }, [tariff]);

  const isTour = tariff === 'tourist';

  const allKids = activeKids()
    .filter(k => isTour ? k.contract === 'tourist' : k.contract !== 'tourist')
    .filter(k => group === 'all' || k.group === group);

  function isCoveredOn(kid, date) {
    // both bounds matter — a kid paid ahead for a period that hasn't
    // started yet (paidFrom in the future) isn't covered *today* just
    // because paidUntil is comfortably far off
    if (!kid.paidUntil || normDate(kid.paidUntil) < date) return false;
    if (kid.paidFrom && normDate(kid.paidFrom) > date) return false;
    return true;
  }

  // the "Оплачено" badge, the stats, and the filter all check the same
  // selected date (defaults to today) — previously the badge was always
  // pinned to today while a separate line of text respected the picked
  // date, so the two could visibly disagree with each other
  const countPaid   = allKids.filter(k => isCoveredOn(k, selDate)).length;
  const countUnpaid = allKids.length - countPaid;
  const total       = allKids.filter(k => isCoveredOn(k, selDate)).reduce((s, k) => s + (Number(k.price) || 0), 0);
  const kids        = allKids.filter(k => payFilter === 'paid' ? isCoveredOn(k, selDate) : payFilter === 'unpaid' ? !isCoveredOn(k, selDate) : true);

  async function confirmPayment(kid, from, to, amount) {
    const fromDmy = from.split('-').reverse().join('.');
    const toDmy = to.split('-').reverse().join('.');
    try {
      const res = await window.addPaymentLogEntry(kid.id, tariff, fromDmy, toDmy, amount);
      Object.assign(kid, { paidFrom: res.paidFrom || '', paidUntil: res.paidUntil || '' });
      forceTick();
    } catch (e) {
      // addPaymentLogEntry is queued durably (see makeDurableIdempotent) —
      // it didn't go through just now, but it's saved locally and will
      // retry on its own with the same idempotency key next time the app
      // opens or comes back online. Telling the manager to just tap
      // Confirm again here would risk a second, genuinely different
      // payment landing once the queued one also goes through.
      window.showToast(L(
        'Не удалось отправить сразу — сохранится автоматически, когда появится связь. Не нажимайте ещё раз.',
        "Couldn't send right now — it's saved and will sync automatically once you're back online. Don't tap Confirm again."
      ));
      throw e;
    }
  }

  async function deletePayment(kid, rowId) {
    const res = await window.deletePaymentLogEntry(rowId);
    Object.assign(kid, { paidFrom: res.paidFrom || '', paidUntil: res.paidUntil || '' });
    forceTick();
  }

  const chips = [{ id: 'all', label: t('all'), emoji: '🗂️' }, ...DATA.GROUPS.map(g => ({ id: g.id, label: Lo(g), emoji: g.emoji }))];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>

      {/* tariff toggle */}
      <div style={{ display: 'flex', margin: '0 20px 14px', background: '#FBF7F2', borderRadius: 999, padding: 4, gap: 4 }}>
        {[['longterm', L('Долгосрочные', 'Long term')], ['tourist', L('Краткосрочные', 'Short term')], ['journal', L('Журнал', 'Journal')]].map(([id, label]) => (
          <button key={id} onClick={() => { setTariff(id); setGroup('all'); setPayFilter('all'); }} className="bk-press" style={{
            flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
            padding: '9px 4px', borderRadius: 999, fontSize: 13, fontWeight: 800,
            background: tariff === id ? '#B07848' : 'transparent',
            color: tariff === id ? '#fff' : 'var(--ink-soft)', transition: 'all 0.2s' }}>
            {label}
          </button>
        ))}
      </div>

      {tariff === 'journal' ? (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 9, padding: '0 20px 20px' }}>
          {journalLoading && <div style={{ textAlign: 'center', padding: 30, color: 'var(--ink-faint)', fontSize: 13 }}>…</div>}
          {!journalLoading && journal.length === 0 && (
            <div style={{ textAlign: 'center', padding: 24, color: 'var(--ink-faint)', fontSize: 13.5 }}>
              {L('Нет записей', 'No entries')}
            </div>
          )}
          {!journalLoading && journal.map(e => (
            <div key={e.id} style={{ background: '#FBF7F2', borderRadius: 14, padding: '10px 14px' }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: 'var(--ink)' }}>{e.child}</div>
              <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink-soft)', marginTop: 2 }}>
                {e.from.split('.').slice(0,2).join('.')}–{e.until} · {fmtMoney(e.amount)}
              </div>
              {e.markedBy && (
                <div style={{ fontSize: 11, fontWeight: 500, color: 'var(--ink-faint)', marginTop: 2 }}>
                  {formatMarkedBy(e.markedBy)}
                </div>
              )}
            </div>
          ))}
        </div>
      ) : (
        <>
          <div style={{ display: 'flex', gap: 8, overflowX: 'auto', padding: '0 20px 14px', scrollbarWidth: 'none' }}>
            {chips.map(c => (
              <button key={c.id} onClick={() => setGroup(c.id)} className="bk-press" style={{
                flexShrink: 0, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
                padding: '7px 12px', borderRadius: 999, fontSize: 13, fontWeight: 700,
                background: group === c.id ? '#B07848' : '#FBF7F2',
                color: group === c.id ? '#fff' : 'var(--ink-soft)',
                boxShadow: group === c.id ? '0 6px 14px -6px #B07848' : '0 1px 2px rgba(60,40,20,0.05)' }}>
                {c.emoji} {c.label}
              </button>
            ))}
          </div>

          {calOpen && <Portal><MiniCalendar selected={selDate} onSelect={setSelDate} onClose={() => setCalOpen(false)}
            disableWeekends={false} disableFuture={false} /></Portal>}

          <PayStats cp={countPaid} cu={countUnpaid} total={total} filter={payFilter} onFilter={setPayFilter}
            dateSquare={<CalendarSquareButton date={selDate} onClick={() => setCalOpen(true)} />} />

          <div style={{ display: 'flex', flexDirection: 'column', gap: 9, padding: '0 20px' }}>
            {kids.map(kid => (
              <KidPayRow key={kid.id} kid={kid} isPaid={isCoveredOn(kid, selDate)}
                tariff={tariff}
                legacyCoverage={{
                  // most kids' current paidUntil predates the payment log and
                  // has no matching entry there — without a fallback, opening
                  // their calendar would show nothing highlighted at all even
                  // though they're marked paid. Most also have no paidFrom on
                  // record either, so shade from today rather than guess a
                  // start date we don't actually know.
                  from: kid.paidFrom || todayStr(), until: kid.paidUntil,
                }}
                onConfirmPaid={(from, to, amount) => confirmPayment(kid, from, to, amount)}
                onDeletePaid={(rowId) => deletePayment(kid, rowId)} />
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function PaymentsClubsScreen() {
  const [clubId,    setClubId]    = React.useState(() => DATA.CLUBS[0]?.id ?? null);
  const [payFilter, setPayFilter] = React.useState('all');
  const [log,       setLog]       = React.useState([]);
  const [selDate,   setSelDate]   = React.useState(todayStr);
  const [calOpen,   setCalOpen]   = React.useState(false);

  const activeClub = DATA.CLUBS.find(c => c.id === clubId);
  const allKids    = activeClub ? activeKids().filter(k => activeClub.kids.includes(k.id)) : [];
  const price      = activeClub?.price ?? null;
  // Same schedule restriction the attendance calendar already enforces —
  // a payment range should only ever be able to cover real session days.
  const allowedWeekdays = React.useMemo(() => clubWeekdaysJS(activeClub), [activeClub]);

  React.useEffect(() => {
    if (!clubId) return;
    withRetry(() => window.loadClubPaymentLog(clubId)).then(setLog).catch(() => {});
  }, [clubId]);

  // a kid can be in more than one club, each with its own paid-through date,
  // so coverage is derived from the log here rather than cached on the kid
  const coverage = React.useMemo(() => {
    const map = {};
    allKids.forEach(k => { map[k.id] = bestCoverage(log.filter(e => e.child === k.id)); });
    return map;
  }, [log, allKids.length]);

  // same both-bounds check as Garden's isCoveredOn, and same "check any
  // date, not just today" square date-picker next to the stats
  function isCovered(kid, date) {
    const c = coverage[kid.id];
    if (!c || !c.until || normDate(c.until) < date) return false;
    if (c.from && normDate(c.from) > date) return false;
    return true;
  }

  const countPaid   = allKids.filter(k => isCovered(k, selDate)).length;
  const countUnpaid = allKids.length - countPaid;
  const total       = price != null ? countPaid * price : null;
  const kids        = allKids.filter(k => payFilter === 'paid' ? isCovered(k, selDate) : payFilter === 'unpaid' ? !isCovered(k, selDate) : true);

  function refetchLog() {
    return window.loadClubPaymentLog(clubId).then(setLog);
  }

  async function confirmPayment(kid, from, to, amount) {
    const fromDmy = from.split('-').reverse().join('.');
    const toDmy = to.split('-').reverse().join('.');
    try {
      await window.addClubPaymentLogEntry(kid.id, clubId, fromDmy, toDmy, amount);
      await refetchLog();
    } catch (e) {
      // See the garden PaymentsGardenScreen.confirmPayment for why this
      // message specifically discourages tapping Confirm again.
      window.showToast(L(
        'Не удалось отправить сразу — сохранится автоматически, когда появится связь. Не нажимайте ещё раз.',
        "Couldn't send right now — it's saved and will sync automatically once you're back online. Don't tap Confirm again."
      ));
      throw e;
    }
  }

  async function deletePayment(rowId) {
    await window.deleteClubPaymentLogEntry(rowId);
    await refetchLog();
  }

  if (!activeClub) return (
    <div style={{ padding: 20, color: 'var(--ink-faint)', fontSize: 14, textAlign: 'center' }}>
      {L('Нет кружков', 'No clubs')}
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>
      <div style={{ display: 'flex', gap: 8, padding: '0 20px 14px' }}>
        {DATA.CLUBS.map(c => (
          <button key={c.id} onClick={() => { setClubId(c.id); setPayFilter('all'); }} className="bk-press" style={{
            flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
            padding: '9px 4px', borderRadius: 999, fontSize: 13, fontWeight: 800,
            background: clubId === c.id ? '#B07848' : '#FBF7F2',
            color: clubId === c.id ? '#fff' : 'var(--ink-soft)',
            boxShadow: clubId === c.id ? '0 6px 14px -6px #B07848' : 'none' }}>
            {c.emoji} {Lo(c)}
          </button>
        ))}
      </div>
      {calOpen && <Portal><MiniCalendar selected={selDate} onSelect={setSelDate} onClose={() => setCalOpen(false)}
        disableWeekends={false} disableFuture={false} /></Portal>}

      <PayStats cp={countPaid} cu={countUnpaid} total={total} filter={payFilter} onFilter={setPayFilter}
        dateSquare={<CalendarSquareButton date={selDate} onClick={() => setCalOpen(true)} />} />
      <div style={{ display: 'flex', flexDirection: 'column', gap: 9, padding: '0 20px' }}>
        {allKids.length === 0 && (
          <div style={{ textAlign: 'center', color: 'var(--ink-faint)', padding: 24, fontSize: 14 }}>
            {L('Нет участников', 'No members')}
          </div>
        )}
        {kids.map(kid => (
          <KidPayRow key={kid.id} kid={kid} isPaid={isCovered(kid, selDate)}
            tariff="club" price={price} allowedWeekdays={allowedWeekdays}
            loadHistory={() => window.loadClubPaymentLog(clubId).then(l => l.filter(e => e.child === kid.id))}
            loadAttendanceHistory={() => window.loadClubAttendanceHistory(clubId, kid.id)}
            onConfirmPaid={(from, to, amount) => confirmPayment(kid, from, to, amount)}
            onDeletePaid={(rowId) => deletePayment(rowId)} />
        ))}
      </div>
    </div>
  );
}

            display: 'grid', placeItems: 'center', fontSize: 27, flexShrink: 0 }}>{club.emoji}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 17, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)' }}>{Lo(club)}</div>
            <div style={{ fontSize: 13, color: 'var(--ink-soft)', fontWeight: 600, marginTop: 2 }}>
              {Lo(club.days)}{club.time ? ` · ${club.time}` : ''}
            </div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 22, fontWeight: 800, color: club.ink, fontFamily: 'var(--font-display)' }}>{club.kids.length}</div>
            <div style={{ fontSize: 11, color: 'var(--ink-faint)', fontWeight: 700 }}>{L('детей', 'kids')}</div>
          </div>
        </Card>
      ))}
    </div>
  );
}

function ClubScreen({ params }) {
  const PALETTE = ['#FBE7A8','#CDE8FB','#D4F0DF','#FBD9E1','#FBE0C0','#E8D5FB'];
  const [club, setClub] = React.useState(() => DATA.CLUBS.find(c => c.id === params.clubId));
  const [tab, setTab] = React.useState('members');
  const [addOpen, setAddOpen] = React.useState(false);
  const [attDate, setAttDate] = React.useState(todayStr());
  // Local + savedLocal + explicit Save, same as the garden Journal — was
  // real-time-per-tap before, which meant (a) no obvious way to tell it
  // had saved besides a fleeting "..." and (b) every tap fired its own
  // network request instead of one batched Save, both inconsistent with
  // how attendance works everywhere else in the app.
  const [attLocal, setAttLocal] = React.useState({});
  const [attSavedLocal, setAttSavedLocal] = React.useState({});
  const [attSaveErr, setAttSaveErr] = React.useState(null);
  const [attCalOpen, setAttCalOpen] = React.useState(false);
  // Manual, one-off override for a rained-out/rescheduled session (Ольга:
  // Tuesday's swim class actually happened Wednesday) — just lets this one
  // day be marked regardless of the club's usual schedule, no separate
  // "why" record. Resets on its own when you leave the tab.
  const [overrideDay, setOverrideDay] = React.useState(false);
  React.useEffect(() => { if (tab !== 'attendance') setOverrideDay(false); }, [tab]);

  React.useEffect(() => {
    if (!club || tab !== 'attendance') return;
    setAttSaveErr(null);
    withRetry(() => window.loadClubAttendance(club.id, attDate))
      .then(d => { setAttLocal(d); setAttSavedLocal(d); })
      .catch(() => { setAttLocal({}); setAttSavedLocal({}); });
  }, [tab, attDate, club?.id]);

  // Members tab: tapping a kid opens the same combined attendance+payment
  // calendar as Оплаты → Кружки (PayRangeSheet), read-only — this is just
  // for checking "how much did they come, is it paid" at a glance. Actually
  // logging or deleting a payment only ever happens through the separate
  // Оплаты block, never from here.
  const [payLog,      setPayLog]      = React.useState([]);
  const [selectedKid, setSelectedKid] = React.useState(null);

  React.useEffect(() => {
    if (!club) return;
    withRetry(() => window.loadClubPaymentLog(club.id)).then(setPayLog).catch(() => {});
  }, [club?.id]);

  const payCoverage = React.useMemo(() => {
    const map = {};
    (club ? club.kids : []).forEach(kidId => { map[kidId] = bestCoverage(payLog.filter(e => e.child === kidId)); });
    return map;
  }, [payLog, club]);

  function isPayCovered(kidId, date) {
    const c = payCoverage[kidId];
    if (!c || !c.until || normDate(c.until) < date) return false;
    if (c.from && normDate(c.from) > date) return false;
    return true;
  }

  const attHasChanges = club ? club.kids.some(id => attLocal[id] !== attSavedLocal[id]) : false;

  if (!club) return <div style={{ padding: 20, color: 'var(--ink-faint)', fontSize: 14, textAlign: 'center' }}>—</div>;

  const kids = activeKids().filter(k => club.kids.includes(k.id));
  const notInClub = activeKids().filter(k => !club.kids.includes(k.id));

  // Which weekdays this club actually meets on (per the Clubs sheet) — an
  // empty array means the schedule couldn't be parsed/isn't set, treated
  // as "no restriction" rather than blocking every day. Ольга: marking
  // attendance on days a club doesn't even run on was cluttering the
  // database with meaningless records (every weekday, including weekends,
  // for clubs that only actually meet once a week).
  const clubWeekdays = clubWeekdaysJS(club);
  const attDateWeekday = new Date(attDate + 'T12:00:00').getDay();
  const isClubDay = overrideDay || clubWeekdays.length === 0 || clubWeekdays.includes(attDateWeekday);

  function handleAdd(childId) {
    const kids = [...club.kids, childId];
    const dataClub = DATA.CLUBS.find(c => c.id === club.id);
    if (dataClub) dataClub.kids = kids;
    setClub({ ...club, kids });
    setAddOpen(false);
    window.addClubMember(club.id, childId).catch(e => {
      const reverted = kids.filter(id => id !== childId);
      if (dataClub) dataClub.kids = reverted;
      setClub(c => ({ ...c, kids: reverted }));
      alert(L('Не удалось добавить: ', 'Failed to add: ') + e.message);
    });
  }

  function handleRemove(childId) {
    const kids = club.kids.filter(id => id !== childId);
    const dataClub = DATA.CLUBS.find(c => c.id === club.id);
    if (dataClub) dataClub.kids = kids;
    setClub({ ...club, kids });
    window.removeClubMember(club.id, childId).catch(e => {
      const reverted = [...kids, childId];
      if (dataClub) dataClub.kids = reverted;
      setClub(c => ({ ...c, kids: reverted }));
      alert(L('Не удалось убрать: ', 'Failed to remove: ') + e.message);
    });
  }

  function toggleAtt(childId) {
    const cur = attLocal[childId] || 'absent';
    const next = cur === 'present' ? 'absent' : 'present';
    setAttLocal(prev => ({ ...prev, [childId]: next }));
  }

  async function handleSaveAtt() {
    setAttSaveErr(null);
    // Only what actually changed, not the whole roster — otherwise saving
    // re-sends everyone else's last-known status too, which stomps another
    // staff member's own edit to a different kid with a stale copy (and
    // wrongly attributes it to whoever saved last, see Marked by).
    const delta = {};
    club.kids.forEach(id => { if (attLocal[id] !== attSavedLocal[id]) delta[id] = attLocal[id]; });
    if (Object.keys(delta).length === 0) return;
    try {
      await window.saveClubAttendance(club.id, attDate, delta);
      setAttSavedLocal({ ...attLocal });
    } catch (e) {
      setAttSaveErr(L('Ошибка сохранения', 'Save failed'));
    }
  }

  const tabBtn = (id, label) => (
    <button key={id} onClick={() => setTab(id)} style={{
      flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
      padding: '9px 4px', borderRadius: 999, fontSize: 13, fontWeight: 800,
      background: tab === id ? club.ink : '#FBF7F2',
      color: tab === id ? '#fff' : 'var(--ink-soft)',
      boxShadow: tab === id ? `0 4px 12px -4px ${club.ink}88` : 'none',
    }}>{label}</button>
  );

  return (
    <div style={{ padding: '4px 20px 28px' }}>
      {/* Header */}
      <div style={{ background: club.color, borderRadius: 20, padding: '18px 20px', marginBottom: 14, display: 'flex', alignItems: 'center', gap: 16 }}>
        <div style={{ fontSize: 48, lineHeight: 1 }}>{club.emoji}</div>
        <div>
          <div style={{ fontSize: 22, fontWeight: 800, color: club.ink, fontFamily: 'var(--font-display)' }}>{Lo(club)}</div>
          <div style={{ fontSize: 13, color: club.ink, fontWeight: 600, opacity: 0.75, marginTop: 2 }}>
            {Lo(club.days)}{club.time ? ` · ${club.time}` : ''} · {kids.length} {L('детей', 'kids')}
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
        {tabBtn('members', L('Участники', 'Members'))}
        {tabBtn('attendance', L('Посещаемость', 'Attendance'))}
      </div>

      {tab === 'members' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {kids.map(kid => {
            const grp = DATA.GROUPS.find(g => g.id === kid.group);
            const kidIndex = activeKids().filter(k => k.group === kid.group).findIndex(k => k.id === kid.id);
            const paid = isPayCovered(kid.id, todayStr());
            return (
              <Card key={kid.id} pad={12} onClick={() => setSelectedKid(kid)}
                style={{ display: 'flex', alignItems: 'center', gap: 13, background: '#FBF7F2' }}>
                <Avatar emoji={kid.emoji} color={PALETTE[kidIndex % PALETTE.length]} size={44} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 15.5, fontWeight: 700, color: 'var(--ink)' }}>{Lo(kid)}</div>
                  {grp && <span style={{ background: grp.color, color: grp.ink, fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 999 }}>{grp.emoji} {Lo(grp)}</span>}
                </div>
                {/* No price on record means this club isn't actually being
                    charged for — a Paid/Unpaid badge would just be noise. */}
                {club.price != null && (
                  <span style={{ fontSize: 11.5, fontWeight: 700, padding: '3px 9px', borderRadius: 999,
                    background: paid ? '#E6F7EE' : '#FEF0ED', color: paid ? '#1f7a55' : '#c0392b' }}>
                    {paid ? L('Оплачено', 'Paid') : L('Не оплачено', 'Unpaid')}
                  </span>
                )}
                <button onClick={(e) => { e.stopPropagation(); handleRemove(kid.id); }} className="bk-press" style={{
                  border: 'none', background: '#FBE8E8', color: '#C04040', borderRadius: 10,
                  padding: '6px 10px', fontSize: 15, cursor: 'pointer',
                }}>✕</button>
              </Card>
            );
          })}
          <button onClick={() => setAddOpen(true)} className="bk-press" style={{
            border: '2px dashed rgba(107,92,74,0.25)', background: 'transparent',
            borderRadius: 16, padding: 14, fontSize: 14, fontWeight: 700,
            color: 'var(--ink-soft)', cursor: 'pointer', fontFamily: 'inherit',
          }}>+ {L('Добавить ребёнка', 'Add child')}</button>

          {selectedKid && (
            <Portal>
              <PayRangeSheet kid={selectedKid} tariff="club" price={club.price} allowedWeekdays={clubWeekdays}
                readOnly
                loadHistory={() => window.loadClubPaymentLog(club.id).then(l => l.filter(e => e.child === selectedKid.id))}
                loadAttendanceHistory={() => window.loadClubAttendanceHistory(club.id, selectedKid.id)}
                onClose={() => setSelectedKid(null)} />
            </Portal>
          )}
        </div>
      )}

      {tab === 'attendance' && (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
            <CalendarSquareButton date={attDate} onClick={() => setAttCalOpen(true)} />
          </div>
          {/* The date picker itself is never restricted (blocked) to the
              club's usual weekday — otherwise there'd be no way to even
              land on an off-schedule day to reschedule it in the first
              place — but the real meeting day still reads clearly (dimmed
              everything else) instead of every day looking equally pickable.
              Whether that day's roster shows is entirely gated by
              isClubDay/overrideDay below. */}
          {attCalOpen && <Portal><MiniCalendar selected={attDate} onSelect={setAttDate} onClose={() => setAttCalOpen(false)}
            allowedWeekdays={null} dimWeekdays={clubWeekdays} /></Portal>}
          {!isClubDay && (
            <div style={{ textAlign: 'center', padding: 32 }}>
              <div style={{ color: 'var(--ink)', fontSize: 15, fontWeight: 800, marginBottom: 14 }}>
                {L(`${Lo(club)} не проходит в этот день`, `${Lo(club)} doesn't meet on this day`)}
              </div>
              {/* Rescheduled-session override — for the rare "rained out,
                  moved to Wednesday" case, marks attendance here anyway. */}
              <button onClick={() => setOverrideDay(true)} className="bk-press" style={{
                border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 13, fontWeight: 700,
                padding: '10px 16px', borderRadius: 999, background: '#FBF7F2', color: 'var(--ink-soft)' }}>
                🔄 {L('Перенос занятия', 'Rescheduled')}
              </button>
            </div>
          )}
          {isClubDay && kids.length === 0 && (
            <div style={{ textAlign: 'center', color: 'var(--ink-faint)', padding: 24, fontSize: 14 }}>
              {L('Нет участников', 'No members')}
            </div>
          )}
          {isClubDay && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
              {kids.map(kid => {
                const grp = DATA.GROUPS.find(g => g.id === kid.group);
                const kidIndex = activeKids().filter(k => k.group === kid.group).findIndex(k => k.id === kid.id);
                const status = attLocal[kid.id] || 'absent';
                return (
                  <Card key={kid.id} pad={12} style={{ display: 'flex', alignItems: 'center', gap: 13, background: '#FBF7F2' }}>
                    <Avatar emoji={kid.emoji} color={PALETTE[kidIndex % PALETTE.length]} size={44} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 15.5, fontWeight: 700, color: 'var(--ink)' }}>{Lo(kid)}</div>
                      {grp && <span style={{ background: grp.color, color: grp.ink, fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 999 }}>{grp.emoji} {Lo(grp)}</span>}
                    </div>
                    <StatusChip status={status} onClick={() => toggleAtt(kid.id)} />
                  </Card>
                );
              })}
            </div>
          )}
          {attSaveErr && <div style={{ textAlign: 'center', color: 'var(--no)', fontSize: 13, fontWeight: 600, padding: '6px 0' }}>{attSaveErr}</div>}
          {isClubDay && kids.length > 0 && <SaveBar hasChanges={attHasChanges} onSave={handleSaveAtt} />}
        </div>
      )}

      {/* Add member sheet */}
      {addOpen && (
        <Portal>
        <div onClick={() => setAddOpen(false)} style={{
          position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.35)', zIndex: 200,
          display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            background: 'var(--bg)', borderRadius: '22px 22px 0 0', padding: '20px 20px 36px',
            maxHeight: '70vh', display: 'flex', flexDirection: 'column',
          }}>
            <div style={{ fontSize: 17, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)', marginBottom: 14 }}>
              {L('Добавить в кружок', 'Add to club')}
            </div>
            <div style={{ overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 9 }}>
              {notInClub.length === 0 && (
                <div style={{ textAlign: 'center', color: 'var(--ink-faint)', padding: 24, fontSize: 14 }}>
                  {L('Все дети уже записаны', 'All children already enrolled')}
                </div>
              )}
              {notInClub.map(kid => {
                const grp = DATA.GROUPS.find(g => g.id === kid.group);
                const kidIndex = activeKids().filter(k => k.group === kid.group).findIndex(k => k.id === kid.id);
                return (
                  <Card key={kid.id} pad={12} onClick={() => handleAdd(kid.id)} style={{
                    display: 'flex', alignItems: 'center', gap: 13, background: '#FBF7F2', cursor: 'pointer',
                  }}>
                    <Avatar emoji={kid.emoji} color={PALETTE[kidIndex % PALETTE.length]} size={44} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 15.5, fontWeight: 700, color: 'var(--ink)' }}>{Lo(kid)}</div>
                      {grp && <span style={{ background: grp.color, color: grp.ink, fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 999 }}>{grp.emoji} {Lo(grp)}</span>}
                    </div>
                    <span style={{ fontSize: 20, color: club.ink }}>+</span>
                  </Card>
                );
              })}
            </div>
          </div>
        </div>
        </Portal>
      )}
    </div>
  );
}

Object.assign(window, { AttendanceScreen, SummaryScreen, NotificationsScreen, ComposeScreen, PaymentsScreen, PaymentsGardenScreen, PaymentsClubsScreen, ActivitiesScreen, ClubScreen });

</script>
<script type="text/babel">
// app.jsx — shell, navigation stack, language, tweaks. Mounts Балу Кидс.
// Globals: defines L / Lo / window.__lang. Uses screens + ui + i18n + data.

// ── language helpers (read live window.__lang) ─────────────────
window.__lang = window.__lang || 'ru';
function L(ru, en) { return window.__lang === 'ru' ? ru : en; }
function Lo(o) { return window.__lang === 'ru' ? o.ru : o.en; }
Object.assign(window, { L, Lo });

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#F2795B",
  "homeLayout": "Circles",
  "typeface": "Rounded"
}/*EDITMODE-END*/;

const FONTS = {
  Rounded: { display: "'Comfortaa', system-ui", body: "'Nunito', system-ui" },
  Clean:   { display: "'Onest', system-ui",     body: "'Onest', system-ui" },
};

// ── Staff helpers ─────────────────────────────────────────────────────────────

// Only mutually-exclusive day statuses live here now — 'late' stays a
// status (it already implies present, just with its own icon so it's
// never confused with the overtime sticker below). Overtime and transfer
// used to include 'extra' as a status too, which meant a day could only
// ever show ONE of {late, extra} even though both can genuinely happen at
// once (present, ran late that morning, AND worked overtime that
// evening) — they're both "extras" now (see EXTRA_STICKERS), stuck on
// top of whatever the day's status is, same as the gold paid-day badge in
// the payments calendar. 'unpaid' had no clear use and is gone for now.
const STAFF_STATUSES = [
  { id: 'present',  emoji: '✅', ru: 'Работает',    en: 'Working'      },
  { id: 'half-day', emoji: '🌗', ru: 'Полдня',      en: 'Half day'     },
  { id: 'absent',   emoji: '❌', ru: 'Нет на месте', en: 'Absent'      },
  { id: 'late',     emoji: '🕐', ru: 'Опоздал(а)',  en: 'Late'         },
  { id: 'sick',     emoji: '🤒', ru: 'Болеет',      en: 'Sick'         },
  { id: 'day-off',  emoji: '🏖️', ru: 'Выходной',   en: 'Day off'      },
];

// How much of a full day each status counts as — everything not listed
// (absent/sick/day-off) is 0. Used by StaffMonthlyScreen's "worked" total,
// so a half day genuinely counts as half instead of a full day attended.
const STAFF_STATUS_WORKED_VALUE = { present: 1, 'half-day': 0.5, late: 1 };

const SSTAFF_COLOR = {
  present: '#D4F0DF', 'half-day': '#FBE0C0', absent: '#FFE0E0', late: '#FBE7A8',
  sick: '#FBD9E1', 'day-off': '#E8D5FB',
};
const SSTAFF_INK = {
  present: '#1f7a55', 'half-day': '#7A3D00', absent: '#a03030', late: '#8a6410',
  sick: '#a8456a', 'day-off': '#5a2a86',
};

// The two "extras" — independent of status, can both be true the same day,
// shown as small stickers on the day cell rather than as a status pill.
const EXTRA_COLOR = '#CDE8FB', EXTRA_INK = '#1f5f86';

function staffStatusLabel(id) {
  const s = STAFF_STATUSES.find(x => x.id === id);
  if (!s) return id;
  return `${s.emoji} ${window.__lang === 'en' ? s.en : s.ru}`;
}

function contractDaysLeft(contractEnd) {
  if (!contractEnd) return null;
  const parts = contractEnd.match(/(\d{2})\.(\d{2})\.(\d{4})/);
  let d;
  if (parts) {
    d = new Date(`${parts[3]}-${parts[2]}-${parts[1]}`);
  } else {
    d = new Date(contractEnd);
  }
  if (isNaN(d)) return null;
  return Math.round((d - new Date()) / 86400000);
}

function positionEmoji(pos) {
  const p = (pos || '').toLowerCase();
  if (p.includes('логопед')) return '🗣️';
  if (p.includes('психолог')) return '🧠';
  if (p.includes('повар') || p.includes('cook')) return '👨‍🍳';
  if (p.includes('охран') || p.includes('security')) return '💂';
  if (p.includes('медик') || p.includes('nurse') || p.includes('врач')) return '🩺';
  if (p.includes('музык') || p.includes('music')) return '🎵';
  if (p.includes('физ') || p.includes('sport') || p.includes('gym')) return '🏃';
  return '👩‍🏫';
}

// ── StaffFormSheet ────────────────────────────────────────────────────────────

function StaffFormSheet({ member, onClose, onSaved }) {
  const isEdit = !!member;
  const [form, setForm] = React.useState(() => ({
    name:        member?.name        || '',
    position:    member?.position    || '',
    contractEnd: member?.contractEnd || '',
    phone:       member?.phone       || '',
    rate:        member?.rate        || '',
    password:    '',  // never prefill — blank = keep current on edit
  }));
  const [saving,        setSaving]        = React.useState(false);
  const [deleting,      setDeleting]      = React.useState(false);
  const [deleteConfirm, setDeleteConfirm] = React.useState(false);
  const [error,         setError]         = React.useState(null);

  function set(field) { return e => setForm(f => ({ ...f, [field]: e.target.value })); }

  async function handleSave() {
    if (!form.name.trim()) { setError(L('Введите имя', 'Enter name')); return; }
    setSaving(true); setError(null);
    try {
      const payload = { ...form, name: form.name.trim() };
      if (isEdit && !form.password.trim()) delete payload.password;
      if (isEdit) {
        await window.updateStaff(member.name, payload);
      } else {
        await window.addStaff(payload);
      }
      onSaved();
    } catch(e) { setError(e.message); setSaving(false); }
  }

  async function handleDelete() {
    setDeleting(true);
    try {
      await window.deleteStaff(member.name);
      onSaved();
    } catch(e) { alert(e.message); setDeleting(false); setDeleteConfirm(false); }
  }

  const INP = { width: '100%', boxSizing: 'border-box', border: '1.5px solid #DDD8CF', borderRadius: 12,
    padding: '11px 14px', fontFamily: 'inherit', fontSize: 14, background: '#FBF7F2',
    color: 'var(--ink)', outline: 'none' };
  const LBL = { fontSize: 11, fontWeight: 700, letterSpacing: '0.05em', textTransform: 'uppercase',
    color: 'var(--ink-soft)', marginBottom: 5, display: 'block' };

  return (
    <Portal>
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'flex', alignItems: 'flex-end',
      background: 'rgba(0,0,0,0.4)' }} onClick={onClose}>
      <div style={{ width: '100%', background: 'var(--bg)', borderRadius: '24px 24px 0 0',
        maxHeight: '92vh', display: 'flex', flexDirection: 'column' }}
        onClick={e => e.stopPropagation()}>

        {/* Handle + title */}
        <div style={{ flexShrink: 0, padding: '12px 20px 12px', borderBottom: '1px solid rgba(60,40,20,0.07)' }}>
          <div style={{ width: 40, height: 4, background: 'rgba(60,40,20,0.15)', borderRadius: 2, margin: '0 auto 12px' }} />
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)' }}>
              {isEdit ? L('Редактировать', 'Edit staff') : L('Новый сотрудник', 'Add staff')}
            </div>
            <button onClick={onClose} style={{ border: 'none', background: 'none', fontSize: 24,
              cursor: 'pointer', color: 'var(--ink-faint)', padding: 4 }}>×</button>
          </div>
        </div>

        {/* Fields */}

// ── week-view helpers (used by StaffDailyScreen's "Неделя" toggle) ────────────

const MONTHS_RU = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function mondayOf(d) {
  const day = d.getDay(); // 0=Sun..6=Sat
  const diff = day === 0 ? -6 : 1 - day;
  const m = new Date(d);
  m.setDate(d.getDate() + diff);
  m.setHours(0, 0, 0, 0);
  return m;
}
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function ScheduleCellPicker({ picker, onClose, onPick }) {

  const [time,    setTime]    = React.useState(picker.arrival_time || '');

  async function confirm() {
    setSaving(true);
    await onPick(status, status === 'late' ? time : '');

  async function clear() {
    setSaving(true);
    await onPick(null, '');
  }

  return (
    <Portal>
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'flex', alignItems: 'flex-end' }}>

        <div style={{ textAlign: 'center', marginBottom: 16 }}>
          <div style={{ fontSize: 14, fontWeight: 800, color: 'var(--ink)' }}>{picker.name.split(' ')[0]}</div>
          <div style={{ fontSize: 12.5, color: 'var(--ink-soft)', marginTop: 2 }}>
            {parseInt(dayStr, 10)} {dowNames[dow]}
          </div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, marginBottom: 14 }}>
          {STAFF_STATUSES.map(ss => {
            const sel = status === ss.id;
            return (
              <button key={ss.id} onClick={() => setStatus(ss.id)} className="bk-press"
                style={{ border: 'none', cursor: 'pointer', fontFamily: 'inherit',
                  background: sel ? SSTAFF_COLOR[ss.id] : '#F5F3EE',

                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
                <span style={{ fontSize: 20 }}>{ss.emoji}</span>
                <span style={{ fontSize: 9.5, fontWeight: 700, lineHeight: 1.2, textAlign: 'center',
                  color: sel ? SSTAFF_INK[ss.id] : 'var(--ink-soft)' }}>
                  {window.__lang === 'ru' ? ss.ru : ss.en}
                </span>
              </button>
            );
          })}
        </div>

        {status === 'late' && (
          <div style={{ marginBottom: 14 }}>
            <label style={{ fontSize: 12, fontWeight: 700, color: 'var(--ink-soft)', display: 'block', marginBottom: 5 }}>
              {L('Время прихода', 'Arrival time')}
            </label>
            <input type="time" value={time} onChange={e => setTime(e.target.value)}
              style={{ width: '100%', border: '2px solid #EDE8E0', borderRadius: 12,
                padding: '8px 12px', fontSize: 15, fontFamily: 'inherit', outline: 'none',

        <div style={{ display: 'flex', gap: 10 }}>

                padding: '11px 16px', borderRadius: 14 }}>
              {L('Убрать', 'Clear')}
            </button>
          )}
          <button onClick={confirm} disabled={saving || !status} className="bk-press"
            style={{ flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
              background: status ? (SSTAFF_COLOR[status] || '#D4F0DF') : '#EDE8E0',
              color: status ? (SSTAFF_INK[status] || '#1f7a55') : 'var(--ink-faint)',
              fontSize: 14, fontWeight: 800, padding: '11px 0', borderRadius: 14 }}>
