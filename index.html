        {L('Balu Kids', 'Balu Kids')}
      </div>
      <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14, width: '100%', maxWidth: 280 }}>
        <input
          type="password" inputMode="numeric" autoFocus value={password}
          onChange={e => { setPassword(e.target.value); setError(false); }}
          placeholder={L('Пароль', 'Password')}
          style={{ width: '100%', textAlign: 'center', fontSize: 22, letterSpacing: '0.1em', fontFamily: 'inherit',
            padding: '14px 16px', borderRadius: 16, border: error ? '2px solid var(--no)' : '2px solid transparent',
            background: '#FBF7F2', color: 'var(--ink)', outline: 'none' }} />
        {error && <div style={{ fontSize: 13, color: 'var(--no)', fontWeight: 600 }}>{L('Неверный пароль', 'Wrong password')}</div>}
        <button type="submit" disabled={loading || !password.trim()} className="bk-press" style={{
          width: '100%', border: 'none', cursor: 'pointer', fontFamily: 'var(--font-display)',
          background: '#B07848', color: '#fff', fontSize: 16, fontWeight: 800,
          padding: 14, borderRadius: 16, opacity: loading || !password.trim() ? 0.6 : 1,
          boxShadow: '0 10px 24px -8px #B07848' }}>
          {loading ? '…' : L('Войти', 'Log in')}
        </button>
      </form>
    </div>
  );
}

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [lang, setLang] = React.useState(() => localStorage.getItem('balu_lang') || 'ru');
  const [stack, setStack] = React.useState([{ name: 'home', params: {} }]);
  const [dir, setDir] = React.useState('fwd');
  const [childrenReady, setChildrenReady] = React.useState(false);
  const [loadError, setLoadError] = React.useState(null);
  const [statuses, setStatuses] = React.useState({});
  const [feed, setFeed] = React.useState([]);
  const [attSelDate, setAttSelDate] = React.useState(todayStr);
  const [attCalOpen, setAttCalOpen] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [role, setRole] = React.useState(() => loadStoredRole()?.role ?? null);
  const [teacherName, setTeacherName] = React.useState(() => loadStoredRole()?.name ?? null);

  // Shared by the initial mount and the "user came back to the app" refresh
  // below — same loaders, just without resetting childrenReady, so a
  // background refresh updates data in place instead of flashing the
  // loading screen again.
  const loadAllData = React.useCallback(() => {
    // Clear any previous failure up front — otherwise the very first
    // attempt (which fires before login and always 401s now that the API
    // requires a token) sets loadError once and it renders forever, even
    // after a later successful retry sets childrenReady=true, since the
    // error branch is checked first in the render below.
    setLoadError(null);
    return Promise.all([
      window.loadChildren(),
      window.loadClubs().catch(() => {}),
      window.loadFeed().then(() => setFeed(DATA.FEED.map(f => ({ ...f })))).catch(() => {}),
    ])
      .then(() => window.loadAttendance(todayStr()).catch(() => loadStoredAttendance() || {}))
      .then(remote => {
        const m = {}; activeKids().forEach(k => m[k.id] = remote[k.id] || 'absent');
        setStatuses(m);
        setChildrenReady(true);
      })
      .catch(err => setLoadError(err.message));
  }, []);

  React.useEffect(() => { loadAllData(); }, [loadAllData]);

  // Refetch data — and check whether a newer build is live — whenever the
  // user comes back to the app. `visibilitychange` alone isn't reliable for
  // a "added to home screen" app on iOS: after a few minutes backgrounded,
  // iOS often evicts the WKWebView from memory and restores it from the
  // bfcache without ever firing visibilitychange the way a normal browser
  // tab would — `pageshow` with `event.persisted` is the correct signal for
  // that specific case, and `focus` catches whatever's left. All three are
  // wired to the same check, deduped so a real "came back" moment (which
  // can trigger more than one of these at once) doesn't fire it 2-3 times.
  // A slow 5-minute fallback timer covers the case where the person just
  // never backgrounds the app at all and it sits open on one screen.
  const [updateAvailable, setUpdateAvailable] = React.useState(false);
  const htmlSnapshotRef = React.useRef(null);

  // Shared by the automatic listeners below AND the manual pull-to-refresh
  // gesture (see scroll container further down) — pull always calls this
  // directly so it's never rate-limited by the automatic-trigger dedupe.
  const checkForUpdate = React.useCallback(async () => {
    loadAllData();
    try {
      const res = await fetch(location.href, { cache: 'no-store' });
      const html = await res.text();
      if (htmlSnapshotRef.current && html !== htmlSnapshotRef.current) setUpdateAvailable(true);
    } catch {}
  }, [loadAllData]);

  React.useEffect(() => {
    fetch(location.href, { cache: 'no-store' }).then(r => r.text()).then(t => { htmlSnapshotRef.current = t; }).catch(() => {});
    let lastCheck = 0;
    function guarded() {
      const now = Date.now();
      if (now - lastCheck < 3000) return; // dedupe near-simultaneous triggers
      lastCheck = now;
      checkForUpdate();
    }
    function onVisible() { if (document.visibilityState === 'visible') guarded(); }
    function onPageShow(e) { if (e.persisted) guarded(); }
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('pageshow', onPageShow);
    window.addEventListener('focus', guarded);
    const fallbackTimer = setInterval(() => { if (document.visibilityState === 'visible') guarded(); }, 5 * 60 * 1000);
    return () => {
      document.removeEventListener('visibilitychange', onVisible);
      window.removeEventListener('pageshow', onPageShow);
      window.removeEventListener('focus', guarded);
      clearInterval(fallbackTimer);
    };
  }, [checkForUpdate]);

  // Pull-to-refresh — a manual, always-reliable fallback for the automatic
  // triggers above, which depend on iOS/WebKit lifecycle events that turned
  // out not to fire consistently for a home-screen-added app. Only starts
  // tracking a pull when the scroll area is already at the very top, so it
  // never fights with normal scrolling. Wired via a native (non-React)
  // touchmove listener with {passive:false} — React's synthetic touch
  // handlers are passive by default, so e.preventDefault() inside a plain
  // JSX onTouchMove silently does nothing and the browser's own scroll
  // bounce fights the gesture.
  const [pullY, pullYState] = React.useState(0);
  const pullYRef = React.useRef(0);
  function setPullY(v) { pullYRef.current = v; pullYState(v); }
  const [pullRefreshing, setPullRefreshing] = React.useState(false);
  const pullStartYRef = React.useRef(null);
  const scrollAreaRef = React.useRef(null);
  const PULL_TRIGGER = 62;
  const PULL_SLOP = 10;

  React.useEffect(() => {
    const el = scrollAreaRef.current;
    if (!el) return;
    function onTouchStart(e) {
      pullStartYRef.current = el.scrollTop <= 0 ? e.touches[0].clientY : null;
    }
    function onTouchMove(e) {
      if (pullStartYRef.current == null) return;
      const delta = e.touches[0].clientY - pullStartYRef.current;
      // A few px of slop before committing to "this is a pull" — without it,
      // the tiny downward wobble that naturally happens at the start of an
      // ordinary upward scroll swipe was calling preventDefault on the very
      // first touchmove, which made the browser treat the *whole* gesture as
      // JS-handled and silently killed normal scrolling for the rest of it.
      if (el.scrollTop > 0 || delta <= -PULL_SLOP) {
        pullStartYRef.current = null;
        setPullY(0);
        return;
      }
      if (delta > PULL_SLOP) {
        e.preventDefault();
        setPullY(Math.min((delta - PULL_SLOP) * 0.45, 88));
      }
    }
    async function onTouchEnd() {
      if (pullStartYRef.current == null) return;
      pullStartYRef.current = null;
      if (pullYRef.current > PULL_TRIGGER) {
        setPullRefreshing(true);
        setPullY(PULL_TRIGGER);
        await checkForUpdate();
        setPullRefreshing(false);
      }
      setPullY(0);
    }
    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove', onTouchMove, { passive: false });
    el.addEventListener('touchend', onTouchEnd, { passive: true });
    return () => {
      el.removeEventListener('touchstart', onTouchStart);
      el.removeEventListener('touchmove', onTouchMove);
      el.removeEventListener('touchend', onTouchEnd);
    };
  }, [checkForUpdate]);

  React.useEffect(() => {
    if (childrenReady) persistAttendance(statuses);
  }, [statuses, childrenReady]);

  React.useEffect(() => {
    if (!childrenReady) return;
    const today = todayStr();
    const overdue = activeKids().filter(k => k.paidUntil && normDate(k.paidUntil) < today);
    setFeed(f => {
      const manual = f.filter(x => !x.auto);
      const autoItems = overdue.map(k => {
        const parts = normDate(k.paidUntil).split('-');
        const since = `${parts[2]}.${parts[1]}`;
        return {
          id: `overdue-${k.id}`, auto: true, type: 'urgent', emoji: '⚠️',
          ru: `Просрочена оплата — ${Lo(k)}`, en: `Payment overdue — ${Lo(k)}`,
          time: `с ${since}`, timeEn: `since ${since}`, unread: true,
        };
      });
      return [...autoItems, ...manual];
    });
  }, [childrenReady]);

  // Teachers don't handle money — only director/staff process payments.
  // The home tile is already hidden for them, this just closes the gap if
  // a teacher lands on a payments route some other way (stale nav stack, ...).
  // Must stay above the `if (!role) return <LoginGate/>` below — every hook
  // in this component has to run on every render regardless of role, or
  // React throws a "rendered fewer/more hooks than expected" crash the
  // instant role flips (login/logout), which blanks the whole app.
  React.useEffect(() => {
    const t = stack[stack.length - 1];
    if (role === 'teacher' && t.name.startsWith('payments')) { setDir('back'); setStack([{ name: 'home', params: {} }]); }
  }, [role, stack]);

  // keep i18n + global lang in sync BEFORE children render
  window.__lang = lang;
  setI18nLang(lang);
  window.__isStaff     = role === 'staff';
  window.__isDirector  = role === 'director';
  window.__isTeacher   = role === 'teacher';
  window.__teacherName = teacherName;

  // The very first loadAllData() (from the mount effect below) fires before
  // any login and now always 401s, since the API requires a token — retry
  // it here with the freshly-issued token instead of leaving the app stuck
  // on that first failed attempt's error screen.
  if (!role) return <LoginGate onLogin={d => { persistRole(d.role, d.name, d.token); setRole(d.role); setTeacherName(d.name); loadAllData(); }} />;

  const top = stack[stack.length - 1];

  function go(name, params = {}) { setDir('fwd'); setStack(s => [...s, { name, params }]); }
  function back() { setDir('back'); setStack(s => s.length > 1 ? s.slice(0, -1) : s); }
  function home() { setDir('back'); setStack([{ name: 'home', params: {} }]); }
  function toggleLang() { const n = lang === 'ru' ? 'en' : 'ru'; setLang(n); localStorage.setItem('balu_lang', n); }
  function logout() { localStorage.removeItem('balu_role'); setRole(null); setTeacherName(null); }

  function showToast(msg) { setToast(msg); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToast(null), 1900); }
  window.showToast = showToast; // reachable from screens that don't get `actions` as a prop (e.g. PaymentsGardenScreen)

  const actions = {
    setStatus: (id, st) => setStatuses(m => ({ ...m, [id]: st })),
    markAllPresent: (ids) => setStatuses(m => { const n = { ...m }; ids.forEach(i => n[i] = 'present'); return n; }),
    saveStatuses: (map, changed) => { setStatuses(() => ({ ...map })); return window.saveAttendance(todayStr(), changed || map); },
    markAllRead: async () => {
      setFeed(f => f.map(x => ({ ...x, unread: false })));
      await window.markAllFeedRead().catch(() => {});
    },
    markOneRead: async (id) => {
      setFeed(f => f.map(x => x.id === id ? { ...x, unread: false } : x));
      const item = feed.find(x => x.id === id);
      if (!item?.auto) await window.markFeedRead(id).catch(() => {});
    },
    deletePost: async (id) => {
      setFeed(f => f.filter(x => x.id !== id));
      const item = feed.find(x => x.id === id);
      if (!item?.auto) await window.deleteFeedItem(id).catch(() => {});
    },
    addPost: async ({ ru, en, emoji = '📋', type = 'alert' }) => {
      const item = await window.addFeedItem({ ru, en, emoji, type });
      setFeed(f => [item, ...f]);
    },
    toast: showToast,
  };

  // titles
  let title = t(TITLES[top.name] || 'appName');
  if (top.name === 'group') title = Lo(DATA.GROUPS.find(g => g.id === top.params.groupId));
  if (top.name === 'child') title = t('profile');

  const fonts = FONTS[tw.typeface] || FONTS.Rounded;
  const homeStyle = (tw.homeLayout || 'Circles').toLowerCase();

  const rootStyle = {
    '--accent': tw.accent,
    '--accent-soft': `color-mix(in srgb, ${tw.accent} 15%, var(--card))`,
    '--font-display': fonts.display,
    '--font-body': fonts.body,
    height: '100%', display: 'flex', flexDirection: 'column',
    position: 'relative', background: 'var(--bg)', color: 'var(--ink)',
    fontFamily: 'var(--font-body)',
  };

  function renderScreen() {
    const p = { ...top.params };
    switch (top.name) {
      case 'home':          return <HomeScreen go={go} statuses={statuses} feed={feed} homeStyle={homeStyle} />;
      case 'children':      return <ChildrenScreen go={go} statuses={statuses} />;
      case 'group':         return <GroupScreen params={p} go={go} statuses={statuses} />;
      case 'child':         return <ChildScreen params={p} statuses={statuses} back={back} />;
      case 'attendance':    return <AttendanceScreen statuses={statuses} actions={actions} go={go}
        selDate={attSelDate} setSelDate={setAttSelDate} calOpen={attCalOpen} setCalOpen={setAttCalOpen} />;
      case 'payments':         return <PaymentsScreen go={go} />;
      case 'payments-garden':  return <PaymentsGardenScreen />;
      case 'payments-clubs':   return <PaymentsClubsScreen />;
      case 'activities':       return <ActivitiesScreen go={go} />;
      case 'club':          return <ClubScreen params={p} />;
      case 'summary':       return <SummaryScreen statuses={statuses} go={go} />;
      case 'notifications': return <NotificationsScreen feed={feed} go={go} actions={actions} />;
      case 'compose':       return <ComposeScreen back={back} actions={actions} />;
      case 'team':           return <TeamScreen go={go} />;
      case 'staff-schedule': return <StaffScheduleScreen />;
      case 'staff-daily':    return <StaffDailyScreen params={p} go={go} />;
      case 'staff-monthly':  return <StaffMonthlyScreen />;
      default:              return null;
    }
  }

  return (
    <div style={rootStyle}>
      {/* ── new version available — a slim strip that pushes the header
          down instead of covering it, detected on returning to the app,
          not forced automatically so it never yanks the screen out from
          under whatever the person is doing right now ── */}
      {updateAvailable && (
        <button onClick={() => window.location.reload()} className="bk-press" style={{
          flexShrink: 0, border: 'none', cursor: 'pointer', width: '100%',
          background: '#B07848', color: '#fff', fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 12.5,
          padding: '8px 16px', paddingTop: 'calc(8px + env(safe-area-inset-top))',
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
          🔄 {L('Доступно обновление — нажмите, чтобы применить', 'Update available — tap to apply')}
        </button>
      )}

      {/* ── header ── */}
      <div style={{ flexShrink: 0, position: 'relative', zIndex: 8,
        background: '#fff', paddingTop: 'env(safe-area-inset-top)',
        boxShadow: '0 2px 8px rgba(60,40,20,0.1)' }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', padding: '2px 16px 10px', gap: 8 }}>
          {/* left: back or logo + title */}
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 8, flex: 1 }}>
            {stack.length > 1 ? (
              <button onClick={back} className="bk-press" style={{ display: 'flex', alignItems: 'center', gap: 4,
                border: 'none', background: '#B07848', cursor: 'pointer', fontFamily: 'inherit',
                color: '#fff', fontSize: 13, fontWeight: 800, padding: '5px 12px 5px 8px',
                borderRadius: 999 }}>
                <Chevron dir="left" size={16} color="#fff" />{t('back')}
              </button>
            ) : (
              <>
                <div style={{ position: 'relative', display: 'inline-flex', background: '#B07848', padding: '5px 14px', borderRadius: 999 }}>
                  <span style={{ fontSize: 15, fontWeight: 800, color: '#fff', fontFamily: 'var(--font-display)' }}>{title}</span>
                  <div style={{ position: 'absolute', bottom: -12, right: -26, background: '#F2A81D', color: '#3E2510', fontSize: 9, fontWeight: 800, padding: '1px 4px', borderRadius: 999, boxShadow: '0 2px 6px -2px rgba(60,40,20,0.2)' }}>mini app</div>
                </div>
              </>
            )}
          </div>
          {/* right: logout + lang toggle */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <button onClick={logout} className="bk-press" title={L('Выйти', 'Log out')} style={{
              display: 'flex', alignItems: 'center', justifyContent: 'center', width: 30, height: 30,
              border: 'none', cursor: 'pointer', borderRadius: 999, background: '#FBF7F2', color: '#B07848', fontSize: 14 }}>
              ⏻
            </button>
            <button onClick={toggleLang} className="bk-press" style={{ display: 'flex', border: 'none', cursor: 'pointer',
              borderRadius: 999, overflow: 'hidden', fontFamily: 'inherit', fontSize: 12, fontWeight: 800,
              background: '#B07848', padding: 2, gap: 2 }}>
              <span style={{ padding: '5px 10px', borderRadius: 999, background: lang === 'ru' ? '#F2A81D' : 'transparent', color: lang === 'ru' ? '#3E2510' : '#fff', transition: 'all 0.2s' }}>RU</span>
              <span style={{ padding: '5px 10px', borderRadius: 999, background: lang === 'en' ? '#F2A81D' : 'transparent', color: lang === 'en' ? '#3E2510' : '#fff', transition: 'all 0.2s' }}>EN</span>
            </button>
          </div>
        </div>
      </div>

      {/* ── scroll area ── */}
      <div ref={scrollAreaRef} style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', position: 'relative' }}>
        {/* pull-to-refresh indicator — same gold-sticker language as the
            paid-day badge, so it reads as part of the same visual family */}
        {(pullY > 0 || pullRefreshing) && (
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: pullRefreshing ? PULL_TRIGGER : pullY,
            display: 'flex', alignItems: 'flex-end', justifyContent: 'center', paddingBottom: 8,
            transition: pullRefreshing ? 'height 0.15s ease' : 'none', zIndex: 5, pointerEvents: 'none' }}>
            <div style={{ width: 30, height: 30, borderRadius: '50%',
              background: pullY > PULL_TRIGGER || pullRefreshing
                ? 'linear-gradient(135deg, #F0D060, #C2941A)' : '#FBF7F2',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: '0 2px 6px -1px rgba(60,40,10,0.35)',
              opacity: Math.max(pullY / PULL_SLOP, pullRefreshing ? 1 : 0.35),
              transition: 'background 0.15s ease, opacity 0.1s ease' }}>
              {pullRefreshing ? (
                <svg width="16" height="16" viewBox="-9 -8 18 18" fill="#4a3705" style={{ animation: 'bk-spin 0.9s linear infinite' }}>
                  <ellipse cx="0" cy="5" rx="5.4" ry="4.8" />
                  <circle cx="-5.4" cy="-1" r="2.6" />
                  <circle cx="-2"   cy="-4" r="2.6" />
                  <circle cx="2"    cy="-4" r="2.6" />
                  <circle cx="5.4"  cy="-1" r="2.6" />
                </svg>
              ) : (
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke={pullY > PULL_TRIGGER ? '#4a3705' : '#B07848'} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"
                  style={{ transform: `rotate(${Math.min(pullY / PULL_TRIGGER, 1) * 180}deg)`, transition: 'transform 0.1s ease' }}>
                  <polyline points="6 9 12 15 18 9" />
                </svg>
              )}
            </div>
          </div>
        )}
        {/* paw trail */}
        <svg style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 0 }}
          xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 1980" preserveAspectRatio="xMidYMin slice">
          {[
            { x: 200, y:  40, r: 10  },
            { x: 60,  y:  95, r: -40 },
            { x: 310, y: 150, r: 30  },
            { x: 140, y: 205, r: -15 },
            { x: 270, y: 260, r: 50  },
            { x: 80,  y: 315, r: -35 },
            { x: 230, y: 370, r: 25  },
            { x: 50,  y: 425, r: -50 },
            { x: 300, y: 480, r: 15  },
            { x: 160, y: 535, r: -25 },
            { x: 260, y: 590, r: 40  },
            { x: 90,  y: 645, r: -10 },
            { x: 320, y: 700, r: 55  },
            { x: 70,  y: 755, r: -45 },
            { x: 200, y: 810, r: 20  },
            { x: 130, y: 865, r: -30 },
            { x: 280, y: 920, r: 45  },
            { x: 55,  y: 975, r: -20 },
            { x: 240, y:1030, r: 35  },
            { x: 110, y:1085, r: -55 },
            { x: 305, y:1140, r: 10  },
            { x: 170, y:1195, r: -40 },
            { x: 65,  y:1250, r: 50  },
            { x: 290, y:1305, r: -15 },
            { x: 145, y:1360, r: 30  },
            { x: 340, y:1415, r: -35 },
            { x: 100, y:1470, r: 45  },
            { x: 220, y:1525, r: -20 },
            { x: 45,  y:1580, r: 55  },
            { x: 310, y:1635, r: -10 },
            { x: 175, y:1690, r: 40  },
            { x: 75,  y:1745, r: -45 },
            { x: 260, y:1800, r: 20  },
            { x: 120, y:1855, r: -30 },
            { x: 335, y:1910, r: 15  },
          ].map((p, i) => (
            <g key={i} transform={`translate(${p.x},${p.y}) rotate(${p.r})`} opacity="0.09" fill="#B07848">
              <ellipse cx="0" cy="15" rx="16" ry="14" />
              <circle cx="-16" cy="-2" r="7.5" />
              <circle cx="-6"  cy="-11" r="7.5" />
              <circle cx="6"   cy="-11" r="7.5" />
              <circle cx="16"  cy="-2" r="7.5" />
            </g>
          ))}
        </svg>
        <div key={top.name + stack.length} className={dir === 'fwd' ? 'scr-fwd' : 'scr-back'}
          style={{ minHeight: '100%', position: 'relative', zIndex: 1,
            transform: `translateY(${pullRefreshing ? PULL_TRIGGER : pullY}px)`,
            transition: pullStartYRef.current == null ? 'transform 0.15s ease' : 'none' }}>
          {loadError ? (
            <div style={{ padding: 40, textAlign: 'center', color: 'var(--no)', fontWeight: 700 }}>
              {L('Не удалось загрузить данные детей', 'Failed to load children data')}<br />
              <span style={{ fontSize: 12, color: 'var(--ink-faint)', fontWeight: 500 }}>{loadError}</span>
            </div>
          ) : !childrenReady ? (
            <div style={{ padding: 40, textAlign: 'center', color: 'var(--ink-faint)', fontWeight: 700 }}>
              {L('Загрузка…', 'Loading…')}
            </div>
          ) : renderScreen()}
        </div>
      </div>

      {/* ── toast ── */}
      {toast && (
        <div className="bk-toast" style={{ position: 'absolute', bottom: 56, left: '50%', transform: 'translateX(-50%)',
          background: '#F2A81D', color: '#3E2510', padding: '10px 22px', borderRadius: 999, fontWeight: 800,
          fontSize: 14, whiteSpace: 'nowrap', zIndex: 40, boxShadow: '0 4px 16px -4px rgba(242,168,29,0.5)' }}>{toast}</div>
      )}

      {/* ── tweaks ── */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Look" />
        <TweakRadio label="Home layout" value={tw.homeLayout} options={['Circles', 'Cards', 'List']}
          onChange={v => setTweak('homeLayout', v)} />
        <TweakRadio label="Typeface" value={tw.typeface} options={['Rounded', 'Clean']}
          onChange={v => setTweak('typeface', v)} />
        <TweakColor label="Accent" value={tw.accent}
          options={['#F2795B', '#2BA89E', '#8C6BE6', '#E8A33D']}
          onChange={v => setTweak('accent', v)} />
      </TweaksPanel>
    </div>
  );
}

function Stage() {
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 500;
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    if (isMobile) return;
    function fit() {
      const m = 24;
      setScale(Math.min((window.innerWidth - m) / 402, (window.innerHeight - m) / 874, 1.15));
    }
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  if (isMobile) {
    return (
      <div style={{ height: '100dvh', width: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
        <App />
      </div>
    );
  }
  return (
    <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 12, boxSizing: 'border-box' }}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
        <IOSDevice>
          <App />
        </IOSDevice>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Stage />);

</script>
</body>
</html>
