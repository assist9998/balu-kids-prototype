function AttendanceScreen({ statuses, actions, go, selDate, setSelDate, calOpen, setCalOpen }) {
  const [filter,    setFilter]    = React.useState('all');
  const [loading,   setLoading]   = React.useState(false);
  const [allMarked, setAllMarked] = React.useState(false);
  const [calKid,    setCalKid]    = React.useState(null);
  const snapRef = React.useRef(null);

  const isToday = selDate === todayStr();

  const makeLocal = (src) => {
    const m = {}; activeKids().forEach(k => { m[k.id] = (src||{})[k.id] || 'absent'; }); return m;
  };
  const [local,      setLocal]      = React.useState(() => makeLocal(statuses));
  const [savedLocal, setSavedLocal] = React.useState(() => makeLocal(statuses));

  // sync today statuses when they change externally
  React.useEffect(() => {
    if (!isToday) return;
    const m = makeLocal(statuses);
    setLocal(m); setSavedLocal(m);
  }, [statuses, isToday]);

  // load past date from API
  React.useEffect(() => {
    if (isToday) return;
    setLoading(true); setAllMarked(false);
    window.loadAttendance(selDate)
      .then(data => { const m = makeLocal(data); setLocal(m); setSavedLocal(m); })
      .catch(()  => { const m = makeLocal({});   setLocal(m); setSavedLocal(m); })
      .finally(() => setLoading(false));
  }, [selDate]);

  const kids   = activeKids().filter(k => filter === 'all' || k.group === filter);
  const counts = {
    present: activeKids().filter(k => local[k.id] === 'present').length,
    absent:  activeKids().filter(k => local[k.id] !== 'present').length,
  };
  const hasChanges = activeKids().some(k => local[k.id] !== savedLocal[k.id]);

  function toggleMarkAll() {
    if (!allMarked) {
      snapRef.current = { ...local };
      const all = {}; activeKids().forEach(k => { all[k.id] = 'present'; });
      setLocal(all); setAllMarked(true);
    } else {
      setLocal(snapRef.current || makeLocal(statuses)); setAllMarked(false);
    }
  }
  function setStatus(id, st) {
    if (st === 'present' && local[id] !== 'present') {
      const kid = activeKids().find(k => k.id === id);
      const covered = kid && kid.paidUntil && normDate(kid.paidUntil) >= selDate;
      if (kid && !covered) {
        actions.toast(L('Не оплачено — обратитесь к бухгалтеру/директору', 'Not paid — contact the accountant/director'));
      }
    }
    setLocal(m => ({ ...m, [id]: st }));
    setAllMarked(false);
  }
  const [saveErr, setSaveErr] = React.useState(null);
  async function handleSave() {
    setSaveErr(null);
    if (!hasChanges) return;
    // Only send what this user actually changed since the last save — not
    // everyone's status. The backend now records who marked each kid
    // (Marked by), and a kid who stays "absent" all day untouched gets an
    // explicit row from the end-of-day sweep instead of from us resending
    // the whole roster. Sending everyone here would (a) wrongly attribute
    // kids nobody touched to whoever happens to hit Save, and (b) let two
    // people editing different kids at once stomp each other's changes.
    const delta = {};
    activeKids().forEach(k => { if (local[k.id] !== savedLocal[k.id]) delta[k.id] = local[k.id]; });
    try {
      if (isToday) {
        await actions.saveStatuses(local, delta);
      } else {
        await window.saveAttendance(selDate, delta);
      }
      setSavedLocal({ ...local });
    } catch (e) {
      setSaveErr(L('Ошибка сохранения', 'Save failed'));
    }
  }

  const chips = [{ id: 'all', label: t('all'), emoji: '🗂️' }, ...DATA.GROUPS.map(g => ({ id: g.id, label: Lo(g), emoji: g.emoji }))];

  const selDateObj = new Date(selDate + 'T12:00:00');
  const selIsWeekend = isWeekend(selDateObj);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>

      {selIsWeekend ? (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
          minHeight:'60vh', gap:12, padding:32, textAlign:'center' }}>
          <div style={{ fontSize:48 }}>🌅</div>
          <div style={{ fontSize:20, fontWeight:800, color:'var(--ink)', fontFamily:'var(--font-display)' }}>
            {L('Выходной день', 'Weekend')}
          </div>
          <div style={{ fontSize:14, color:'var(--ink-soft)' }}>
            {L('Журнал посещаемости доступен только в будние дни', 'Attendance journal is only available on weekdays')}
          </div>
        </div>
      ) : loading ? (
        <div style={{ textAlign:'center', padding:40, color:'var(--ink-faint)', fontSize:15 }}>…</div>
      ) : (
        <>
        {/* group filter */}
        <div style={{ display:'flex', gap:8, overflowX:'auto', padding:'0 20px 10px', scrollbarWidth:'none' }}>
          {chips.map(c => (
            <button key={c.id} onClick={() => setFilter(c.id)} className="bk-press" style={{
              flexShrink:0, border:'none', cursor:'pointer', fontFamily:'inherit',
              padding:'8px 14px', borderRadius:999, fontSize:13.5, fontWeight:700,
              background: filter===c.id ? '#B07848' : '#FBF7F2',
              color: filter===c.id ? '#fff' : 'var(--ink-soft)',
              boxShadow: filter===c.id ? '0 6px 14px -6px #B07848' : '0 1px 2px rgba(60,40,20,0.05)' }}>
              {c.emoji} {c.label}
            </button>
          ))}
        </div>

        {/* count strip */}
        <div style={{ display:'flex', gap:10, padding:'0 20px 8px' }}>
          <CalendarSquareButton date={selDate} onClick={() => setCalOpen(true)} />
          <CountStat n={counts.present} label={t('present')} tone={STATUS_TONE.present} />
          <CountStat n={counts.absent}  label={t('absent')}  tone={STATUS_TONE.absent} />
        </div>

        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'8px 24px 12px' }}>
          <span style={{ fontSize:12.5, color:'var(--ink-faint)', fontWeight:600 }}>{t('tapToCycle')}</span>
          <button onClick={toggleMarkAll} className="bk-press" style={{
            border:'2px solid #B07848', cursor:'pointer', fontFamily:'inherit', fontSize:13, fontWeight:700,
            color: allMarked ? '#fff' : '#B07848', background: allMarked ? '#B07848' : 'transparent',
            padding:'5px 12px', borderRadius:999,
            boxShadow: allMarked ? '0 6px 14px -6px #B07848' : 'none', transition:'all 0.18s' }}>
            {allMarked ? `✓ ${t('markAll')}` : t('markAll')}
          </button>
        </div>

        {/* roster */}
        <div style={{ display:'flex', flexDirection:'column', gap:9, padding:'0 20px' }}>
          {kids.map(kid => {
            const st = local[kid.id];
            const PALETTE = ['#FBE7A8','#CDE8FB','#D4F0DF','#FBD9E1','#FBE0C0','#E8D5FB'];
            const kidIndex = activeKids().filter(k => k.group === kid.group).findIndex(k => k.id === kid.id);
            const badges = careBadges(kid, { includeMeals: false });
            if (!(kid.paidUntil && normDate(kid.paidUntil) >= selDate)) {
              badges.push({ emoji: '❗', label: 'Unpaid', tone: 'warn' });
            }
            return (
              // Card visits are rare/deliberate via the Дети tab already —
              // here in the daily roster, tapping a kid is far more likely
              // to mean "show me their history", same as tapping a row in
              // Payments does. Profile is one tap away from Дети if needed.
              <Card key={kid.id} pad={12} onClick={() => setCalKid(kid)}
                style={{ display:'flex', alignItems:'center', gap:13, background:'#FBF7F2' }}>
                <Avatar emoji={kid.emoji} color={PALETTE[kidIndex % PALETTE.length]} size={44} />
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:15.5, fontWeight:700, color:'var(--ink)' }}>{Lo(kid)}</div>
                  {badges.length > 0 && (
                    <div style={{ display:'flex', flexWrap:'wrap', gap:5, marginTop:5 }}>
                      {badges.map((b, bi) => <ScoutBadge key={bi} compact {...b} />)}
                    </div>
                  )}
                </div>
                <div onClick={e => e.stopPropagation()} style={{ padding:6 }}>
                  <StatusChip status={st} onClick={() => setStatus(kid.id, CYCLE[st])} />
                </div>
              </Card>
            );
          })}
        </div>

        {saveErr && <div style={{ textAlign:'center', color:'var(--no)', fontSize:13, fontWeight:600, padding:'6px 0' }}>{saveErr}</div>}
        <SaveBar hasChanges={hasChanges} onSave={handleSave} />
        </>
      )}

      {calOpen && <Portal><MiniCalendar selected={selDate} onSelect={setSelDate} onClose={() => setCalOpen(false)} /></Portal>}
      {calKid && <Portal><AttendanceHistorySheet kid={calKid} onClose={() => setCalKid(null)} /></Portal>}
    </div>
  );
}

  const totalCollected = kids
    .filter(k => k.paidUntil && normDate(k.paidUntil) >= today)

            <MiniStat dot="var(--no)"   n={absent}  label={t('absent')} />

function WeekChart() {
  const LABELS = [
    { ru: 'Пн', en: 'Mo' }, { ru: 'Вт', en: 'Tu' }, { ru: 'Ср', en: 'We' },
    { ru: 'Чт', en: 'Th' }, { ru: 'Пт', en: 'Fr' },
  ];
  const [data, setData] = React.useState(LABELS.map(d => ({ ...d, v: null })));
  const total = activeKids().length;

  React.useEffect(() => {
    if (!total) return;
    const now = new Date();
    const todayMid = new Date(now); todayMid.setHours(0, 0, 0, 0);
    const dow = now.getDay() || 7;
    const monday = new Date(now); monday.setDate(now.getDate() - (dow - 1));
    const days = LABELS.map((lbl, i) => {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const mid = new Date(d); mid.setHours(0, 0, 0, 0);
      const iso = d.toISOString().slice(0, 10);
      return { ...lbl, iso, future: mid > todayMid };
    });
    Promise.all(days.map(d => d.future
      ? Promise.resolve({})
      : fetch(`${window.API_BASE}/attendance/${d.iso}`).then(r => r.ok ? r.json() : {}).catch(() => ({}))
    )).then(results => {
      setData(days.map((d, i) => {
        if (d.future) return { ru: d.ru, en: d.en, v: null };
        const present = Object.values(results[i]).filter(v => v !== 'absent').length;
        return { ru: d.ru, en: d.en, v: Math.round(present / total * 100) };
      }));
    });
  }, [total]);

  const vals = data.map(d => d.v ?? 0);
  const max = Math.max(...vals, 1);
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 10, height: 110, marginTop: 8 }}>
      {data.map((d, i) => {
        const isFuture = d.v === null;
        const h = isFuture ? 4 : Math.max((d.v / max) * 78, 4);
        return (
          <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, height: '100%', justifyContent: 'flex-end' }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: isFuture ? 'transparent' : 'var(--ink-soft)' }}>{isFuture ? '' : d.v}</div>
            <div style={{ width: '100%', maxWidth: 30, height: `${h}px`, borderRadius: 8,
              background: !isFuture && d.v === max ? '#B07848' : '#EDE8E0',
              opacity: isFuture ? 0.3 : 1,
              transition: 'height 0.8s cubic-bezier(.22,1,.36,1)' }} />
            <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--ink-faint)' }}>{Lo(d)}</div>
          </div>
        );
      })}
    </div>
  );
}

function fmtFeedTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.toDateString() === now.toDateString()) return L(`Сегодня ${hm}`, `Today ${hm}`);
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return L(`Вчера ${hm}`, `Yesterday ${hm}`);
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)} ${hm}`;
}

const TYPE_TINT = { birthday: '#FBD9E1', alert: '#FBE7A8', message: '#CDE8FB', sent: '#D4F0DF', urgent: '#FBD9E1' };

function LongPressCard({ onDelete, onTap, children, style }) {
  const [confirm, setConfirm] = React.useState(false);
  const timer = React.useRef(null);
  function onTouchStart() { timer.current = setTimeout(() => setConfirm(true), 500); }
  function onTouchEnd()   { clearTimeout(timer.current); }
  return (
    <div style={{ position: 'relative', userSelect: 'none', WebkitUserSelect: 'none' }}
      onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} onTouchMove={() => clearTimeout(timer.current)}>
      <div onClick={() => { if (!confirm) onTap(); }} style={style}>{children}</div>
      {confirm && (
        <div style={{ position: 'absolute', inset: 0, borderRadius: 18, background: 'rgba(231,76,60,0.92)',
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 12, zIndex: 5 }}>
          <button onClick={() => { onDelete(); setConfirm(false); }} className="bk-press" style={{
            border: 'none', cursor: 'pointer', background: '#fff', color: '#e74c3c',
            fontFamily: 'inherit', fontWeight: 800, fontSize: 14, padding: '8px 18px', borderRadius: 999 }}>
            {L('Удалить', 'Delete')}
          </button>
          <button onClick={() => setConfirm(false)} className="bk-press" style={{
            border: 'none', cursor: 'pointer', background: 'rgba(255,255,255,0.25)', color: '#fff',
            fontFamily: 'inherit', fontWeight: 700, fontSize: 14, padding: '8px 18px', borderRadius: 999 }}>
            {L('Отмена', 'Cancel')}
          </button>
        </div>
      )}
    </div>
  );
}

function ComposeScreen({ back, actions }) {
  const [text,    setText]    = React.useState('');
  const [ruText,  setRuText]  = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [typeIdx, setTypeIdx] = React.useState(0);
  const types = [
    { id: 'alert',  emoji: '📢', label: t('typeAlert'),  color: '#FBE0C0' },
    { id: 'urgent', emoji: '⚠️', label: t('typeUrgent'), color: '#FBD9E1' },
    { id: 'dayoff', emoji: '🏖️', label: t('typeDayOff'), color: '#CDE8FB' },
    { id: 'event',  emoji: '📅', label: t('typeEvent'),  color: '#D4F0DF' },
  ];
  const type = types[typeIdx].id;
  const touchTypeRef = React.useRef(null);

  async function translate() {
    if (!text.trim()) return;
    setLoading(true);
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.trim())}&langpair=ru|en`);
      const data = await res.json();
      const en = data.responseData?.translatedText;
      if (en) { setRuText(text); setText(en); }
    } catch {}
    finally { setLoading(false); }
  }

  const [sending, setSending] = React.useState(false);
  async function send() {
    if (!text.trim() || sending) return;
    setSending(true);
    try {
      const chosen = types[typeIdx];
      await actions.addPost({ ru: ruText || text, en: text, emoji: chosen.emoji, type });
      actions.toast(t('noteSaved') + ' ✓');
      back();
    } catch(e) {
      setSending(false);
    }
  }

  return (
    <div style={{ padding: '6px 20px 30px', display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div
        onTouchStart={e => { touchTypeRef.current = e.touches[0].clientX; }}
        onTouchEnd={e => {
          if (touchTypeRef.current === null) return;
          const dx = e.changedTouches[0].clientX - touchTypeRef.current;
          touchTypeRef.current = null;
          if (dx < -50 && typeIdx < types.length - 1) setTypeIdx(i => i + 1);
          else if (dx > 50 && typeIdx > 0) setTypeIdx(i => i - 1);
        }}
        style={{ borderRadius: 22, padding: '20px 18px 16px', background: types[typeIdx].color,
          boxShadow: '0 1px 2px rgba(60,40,20,0.04), 0 12px 28px -20px rgba(60,40,20,0.35)',
          userSelect: 'none' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
          <button onClick={() => typeIdx > 0 && setTypeIdx(i => i - 1)} style={{ border: 'none', background: 'none', padding: 0,
            fontSize: 20, color: '#B07848', fontWeight: 800, opacity: typeIdx > 0 ? 1 : 0.2, cursor: typeIdx > 0 ? 'pointer' : 'default' }}>‹</button>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 40, lineHeight: 1, marginBottom: 6 }}>{types[typeIdx].emoji}</div>
            <div style={{ fontSize: 16, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)' }}>{types[typeIdx].label}</div>
          </div>
          <button onClick={() => typeIdx < types.length - 1 && setTypeIdx(i => i + 1)} style={{ border: 'none', background: 'none', padding: 0,
            fontSize: 20, color: '#B07848', fontWeight: 800, opacity: typeIdx < types.length - 1 ? 1 : 0.2, cursor: typeIdx < types.length - 1 ? 'pointer' : 'default' }}>›</button>
        </div>
        <div style={{ display: 'flex', gap: 5, justifyContent: 'center' }}>
          {types.map((_, i) => (
            <div key={i} onClick={() => setTypeIdx(i)} style={{ height: 5, borderRadius: 3, cursor: 'pointer', transition: 'all 0.2s',
              width: i === typeIdx ? 18 : 5, background: i === typeIdx ? '#B07848' : 'rgba(176,120,72,0.3)' }} />
          ))}
        </div>
      </div>

      <div style={{ position: 'relative' }}>
        <textarea value={text} onChange={e => { setText(e.target.value); setRuText(''); }}
          placeholder={t('noteTextPlaceholder')}
          rows={4} style={{ width: '100%', boxSizing: 'border-box', resize: 'none', border: 'none',
          background: '#FBF7F2', borderRadius: 18, padding: 16, paddingBottom: 44, fontFamily: 'inherit', fontSize: 15.5,
          color: 'var(--ink)', fontWeight: 600, lineHeight: 1.4, outline: 'none',
          boxShadow: '0 1px 2px rgba(60,40,20,0.05)' }} />
        <button onClick={translate} disabled={!text.trim() || loading} className="bk-press" style={{
          position: 'absolute', bottom: 10, right: 10,
          border: 'none', cursor: text.trim() && !loading ? 'pointer' : 'default',
          fontSize: 20, lineHeight: 1, padding: '4px 8px', borderRadius: 10,
          background: 'rgba(255,255,255,0.7)', opacity: loading ? 0.4 : text.trim() ? 1 : 0.3,
          transition: 'opacity .2s', boxShadow: '0 1px 4px rgba(60,40,20,0.1)' }}>
          🇬🇧
        </button>
      </div>

      {text.trim() && (
        <div style={{ position: 'sticky', bottom: 0, marginTop: 4, padding: '14px 0 26px',
          background: 'linear-gradient(to top, var(--bg) 62%, transparent)' }}>
          <button onClick={send} disabled={sending} className="bk-press" style={{
            width: '100%', border: 'none', cursor: sending ? 'default' : 'pointer', fontFamily: 'var(--font-display)',
            background: '#B07848', color: '#fff', fontSize: 17, fontWeight: 800,
            padding: 15, borderRadius: 18, boxShadow: '0 10px 24px -8px #B07848',
            opacity: sending ? 0.7 : 1 }}>
            {sending ? '…' : t('save')}
          </button>
        </div>
      )}
    </div>
  );
}

const PAY_PALETTE = ['#FBE7A8','#CDE8FB','#D4F0DF','#FBD9E1','#FBE0C0','#E8D5FB'];

function fmtMoney(n) {
  if (n == null) return '—';
  if (!n) return '0';
  return n % 1000 === 0 ? `${n / 1000}k` : String(n);
}

function PayStats({ cp, cu, total, filter, onFilter, dateSquare }) {
  const statBox = (id, count, label, color) => {
    const active = filter === id;
    return (
      <div onClick={() => onFilter(active ? 'all' : id)} className="bk-press" style={{
        flex: 1, borderRadius: 18, padding: '12px 8px', textAlign: 'center', cursor: 'pointer',
        background: active ? '#B07848' : '#FBF7F2',
        boxShadow: active ? '0 6px 18px -6px #B07848' : 'none', transition: 'all 0.18s' }}>
        <div style={{ fontSize: 24, fontWeight: 600, lineHeight: 1,
          color: active ? '#fff' : color }}>{count}</div>
        <div style={{ fontSize: 12, fontWeight: 600, marginTop: 4,
          color: active ? 'rgba(255,255,255,0.8)' : 'var(--ink-soft)' }}>{label}</div>
      </div>
    );
  };
  return (
    <div style={{ display: 'flex', gap: 10, padding: '0 20px 16px' }}>
      {dateSquare}
      {statBox('paid',   cp, L('Оплатили', 'Paid'),      'var(--ok)')}
      {statBox('unpaid', cu, L('Не оплатили', 'Unpaid'), 'var(--no)')}
      {!window.__isStaff && (
      <div style={{ flex: 1.4, background: '#FBF7F2', borderRadius: 18, padding: '12px 8px', textAlign: 'center' }}>
        <div style={{ fontSize: 22, fontWeight: 600, color: '#B07848', lineHeight: 1 }}>{fmtMoney(total)}</div>
        <div style={{ fontSize: 12, color: 'var(--ink-soft)', fontWeight: 600, marginTop: 4 }}>{L('Собрано', 'Collected')}</div>
      </div>
      )}
    </div>
  );
}

function fmtTourDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  const mRu = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const mEn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return L(`${d.getDate()} ${mRu[d.getMonth()]}`, `${mEn[d.getMonth()]} ${d.getDate()}`);
}

function PaymentsGardenScreen() {
  const [tariff,    setTariff]    = React.useState('longterm');
  const [group,     setGroup]     = React.useState('all');
  const [payFilter, setPayFilter] = React.useState('all');
  const [selDate,   setSelDate]   = React.useState(todayStr);
  const [calOpen,   setCalOpen]   = React.useState(false);
  // Confirming or deleting a logged payment patches kid.paidFrom/paidUntil
  // in place on the shared DATA.CHILDREN object (see confirmPayment below) —
  // this tick just forces a re-render so the list picks that up immediately.
  const [, forceTick] = React.useReducer(x => x + 1, 0);

  const isTour = tariff === 'tourist';

  const allKids = activeKids()
    .filter(k => isTour ? k.contract === 'tourist' : k.contract !== 'tourist')
    .filter(k => group === 'all' || k.group === group);

  function isCoveredOn(kid, date) {
    // both bounds matter — a kid paid ahead for a period that hasn't
    // started yet (paidFrom in the future) isn't covered *today* just
    // because paidUntil is comfortably far off
    if (!kid.paidUntil || normDate(kid.paidUntil) < date) return false;
    if (kid.paidFrom && normDate(kid.paidFrom) > date) return false;
    return true;
  }

  // the "Оплачено" badge, the stats, and the filter all check the same
  // selected date (defaults to today) — previously the badge was always
  // pinned to today while a separate line of text respected the picked
  // date, so the two could visibly disagree with each other
  const countPaid   = allKids.filter(k => isCoveredOn(k, selDate)).length;
  const countUnpaid = allKids.length - countPaid;
  const total       = allKids.filter(k => isCoveredOn(k, selDate)).reduce((s, k) => s + (Number(k.price) || 0), 0);
  const kids        = allKids.filter(k => payFilter === 'paid' ? isCoveredOn(k, selDate) : payFilter === 'unpaid' ? !isCoveredOn(k, selDate) : true);

  async function confirmPayment(kid, from, to, amount) {
    const fromDmy = from.split('-').reverse().join('.');
    const toDmy = to.split('-').reverse().join('.');
    try {
      const res = await window.addPaymentLogEntry(kid.id, tariff, fromDmy, toDmy, amount);
      Object.assign(kid, { paidFrom: res.paidFrom || '', paidUntil: res.paidUntil || '' });
      forceTick();
    } catch (e) {
      window.showToast(L('Не удалось сохранить оплату: ', 'Failed to save payment: ') + String(e));
      throw e;
    }
  }

  async function deletePayment(kid, rowId) {
    const res = await window.deletePaymentLogEntry(rowId);
    Object.assign(kid, { paidFrom: res.paidFrom || '', paidUntil: res.paidUntil || '' });
    forceTick();
  }

  const chips = [{ id: 'all', label: t('all'), emoji: '🗂️' }, ...DATA.GROUPS.map(g => ({ id: g.id, label: Lo(g), emoji: g.emoji }))];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>

      {/* tariff toggle */}
      <div style={{ display: 'flex', margin: '0 20px 14px', background: '#FBF7F2', borderRadius: 999, padding: 4, gap: 4 }}>
        {[['longterm', L('Долгосрочные', 'Long term')], ['tourist', L('Краткосрочные', 'Short term')]].map(([id, label]) => (
          <button key={id} onClick={() => { setTariff(id); setGroup('all'); setPayFilter('all'); }} className="bk-press" style={{
            flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
            padding: '9px 4px', borderRadius: 999, fontSize: 13, fontWeight: 800,
            background: tariff === id ? '#B07848' : 'transparent',
            color: tariff === id ? '#fff' : 'var(--ink-soft)', transition: 'all 0.2s' }}>
            {label}
          </button>
        ))}
      </div>
      <div style={{ display: 'flex', gap: 8, overflowX: 'auto', padding: '0 20px 14px', scrollbarWidth: 'none' }}>
        {chips.map(c => (
          <button key={c.id} onClick={() => setGroup(c.id)} className="bk-press" style={{
            flexShrink: 0, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
            padding: '7px 12px', borderRadius: 999, fontSize: 13, fontWeight: 700,
            background: group === c.id ? '#B07848' : '#FBF7F2',
            color: group === c.id ? '#fff' : 'var(--ink-soft)',
            boxShadow: group === c.id ? '0 6px 14px -6px #B07848' : '0 1px 2px rgba(60,40,20,0.05)' }}>
            {c.emoji} {c.label}
          </button>
        ))}
      </div>

      {calOpen && <Portal><MiniCalendar selected={selDate} onSelect={setSelDate} onClose={() => setCalOpen(false)}
        disableWeekends={false} disableFuture={false} /></Portal>}

      <PayStats cp={countPaid} cu={countUnpaid} total={total} filter={payFilter} onFilter={setPayFilter}
        dateSquare={<CalendarSquareButton date={selDate} onClick={() => setCalOpen(true)} />} />

      <div style={{ display: 'flex', flexDirection: 'column', gap: 9, padding: '0 20px' }}>
        {kids.map(kid => (
          <KidPayRow key={kid.id} kid={kid} isPaid={isCoveredOn(kid, selDate)}
            tariff={tariff}
            legacyCoverage={{
              // most kids' current paidUntil predates the payment log and
              // has no matching entry there — without a fallback, opening
              // their calendar would show nothing highlighted at all even
              // though they're marked paid. Most also have no paidFrom on
              // record either, so shade from today rather than guess a
              // start date we don't actually know.
              from: kid.paidFrom || todayStr(), until: kid.paidUntil,
            }}
            onConfirmPaid={(from, to, amount) => confirmPayment(kid, from, to, amount)}
            onDeletePaid={(rowId) => deletePayment(kid, rowId)} />
        ))}
      </div>
    </div>
  );
}

function PaymentsClubsScreen() {
  const [clubId,    setClubId]    = React.useState(() => DATA.CLUBS[0]?.id ?? null);
  const [payFilter, setPayFilter] = React.useState('all');
  const [log,       setLog]       = React.useState([]);
  const [selDate,   setSelDate]   = React.useState(todayStr);
  const [calOpen,   setCalOpen]   = React.useState(false);

  const activeClub = DATA.CLUBS.find(c => c.id === clubId);
  const allKids    = activeClub ? activeKids().filter(k => activeClub.kids.includes(k.id)) : [];
  const price      = activeClub?.price ?? null;

  React.useEffect(() => {
    if (!clubId) return;
    window.loadClubPaymentLog(clubId).then(setLog).catch(() => {});
  }, [clubId]);

  // a kid can be in more than one club, each with its own paid-through date,
  // so coverage is derived from the log here rather than cached on the kid
  const coverage = React.useMemo(() => {
    const map = {};
    allKids.forEach(k => { map[k.id] = bestCoverage(log.filter(e => e.child === k.id)); });
    return map;
  }, [log, allKids.length]);

  // same both-bounds check as Garden's isCoveredOn, and same "check any
  // date, not just today" square date-picker next to the stats
  function isCovered(kid, date) {
    const c = coverage[kid.id];
    if (!c || !c.until || normDate(c.until) < date) return false;
    if (c.from && normDate(c.from) > date) return false;
    return true;
  }

  const countPaid   = allKids.filter(k => isCovered(k, selDate)).length;
  const countUnpaid = allKids.length - countPaid;
  const total       = price != null ? countPaid * price : null;
  const kids        = allKids.filter(k => payFilter === 'paid' ? isCovered(k, selDate) : payFilter === 'unpaid' ? !isCovered(k, selDate) : true);

  function refetchLog() {
    return window.loadClubPaymentLog(clubId).then(setLog);
  }

  async function confirmPayment(kid, from, to, amount) {
    const fromDmy = from.split('-').reverse().join('.');
    const toDmy = to.split('-').reverse().join('.');
    try {
      await window.addClubPaymentLogEntry(kid.id, clubId, fromDmy, toDmy, amount);
      await refetchLog();
    } catch (e) {
      window.showToast(L('Не удалось сохранить оплату: ', 'Failed to save payment: ') + String(e));
      throw e;
    }
  }

  async function deletePayment(rowId) {
    await window.deleteClubPaymentLogEntry(rowId);
    await refetchLog();
  }

  if (!activeClub) return (
    <div style={{ padding: 20, color: 'var(--ink-faint)', fontSize: 14, textAlign: 'center' }}>

function ClubScreen({ params }) {
  const PALETTE = ['#FBE7A8','#CDE8FB','#D4F0DF','#FBD9E1','#FBE0C0','#E8D5FB'];
  const [club, setClub] = React.useState(() => DATA.CLUBS.find(c => c.id === params.clubId));
  const [tab, setTab] = React.useState('members');
  const [addOpen, setAddOpen] = React.useState(false);
  const [attDate, setAttDate] = React.useState(todayStr());
  const [attData, setAttData] = React.useState({});
  const [attSaving, setAttSaving] = React.useState(false);
  const [attCalOpen, setAttCalOpen] = React.useState(false);

  React.useEffect(() => {
    if (!club || tab !== 'attendance') return;
    window.loadClubAttendance(club.id, attDate).then(setAttData).catch(() => setAttData({}));
  }, [tab, attDate, club?.id]);

  if (!club) return <div style={{ padding: 20, color: 'var(--ink-faint)', fontSize: 14, textAlign: 'center' }}>—</div>;

  const kids = activeKids().filter(k => club.kids.includes(k.id));
  const notInClub = activeKids().filter(k => !club.kids.includes(k.id));

  function handleAdd(childId) {
    const kids = [...club.kids, childId];
    const dataClub = DATA.CLUBS.find(c => c.id === club.id);
    if (dataClub) dataClub.kids = kids;
    setClub({ ...club, kids });
    setAddOpen(false);
    window.addClubMember(club.id, childId).catch(e => {
      const reverted = kids.filter(id => id !== childId);
      if (dataClub) dataClub.kids = reverted;
      setClub(c => ({ ...c, kids: reverted }));
      alert(L('Не удалось добавить: ', 'Failed to add: ') + e.message);
    });
  }

  function handleRemove(childId) {
    const kids = club.kids.filter(id => id !== childId);
    const dataClub = DATA.CLUBS.find(c => c.id === club.id);
    if (dataClub) dataClub.kids = kids;
    setClub({ ...club, kids });
    window.removeClubMember(club.id, childId).catch(e => {
      const reverted = [...kids, childId];
      if (dataClub) dataClub.kids = reverted;
      setClub(c => ({ ...c, kids: reverted }));
      alert(L('Не удалось убрать: ', 'Failed to remove: ') + e.message);
    });
  }

  async function toggleAtt(childId) {
    const cur = attData[childId] || 'absent';
    const next = cur === 'present' ? 'absent' : 'present';
    setAttData(prev => ({ ...prev, [childId]: next }));
    setAttSaving(true);
    // Only this one child, not the whole roster — otherwise every tap
    // re-sends everyone else's last-known status too, which stomps another
    // staff member's own tap on a different kid with a stale copy (and
    // wrongly attributes it to whoever tapped last, see Marked by).
    await window.saveClubAttendance(club.id, attDate, { [childId]: next }).catch(() => {});
    setAttSaving(false);
  }

  const tabBtn = (id, label) => (
    <button key={id} onClick={() => setTab(id)} style={{
      flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
      padding: '9px 4px', borderRadius: 999, fontSize: 13, fontWeight: 800,
      background: tab === id ? club.ink : '#FBF7F2',
      color: tab === id ? '#fff' : 'var(--ink-soft)',
      boxShadow: tab === id ? `0 4px 12px -4px ${club.ink}88` : 'none',
    }}>{label}</button>
  );

  return (
    <div style={{ padding: '4px 20px 28px' }}>
      {/* Header */}
      <div style={{ background: club.color, borderRadius: 20, padding: '18px 20px', marginBottom: 14, display: 'flex', alignItems: 'center', gap: 16 }}>
        <div style={{ fontSize: 48, lineHeight: 1 }}>{club.emoji}</div>
        <div>
          <div style={{ fontSize: 22, fontWeight: 800, color: club.ink, fontFamily: 'var(--font-display)' }}>{Lo(club)}</div>
          <div style={{ fontSize: 13, color: club.ink, fontWeight: 600, opacity: 0.75, marginTop: 2 }}>
            {Lo(club.days)} · {club.time} · {kids.length} {L('детей', 'kids')}
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
        {tabBtn('members', L('Участники', 'Members'))}
        {tabBtn('attendance', L('Посещаемость', 'Attendance'))}
      </div>

      {tab === 'members' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {kids.map(kid => {
            const grp = DATA.GROUPS.find(g => g.id === kid.group);
            const kidIndex = activeKids().filter(k => k.group === kid.group).findIndex(k => k.id === kid.id);
            return (
              <Card key={kid.id} pad={12} style={{ display: 'flex', alignItems: 'center', gap: 13, background: '#FBF7F2' }}>
                <Avatar emoji={kid.emoji} color={PALETTE[kidIndex % PALETTE.length]} size={44} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 15.5, fontWeight: 700, color: 'var(--ink)' }}>{Lo(kid)}</div>
                  {grp && <span style={{ background: grp.color, color: grp.ink, fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 999 }}>{grp.emoji} {Lo(grp)}</span>}
                </div>
                <button onClick={() => handleRemove(kid.id)} className="bk-press" style={{
                  border: 'none', background: '#FBE8E8', color: '#C04040', borderRadius: 10,
                  padding: '6px 10px', fontSize: 15, cursor: 'pointer',
                }}>✕</button>
              </Card>
            );
          })}
          <button onClick={() => setAddOpen(true)} className="bk-press" style={{
            border: '2px dashed rgba(107,92,74,0.25)', background: 'transparent',
            borderRadius: 16, padding: 14, fontSize: 14, fontWeight: 700,
            color: 'var(--ink-soft)', cursor: 'pointer', fontFamily: 'inherit',
          }}>+ {L('Добавить ребёнка', 'Add child')}</button>
        </div>
      )}

      {tab === 'attendance' && (
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
            <CalendarSquareButton date={attDate} onClick={() => setAttCalOpen(true)} />
            {attSaving && <span style={{ fontSize: 12, color: 'var(--ink-faint)' }}>...</span>}
          </div>
          {attCalOpen && <Portal><MiniCalendar selected={attDate} onSelect={setAttDate} onClose={() => setAttCalOpen(false)} /></Portal>}
          {kids.length === 0 && (
            <div style={{ textAlign: 'center', color: 'var(--ink-faint)', padding: 24, fontSize: 14 }}>
              {L('Нет участников', 'No members')}
            </div>
          )}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
            {kids.map(kid => {
              const grp = DATA.GROUPS.find(g => g.id === kid.group);
              const kidIndex = activeKids().filter(k => k.group === kid.group).findIndex(k => k.id === kid.id);
              const status = attData[kid.id] || 'absent';
              return (
                <Card key={kid.id} pad={12} style={{ display: 'flex', alignItems: 'center', gap: 13, background: '#FBF7F2' }}>
                  <Avatar emoji={kid.emoji} color={PALETTE[kidIndex % PALETTE.length]} size={44} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 15.5, fontWeight: 700, color: 'var(--ink)' }}>{Lo(kid)}</div>
                    {grp && <span style={{ background: grp.color, color: grp.ink, fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 999 }}>{grp.emoji} {Lo(grp)}</span>}
                  </div>
                  <StatusChip status={status} onClick={() => toggleAtt(kid.id)} />
                </Card>
              );
            })}
          </div>
        </div>
      )}

      {/* Add member sheet */}
      {addOpen && (
        <Portal>
        <div onClick={() => setAddOpen(false)} style={{
          position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.35)', zIndex: 200,
          display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            background: 'var(--bg)', borderRadius: '22px 22px 0 0', padding: '20px 20px 36px',
            maxHeight: '70vh', display: 'flex', flexDirection: 'column',
          }}>
            <div style={{ fontSize: 17, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)', marginBottom: 14 }}>
              {L('Добавить в кружок', 'Add to club')}
            </div>
            <div style={{ overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 9 }}>
              {notInClub.length === 0 && (
                <div style={{ textAlign: 'center', color: 'var(--ink-faint)', padding: 24, fontSize: 14 }}>
                  {L('Все дети уже записаны', 'All children already enrolled')}
                </div>
              )}
              {notInClub.map(kid => {
                const grp = DATA.GROUPS.find(g => g.id === kid.group);
                const kidIndex = activeKids().filter(k => k.group === kid.group).findIndex(k => k.id === kid.id);
                return (
                  <Card key={kid.id} pad={12} onClick={() => handleAdd(kid.id)} style={{
                    display: 'flex', alignItems: 'center', gap: 13, background: '#FBF7F2', cursor: 'pointer',
                  }}>
                    <Avatar emoji={kid.emoji} color={PALETTE[kidIndex % PALETTE.length]} size={44} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 15.5, fontWeight: 700, color: 'var(--ink)' }}>{Lo(kid)}</div>
                      {grp && <span style={{ background: grp.color, color: grp.ink, fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 999 }}>{grp.emoji} {Lo(grp)}</span>}
                    </div>
                    <span style={{ fontSize: 20, color: club.ink }}>+</span>
                  </Card>
                );
              })}
            </div>
          </div>
        </div>
        </Portal>
      )}
    </div>
  );
}

Object.assign(window, { AttendanceScreen, SummaryScreen, NotificationsScreen, ComposeScreen, PaymentsScreen, PaymentsGardenScreen, PaymentsClubsScreen, ActivitiesScreen, ClubScreen });

</script>
<script type="text/babel">
// app.jsx — shell, navigation stack, language, tweaks. Mounts Балу Кидс.
// Globals: defines L / Lo / window.__lang. Uses screens + ui + i18n + data.

// ── language helpers (read live window.__lang) ─────────────────
window.__lang = window.__lang || 'ru';
function L(ru, en) { return window.__lang === 'ru' ? ru : en; }
function Lo(o) { return window.__lang === 'ru' ? o.ru : o.en; }
Object.assign(window, { L, Lo });

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#F2795B",
  "homeLayout": "Circles",
  "typeface": "Rounded"
}/*EDITMODE-END*/;

const FONTS = {
  Rounded: { display: "'Comfortaa', system-ui", body: "'Nunito', system-ui" },
  Clean:   { display: "'Onest', system-ui",     body: "'Onest', system-ui" },
};

// ── Staff helpers ─────────────────────────────────────────────────────────────

// Only mutually-exclusive day statuses live here now — 'late' stays a
// status (it already implies present, just with its own icon so it's
// never confused with the overtime sticker below). Overtime and transfer
// used to include 'extra' as a status too, which meant a day could only
// ever show ONE of {late, extra} even though both can genuinely happen at
// once (present, ran late that morning, AND worked overtime that
// evening) — they're both "extras" now (see EXTRA_STICKERS), stuck on
// top of whatever the day's status is, same as the gold paid-day badge in
// the payments calendar. 'unpaid' had no clear use and is gone for now.
const STAFF_STATUSES = [
  { id: 'present',  emoji: '✅', ru: 'Работает',    en: 'Working'      },
  { id: 'half-day', emoji: '🌗', ru: 'Полдня',      en: 'Half day'     },
  { id: 'absent',   emoji: '❌', ru: 'Нет на месте', en: 'Absent'      },
  { id: 'late',     emoji: '🕐', ru: 'Опоздал(а)',  en: 'Late'         },
  { id: 'sick',     emoji: '🤒', ru: 'Болеет',      en: 'Sick'         },
  { id: 'day-off',  emoji: '🏖️', ru: 'Выходной',   en: 'Day off'      },
];

// How much of a full day's pay each status is worth — everything not
// listed (absent/sick/day-off) is 0. Used by StaffMonthlyScreen's salary
// and "worked" total instead of a flat count, so a half day genuinely
// counts as half instead of showing up as a full paid day.
const STAFF_STATUS_WORKED_VALUE = { present: 1, 'half-day': 0.5, late: 1 };

const SSTAFF_COLOR = {
  present: '#D4F0DF', 'half-day': '#FBE0C0', absent: '#FFE0E0', late: '#FBE7A8',
  sick: '#FBD9E1', 'day-off': '#E8D5FB',
};
const SSTAFF_INK = {
  present: '#1f7a55', 'half-day': '#7A3D00', absent: '#a03030', late: '#8a6410',
  sick: '#a8456a', 'day-off': '#5a2a86',
};

// The two "extras" — independent of status, can both be true the same day,
// shown as small stickers on the day cell rather than as a status pill.
const EXTRA_COLOR = '#CDE8FB', EXTRA_INK = '#1f5f86';

function staffStatusLabel(id) {
  const s = STAFF_STATUSES.find(x => x.id === id);
  if (!s) return id;
  return `${s.emoji} ${window.__lang === 'en' ? s.en : s.ru}`;
}

function contractDaysLeft(contractEnd) {
  if (!contractEnd) return null;
  const parts = contractEnd.match(/(\d{2})\.(\d{2})\.(\d{4})/);
  let d;
  if (parts) {
    d = new Date(`${parts[3]}-${parts[2]}-${parts[1]}`);
  } else {
    d = new Date(contractEnd);
  }
  if (isNaN(d)) return null;
  return Math.round((d - new Date()) / 86400000);
}

function positionEmoji(pos) {
  const p = (pos || '').toLowerCase();
  if (p.includes('логопед')) return '🗣️';
  if (p.includes('психолог')) return '🧠';
  if (p.includes('повар') || p.includes('cook')) return '👨‍🍳';
  if (p.includes('охран') || p.includes('security')) return '💂';
  if (p.includes('медик') || p.includes('nurse') || p.includes('врач')) return '🩺';
  if (p.includes('музык') || p.includes('music')) return '🎵';
  if (p.includes('физ') || p.includes('sport') || p.includes('gym')) return '🏃';
  return '👩‍🏫';
}

// ── StaffFormSheet ────────────────────────────────────────────────────────────

function StaffFormSheet({ member, onClose, onSaved }) {
  const isEdit = !!member;
  const [form, setForm] = React.useState(() => ({
    name:        member?.name        || '',
    position:    member?.position    || '',
    contractEnd: member?.contractEnd || '',
    phone:       member?.phone       || '',
    rate:        member?.rate        || '',
    password:    '',  // never prefill — blank = keep current on edit
  }));
  const [saving,        setSaving]        = React.useState(false);
  const [deleting,      setDeleting]      = React.useState(false);
  const [deleteConfirm, setDeleteConfirm] = React.useState(false);
  const [error,         setError]         = React.useState(null);

  function set(field) { return e => setForm(f => ({ ...f, [field]: e.target.value })); }

  async function handleSave() {
    if (!form.name.trim()) { setError(L('Введите имя', 'Enter name')); return; }
    setSaving(true); setError(null);
    try {
      const payload = { ...form, name: form.name.trim() };
      if (isEdit && !form.password.trim()) delete payload.password;
      if (isEdit) {
        await window.updateStaff(member.name, payload);
      } else {
        await window.addStaff(payload);
      }
      onSaved();
    } catch(e) { setError(e.message); setSaving(false); }
  }

  async function handleDelete() {
    setDeleting(true);
    try {
      await window.deleteStaff(member.name);
      onSaved();
    } catch(e) { alert(e.message); setDeleting(false); setDeleteConfirm(false); }
  }

  const INP = { width: '100%', boxSizing: 'border-box', border: '1.5px solid #DDD8CF', borderRadius: 12,
    padding: '11px 14px', fontFamily: 'inherit', fontSize: 14, background: '#FBF7F2',
    color: 'var(--ink)', outline: 'none' };
  const LBL = { fontSize: 11, fontWeight: 700, letterSpacing: '0.05em', textTransform: 'uppercase',
    color: 'var(--ink-soft)', marginBottom: 5, display: 'block' };

  return (
    <Portal>
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'flex', alignItems: 'flex-end',
      background: 'rgba(0,0,0,0.4)' }} onClick={onClose}>
      <div style={{ width: '100%', background: 'var(--bg)', borderRadius: '24px 24px 0 0',
        maxHeight: '92vh', display: 'flex', flexDirection: 'column' }}
        onClick={e => e.stopPropagation()}>

        {/* Handle + title */}
        <div style={{ flexShrink: 0, padding: '12px 20px 12px', borderBottom: '1px solid rgba(60,40,20,0.07)' }}>
          <div style={{ width: 40, height: 4, background: 'rgba(60,40,20,0.15)', borderRadius: 2, margin: '0 auto 12px' }} />
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)' }}>
              {isEdit ? L('Редактировать', 'Edit staff') : L('Новый сотрудник', 'Add staff')}
            </div>
            <button onClick={onClose} style={{ border: 'none', background: 'none', fontSize: 24,
              cursor: 'pointer', color: 'var(--ink-faint)', padding: 4 }}>×</button>
          </div>
        </div>

        {/* Fields */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '16px 20px 8px' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div>
              <label style={LBL}>{L('Имя', 'Name')}</label>
              <input style={INP} value={form.name} onChange={set('name')} placeholder="Анна Иванова" />
            </div>
            <div>
              <label style={LBL}>{L('Должность', 'Position')}</label>
              <input style={INP} value={form.position} onChange={set('position')} placeholder={L('Воспитатель', 'Teacher')} />
            </div>
            <div>
              <label style={LBL}>{L('Договор до', 'Contract until')}</label>
              <input style={INP} value={form.contractEnd} onChange={set('contractEnd')} placeholder="31.12.2026" />
            </div>
            <div>
              <label style={LBL}>{L('Телефон', 'Phone')}</label>
              <input style={INP} type="tel" value={form.phone} onChange={set('phone')} placeholder="+7 999 000 00 00" />
            </div>
            <div>
              <label style={LBL}>{L('Ставка в день', 'Daily rate')}</label>
              <input style={INP} type="number" inputMode="numeric" value={form.rate} onChange={set('rate')}
                placeholder="0" />
            </div>
            <div>
              <label style={LBL}>{L('Пароль для входа', 'Login password')}</label>
              <input style={INP} type="password" value={form.password} onChange={set('password')}
                placeholder={isEdit ? L('Оставьте пустым — не изменится', 'Leave blank to keep current') : ''} />
            </div>
          </div>

          {error && <div style={{ marginTop: 12, fontSize: 13, color: 'var(--no)', fontWeight: 600 }}>{error}</div>}

          {/* Save */}
          <button onClick={handleSave} disabled={saving} className="bk-press" style={{
            width: '100%', border: 'none', cursor: 'pointer', fontFamily: 'var(--font-display)',
            background: '#B07848', color: '#fff', fontSize: 15, fontWeight: 800,
            padding: 14, borderRadius: 16, marginTop: 20, opacity: saving ? 0.7 : 1 }}>
            {saving ? '…' : L('Сохранить', 'Save')}
          </button>

          {/* Delete */}
          {isEdit && !deleteConfirm && (
            <button onClick={() => setDeleteConfirm(true)} className="bk-press" style={{
              width: '100%', border: 'none', cursor: 'pointer', fontFamily: 'inherit',
              background: 'none', color: '#E05555', fontSize: 14, fontWeight: 700,
              padding: '14px 0 4px' }}>
              🗑️ {L('Удалить сотрудника', 'Delete staff member')}
            </button>
          )}
          {isEdit && deleteConfirm && (
            <div style={{ marginTop: 12, background: '#FFF0F0', borderRadius: 14, padding: 16 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: '#a03030', marginBottom: 12 }}>
                {L(`Удалить ${member.name}?`, `Delete ${member.name}?`)}
              </div>
              <div style={{ display: 'flex', gap: 10 }}>
                <button onClick={() => setDeleteConfirm(false)} className="bk-press" style={{
                  flex: 1, border: 'none', cursor: 'pointer', background: '#EDE8E0',
                  borderRadius: 12, padding: 11, fontFamily: 'inherit', fontSize: 14, fontWeight: 800 }}>
                  {L('Отмена', 'Cancel')}
                </button>
                <button onClick={handleDelete} disabled={deleting} className="bk-press" style={{
                  flex: 1, border: 'none', cursor: 'pointer', background: '#E05555',
                  borderRadius: 12, padding: 11, fontFamily: 'inherit', fontSize: 14, fontWeight: 800, color: '#fff' }}>
                  {deleting ? '…' : L('Удалить', 'Delete')}
                </button>
              </div>
            </div>
          )}
          <div style={{ height: 24 }} />
        </div>
      </div>
    </div>
    </Portal>
  );
}

// ── StaffScheduleScreen ───────────────────────────────────────────────────────

const MONTHS_RU = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function StaffScheduleScreen() {
  const today = new Date();
  const [year,    setYear]    = React.useState(today.getFullYear());
  const [month,   setMonth]   = React.useState(today.getMonth() + 1);
  const [staff,   setStaff]   = React.useState([]);
  const [data,    setData]    = React.useState({});
  const [loading, setLoading] = React.useState(true);
  const [picker,  setPicker]  = React.useState(null);

  const monthKey = `${year}-${String(month).padStart(2,'0')}`;

  React.useEffect(() => {
    setLoading(true);
    setData({});
    Promise.all([window.loadStaff(), window.getStaffMonthly(monthKey)])
      .then(([s, d]) => { setStaff(s); setData(d); })
      .catch(() => {})
      .finally(() => setLoading(false));
  }, [year, month]);

  const daysInMonth = new Date(year, month, 0).getDate();

  function prevMonth() {
    if (month === 1) { setYear(y => y - 1); setMonth(12); }
    else setMonth(m => m - 1);
  }
  function nextMonth() {
    if (month === 12) { setYear(y => y + 1); setMonth(1); }
    else setMonth(m => m + 1);
  }

  function getCell(name, day) {
    const date = `${monthKey}-${String(day).padStart(2,'0')}`;
    return data[name]?.[date] || null;
  }

  function openPicker(name, day) {
    const date = `${monthKey}-${String(day).padStart(2,'0')}`;
    const rec = data[name]?.[date];
    setPicker({ name, date, day, status: rec?.status || null, arrival_time: rec?.arrival_time || '' });
  }

  async function handlePick(status, arrival_time) {
    const { name, date } = picker;
    if (!status) {
      await window.clearStaffDay(date, name).catch(() => {});
      setData(prev => {
        const n = { ...prev, [name]: { ...(prev[name] || {}) } };
        delete n[name][date];
        return n;
      });
    } else {
      await window.setStaffDay(date, name, { status, arrival_time: arrival_time || '' }).catch(() => {});
      setData(prev => ({
        ...prev,
        [name]: { ...(prev[name] || {}), [date]: { status, arrival_time: arrival_time || '' } }
      }));
    }
    setPicker(null);
  }

  const NAME_W = 72;
  const CELL_W = 46;
  const CELL_H = 40;
  // Weekends aren't workdays for this staff, so they never get a status —
  // dropping those columns entirely (not just graying them out) frees up
  // real width to make the days that matter bigger and actually readable.
  const weekdays = Array.from({length: daysInMonth}, (_, i) => i + 1)
    .filter(d => { const dow = new Date(year, month-1, d).getDay(); return dow !== 0 && dow !== 6; });

  return (
    <div style={{ paddingBottom: 32 }}>
      {/* Month nav */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 14, padding: '2px 20px 16px' }}>
        <button onClick={prevMonth} className="bk-press" style={{
          border: 'none', background: 'none', cursor: 'pointer', padding: '0 10px',
          display: 'grid', placeItems: 'center' }}><Chevron dir="left" size={20} /></button>
        <span style={{ fontSize: 15, fontWeight: 800, color: 'var(--ink)', minWidth: 140, textAlign: 'center',
          fontFamily: 'var(--font-display)' }}>
          {window.__lang === 'ru' ? MONTHS_RU[month-1] : MONTHS_EN[month-1]} {year}
        </span>
        <button onClick={nextMonth} className="bk-press" style={{
          border: 'none', background: 'none', cursor: 'pointer', padding: '0 10px',
          display: 'grid', placeItems: 'center' }}><Chevron dir="right" size={20} /></button>
      </div>

      {loading && (
        <div style={{ textAlign: 'center', padding: '32px 20px', color: 'var(--ink-faint)', fontSize: 13 }}>…</div>
      )}
      {!loading && staff.length === 0 && (
        <div style={{ textAlign: 'center', padding: '32px 20px', color: 'var(--ink-soft)', fontSize: 14, fontWeight: 700 }}>
          {L('Сначала добавьте сотрудников в разделе «Команда»', 'Add staff members in the Team section first')}
        </div>
      )}

      {!loading && staff.length > 0 && (
        <div style={{ overflowX: 'auto', WebkitOverflowScrolling: 'touch', paddingBottom: 4 }}>
          <div style={{ display: 'inline-block', paddingLeft: 12, paddingRight: 16,
            minWidth: NAME_W + weekdays.length * (CELL_W + 3) + 24 }}>

            {/* Day-number header */}
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 5 }}>
              <div style={{ width: NAME_W, flexShrink: 0 }} />
              {weekdays.map(d => (
                <div key={d} style={{ width: CELL_W, flexShrink: 0, marginRight: 3,
                  textAlign: 'center', fontSize: 11, fontWeight: 700, color: 'var(--ink-faint)' }}>
                  {d}
                </div>
              ))}
            </div>

            {/* Staff rows */}
            {staff.map(s => {
              const parts = s.name.split(' ');
              const firstName = parts[0];
              const rest = parts.slice(1).join(' ');
              return (
                <div key={s.name} style={{ display: 'flex', alignItems: 'center', marginBottom: 5 }}>
                  <div style={{ width: NAME_W, flexShrink: 0, paddingRight: 5, overflow: 'hidden' }}>
                    <span style={{ fontSize: 11.5, fontWeight: 800, color: 'var(--ink)',
                      display: 'block', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                      {firstName}
                    </span>
                    {rest && <span style={{ fontSize: 9.5, fontWeight: 600, color: 'var(--ink-soft)',
                      display: 'block', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{rest}</span>}
                  </div>
                  {weekdays.map(d => {
                    const rec = getCell(s.name, d);
                    const st  = rec?.status || null;
                    const ss  = st ? STAFF_STATUSES.find(x => x.id === st) : null;
                    const bg  = st ? SSTAFF_COLOR[st] : '#F5F3EE';
                    const stickers = [];
                    if (rec?.transfer) stickers.push('🚌');
                    if (rec?.extra) stickers.push('⏰');
                    return (
                      <button key={d} onClick={() => openPicker(s.name, d)} className="bk-press"
                        style={{ position: 'relative', width: CELL_W, height: CELL_H, flexShrink: 0, marginRight: 3,
                          border: 'none', cursor: 'pointer', borderRadius: 9,
                          background: bg, fontSize: 17, fontFamily: 'inherit',
                          display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        {ss?.emoji || ''}
                        {stickers.map((emoji, si) => (
                          <span key={emoji} style={{ position: 'absolute',
                            [si === 0 ? 'top' : 'bottom']: -4, right: -4, fontSize: 11 }}>{emoji}</span>
                        ))}
                      </button>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Legend */}
      <div style={{ padding: '14px 14px 0', display: 'flex', flexWrap: 'wrap', gap: 6 }}>
        {STAFF_STATUSES.map(ss => (
          <span key={ss.id} style={{ fontSize: 11, fontWeight: 600,
            background: SSTAFF_COLOR[ss.id], color: SSTAFF_INK[ss.id],
            padding: '3px 8px', borderRadius: 999 }}>
            {ss.emoji} {window.__lang === 'ru' ? ss.ru : ss.en}
          </span>
        ))}
      </div>

      {picker && (
        <ScheduleCellPicker picker={picker} onClose={() => setPicker(null)} onPick={handlePick} />
      )}
    </div>
  );
}

function ScheduleCellPicker({ picker, onClose, onPick }) {
  const [status,  setStatus]  = React.useState(picker.status);
  const [time,    setTime]    = React.useState(picker.arrival_time || '');
  const [saving,  setSaving]  = React.useState(false);

  const [, , dayStr] = picker.date.split('-');
  const dowNames = window.__lang === 'ru'
    ? ['вс','пн','вт','ср','чт','пт','сб']
    : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dow = new Date(picker.date).getDay();

  async function confirm() {
    setSaving(true);
    await onPick(status, status === 'late' ? time : '');
  }
  async function clear() {
    setSaving(true);
    await onPick(null, '');
  }

  return (
    <Portal>
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'flex', alignItems: 'flex-end' }}>
      <div onClick={onClose} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.32)' }} />
      <div style={{ position: 'relative', width: '100%', background: '#fff',
        borderRadius: '20px 20px 0 0', padding: '18px 20px calc(24px + env(safe-area-inset-bottom))',
        boxShadow: '0 -4px 24px rgba(0,0,0,0.13)' }}>

        <div style={{ textAlign: 'center', marginBottom: 16 }}>
          <div style={{ fontSize: 14, fontWeight: 800, color: 'var(--ink)' }}>{picker.name.split(' ')[0]}</div>
          <div style={{ fontSize: 12.5, color: 'var(--ink-soft)', marginTop: 2 }}>
            {parseInt(dayStr, 10)} {dowNames[dow]}
          </div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, marginBottom: 14 }}>
          {STAFF_STATUSES.map(ss => {
            const sel = status === ss.id;
            return (
              <button key={ss.id} onClick={() => setStatus(ss.id)} className="bk-press"
                style={{ border: 'none', cursor: 'pointer', fontFamily: 'inherit',
                  background: sel ? SSTAFF_COLOR[ss.id] : '#F5F3EE',
                  borderRadius: 12, padding: '8px 4px',
                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
                <span style={{ fontSize: 20 }}>{ss.emoji}</span>
                <span style={{ fontSize: 9.5, fontWeight: 700, lineHeight: 1.2, textAlign: 'center',
                  color: sel ? SSTAFF_INK[ss.id] : 'var(--ink-soft)' }}>
                  {window.__lang === 'ru' ? ss.ru : ss.en}
                </span>
              </button>
            );
          })}
        </div>

        {status === 'late' && (
          <div style={{ marginBottom: 14 }}>
            <label style={{ fontSize: 12, fontWeight: 700, color: 'var(--ink-soft)', display: 'block', marginBottom: 5 }}>
              {L('Время прихода', 'Arrival time')}
            </label>
            <input type="time" value={time} onChange={e => setTime(e.target.value)}
              style={{ width: '100%', border: '2px solid #EDE8E0', borderRadius: 12,
                padding: '8px 12px', fontSize: 15, fontFamily: 'inherit', outline: 'none',
                boxSizing: 'border-box' }} />
          </div>
        )}

        <div style={{ display: 'flex', gap: 10 }}>
          {picker.status && (
            <button onClick={clear} disabled={saving} className="bk-press"
              style={{ border: 'none', cursor: 'pointer', fontFamily: 'inherit',
                background: '#FFE0E0', color: '#a03030', fontSize: 13, fontWeight: 700,
                padding: '11px 16px', borderRadius: 14 }}>
              {L('Убрать', 'Clear')}
            </button>
          )}
          <button onClick={confirm} disabled={saving || !status} className="bk-press"
            style={{ flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
              background: status ? (SSTAFF_COLOR[status] || '#D4F0DF') : '#EDE8E0',
              color: status ? (SSTAFF_INK[status] || '#1f7a55') : 'var(--ink-faint)',
              fontSize: 14, fontWeight: 800, padding: '11px 0', borderRadius: 14 }}>
            {saving ? '…' : L('Сохранить', 'Save')}
          </button>
        </div>
      </div>
    </div>
    </Portal>
  );
}

// ── StaffDailyScreen ──────────────────────────────────────────────────────────

function StaffDailyScreen({ params, go }) {
  const initDate = (params && params.date) || todayStr();
  const [date, setDate] = React.useState(initDate);
  const [calOpen, setCalOpen] = React.useState(false);
  const [staff, setStaff] = React.useState([]);
  const [records, setRecords] = React.useState({});
  const [savedRecords, setSavedRecords] = React.useState({});

  React.useEffect(() => {
    Promise.all([window.loadStaff(), window.getStaffAttendance(date)])
      .then(([s, rec]) => {
        // Teacher only sees themselves
        const filtered = window.__isTeacher && window.__teacherName
          ? s.filter(x => x.name === window.__teacherName)
          : s;
        setStaff(filtered);
        setRecords(rec);
        setSavedRecords(rec);
      })
      .catch(() => {});
  }, [date]);

  const hasChanges = JSON.stringify(records) !== JSON.stringify(savedRecords);

  function setStatus(name, status) {
    setRecords(r => ({ ...r, [name]: { ...(r[name] || {}), status } }));
  }
  function setTime(name, time) {
    setRecords(r => ({ ...r, [name]: { ...(r[name] || {}), arrival_time: time } }));
  }
  function setNote(name, note) {
    setRecords(r => ({ ...r, [name]: { ...(r[name] || {}), note } }));
  }
  // 0 (none) -> 1 (full day) -> 0.5 (half day) -> 0 — matches Ольга's own
  // "+" / "#" paper tracking for bus transfer duty
  function cycleTransfer(name) {
    const cur = (records[name] || {}).transfer || 0;
    const next = cur === 0 ? 1 : cur === 1 ? 0.5 : 0;
    setRecords(r => ({ ...r, [name]: { ...(r[name] || {}), transfer: next } }));
  }
  function toggleExtra(name) {
    const cur = !!(records[name] || {}).extra;
    setRecords(r => ({ ...r, [name]: { ...(r[name] || {}), extra: !cur } }));
  }

  async function save() {
    await window.saveStaffAttendance(date, records).catch(() => {});
    setSavedRecords(records);
  }

  return (
    <div style={{ padding: '4px 20px 28px' }}>
      {/* Quick links to the rest of the staff module — this screen is now
          the entry point (see HomeScreen's team tile), cards/schedule/
          monthly are a tap away instead of the other way around. */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
        <button onClick={() => go('team')} className="bk-press" style={{
          flex: 1, minWidth: 100, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
          background: '#E8E0D5', color: '#5a4a30', fontSize: 12.5, fontWeight: 800,
          padding: '11px 10px', borderRadius: 14 }}>
          🗂️ {L('Сотрудники', 'Staff')}
        </button>
        <button onClick={() => go('staff-schedule')} className="bk-press" style={{
          flex: 1, minWidth: 100, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
          background: '#D4F0DF', color: '#1f7a55', fontSize: 12.5, fontWeight: 800,
          padding: '11px 10px', borderRadius: 14 }}>
          📅 {L('Расписание', 'Schedule')}
        </button>
        <button onClick={() => go('staff-monthly')} className="bk-press" style={{
          flex: 1, minWidth: 100, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
          background: '#CDE8FB', color: '#1f5f86', fontSize: 12.5, fontWeight: 800,
          padding: '11px 10px', borderRadius: 14 }}>
          📊 {L('Итог за месяц', 'Monthly')}
        </button>
      </div>

      {/* Date navigation */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 18 }}>
        <CalendarSquareButton date={date} onClick={() => setCalOpen(true)} />
      </div>
      {calOpen && <Portal><MiniCalendar selected={date} onSelect={setDate} onClose={() => setCalOpen(false)}
        disableWeekends={false} disableFuture={false} /></Portal>}

      {staff.length === 0 && (
        <div style={{ textAlign: 'center', padding: 40, color: 'var(--ink-faint)', fontSize: 13 }}>
          {L('Нет сотрудников', 'No staff')}
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      {staff.map(s => {
        const rec      = records[s.name] || {};
        const status   = rec.status || 'present';
        const isLate   = status === 'late';

        return (
          <Card key={s.name} pad={14}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10 }}>
              <Avatar emoji={positionEmoji(s.position)} color="#EDE8E0" size={40} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 800, fontSize: 14, color: 'var(--ink)' }}>{s.name}</div>
                <div style={{ fontSize: 12, color: 'var(--ink-soft)' }}>{s.position}</div>
              </div>
              <div style={{ background: SSTAFF_COLOR[status] || '#EDE8E0',
                color: SSTAFF_INK[status] || '#5a4a30',
                padding: '4px 11px', borderRadius: 999, fontSize: 12, fontWeight: 800 }}>
                {STAFF_STATUSES.find(x => x.id === status)?.emoji}
              </div>
            </div>
            {/* Status pills */}
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7 }}>
              {STAFF_STATUSES.map(opt => (

                  border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 12, fontWeight: 700,
                  padding: '6px 12px', borderRadius: 999,
                  background: status === opt.id ? (SSTAFF_COLOR[opt.id] || '#B07848') : '#F0EBE3',
                  color: status === opt.id ? (SSTAFF_INK[opt.id] || '#fff') : 'var(--ink-soft)',
                  transition: 'all 0.12s' }}>
                  {opt.emoji} {window.__lang === 'en' ? opt.en : opt.ru}
                </button>
              ))}

  // — a long scrolling list of cards left no room to make any single
  // person's calendar bigger, this way each one gets the full screen.

  React.useEffect(() => {
    setLoading(true);
    Promise.all([window.loadStaff(), window.getStaffMonthly(month)])
      .then(([s, d]) => { setStaff(s); setData(d); })
      .catch(() => {})

    setPersonIdx(i => Math.min(i, Math.max(0, staff.length - 1)));
  }, [staff]);

  const EN_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const [yr, mo] = month.split('-').map(Number);
  const monthLabel = window.__lang === 'en' ? `${EN_MONTHS[mo-1]} ${yr}` : `${RU_MONTHS[mo-1]} ${yr}`;
  const daysInMonth = new Date(yr, mo, 0).getDate();

    const d = new Date(yr, mo - 2, 1);
    setMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);

    setMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }

  function countStatus(name, statusId) {
    const days = data[name] || {};
    return Object.values(days).filter(d => d.status === statusId).length;

  // Sums each day's worked fraction (half day counts as 0.5) instead of
  // just counting days, so salary reflects a genuine half day worked
  // instead of paying it as a full one.

    const days = data[name] || {};
    return Object.values(days).reduce((sum, d) => sum + (STAFF_STATUS_WORKED_VALUE[d.status] || 0), 0);
  }

      {loading && <div style={{ textAlign: 'center', padding: 40, color: 'var(--ink-faint)', fontSize: 13 }}>…</div>}

      {!loading && staff.length === 0 && (

          {L('Нет сотрудников', 'No staff')}
        </div>
      )}

      {!loading && s && (() => {
        const worked   = workedDays(s.name);
        const halfDays = countStatus(s.name, 'half-day');
        const sick     = countStatus(s.name, 'sick');
        const dayOff   = countStatus(s.name, 'day-off');
        const absent   = countStatus(s.name, 'absent');
        const allDays  = data[s.name] || {};

const TITLES = {
  home: 'appName', children: 'children', attendance: 'markDay',
  payments: 'payments', 'payments-garden': 'payments', 'payments-clubs': 'payments',
  activities: 'activities', club: 'activities', summary: 'daySummary', notifications: 'notifications', compose: 'compose',
  team: 'team', 'staff-daily': 'staffLog', 'staff-monthly': 'monthSummary', 'staff-schedule': 'staffSchedule',
};

// Attendance is marked fresh each day; persisted in localStorage so a reload
// during the same day doesn't lose today's marks (no backend for this yet).
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function isWeekend(date) {
  const d = date || new Date();
  const day = d.getDay(); // 0=Sun, 6=Sat
  return day === 0 || day === 6;
}
// normalize stored date to YYYY-MM-DD for comparison
// handles DD.MM.YYYY (Russian), YYYY.MM.DD and YYYY-MM-DD
function normDate(s) {
  s = (s || '').trim();
  if (!s) return s;
  const m = s.match(/^(\d{2})[.\-](\d{2})[.\-](\d{4})$/);
  if (m) return `${m[3]}-${m[2]}-${m[1]}`;   // DD.MM.YYYY → YYYY-MM-DD
  return s.replace(/\./g, '-');               // YYYY.MM.DD → YYYY-MM-DD
}

// The backend always writes this note in Russian (it's what lands in
// Ольга's Google Sheet too), but Payment history is bilingual UI — re-render
// it in whichever language is active instead of showing a fixed Russian
// sentence next to English labels. Real staff names pass through unchanged.
function formatMarkedBy(markedBy) {
  const m = (markedBy || '').match(/^Система: перенос пропуска (\d{2}\.\d{2}\.\d{4})$/);
  if (!m) return markedBy;
  return L(`Система: перенос пропуска ${m[1]}`, `System: carried over a missed day from ${m[1]}`);
}

function loadStoredAttendance() {
  try {
    const parsed = JSON.parse(localStorage.getItem('balu_attendance'));
    return parsed && parsed.date === todayStr() ? parsed.statuses : null;
  } catch { return null; }
}

function persistAttendance(statuses) {
  try { localStorage.setItem('balu_attendance', JSON.stringify({ date: todayStr(), statuses })); } catch {}
}

// Role is re-checked once per day — same daily-reset pattern as attendance.
function loadStoredRole() {
  try {
    const parsed = JSON.parse(localStorage.getItem('balu_role'));
    if (!parsed || parsed.date !== todayStr()) return null;
    return { role: parsed.role, name: parsed.name || null };
  } catch { return null; }
}

function persistRole(role, name = null, token = null) {
  try { localStorage.setItem('balu_role', JSON.stringify({ date: todayStr(), role, name, token })); } catch {}
}

function LoginGate({ onLogin }) {
  const [password, setPassword] = React.useState('');
  const [error, setError] = React.useState(false);
  const [loading, setLoading] = React.useState(false);

  async function submit(e) {
    e.preventDefault();
    if (!password.trim()) return;
    setLoading(true);
    setError(false);
    const data = await window.login(password.trim());
    setLoading(false);
    if (data) onLogin(data);
    else setError(true);
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center',
      justifyContent: 'center', gap: 18, padding: 24, background: 'var(--bg)' }}>
