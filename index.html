// ── StaffDailyScreen ──────────────────────────────────────────────────────────

function StaffDailyScreen({ params, go }) {
  // Day and week were really the same screen (mark a status for a person
  // on a date) wearing two shapes — a toggle here instead of two separate
  // screens/tabs.
  const [view, setView] = React.useState('day'); // 'day' | 'week'

  // ── day view ──────────────────────────────────────────────────────────
  const initDate = (params && params.date) || todayStr();
  const [date, setDate] = React.useState(initDate);
  const [calOpen, setCalOpen] = React.useState(false);
  const [staff, setStaff] = React.useState([]);
  const [records, setRecords] = React.useState({});
  const [savedRecords, setSavedRecords] = React.useState({});

  // StaffTabBar's "Журнал" tab stays on this same screen (goTab replaces
  // the stack entry in place rather than remounting), so a tap while
  // already here changes params.date without ever re-running the
  // useState(initDate) initializer above — sync it explicitly or that tap
  // would silently do nothing.
  React.useEffect(() => {
    if (params && params.date && params.date !== date) { setDate(params.date); setView('day'); }
  }, [params && params.date]);

  React.useEffect(() => {
    // Re-fetch on every switch back into day view too, not just on date
    // change — editing a status for this same date via the week grid
    // (different state, see below) shouldn't leave these cards showing
    // what they had before you flipped over there.
    if (view !== 'day') return;
    Promise.all([withRetry(window.loadStaff), withRetry(() => window.getStaffAttendance(date))])
      .then(([s, rec]) => {
        // Teacher only sees themselves — except someone with Персонал
        // module access (director, or Rema), who's here to manage
        // everyone's attendance, not just mark their own.
        const filtered = window.__isTeacher && window.__teacherName && !window.__staffModuleAccess
          ? s.filter(x => x.name === window.__teacherName)
          : s;
        setStaff(filtered);
        setRecords(rec);
        setSavedRecords(rec);
      })
      .catch(() => {});
  }, [view, date]);

  const hasChanges = JSON.stringify(records) !== JSON.stringify(savedRecords);

  function setStatus(name, status) {
    setRecords(r => ({ ...r, [name]: { ...(r[name] || {}), status } }));
  }
  function setTime(name, time) {
    setRecords(r => ({ ...r, [name]: { ...(r[name] || {}), arrival_time: time } }));
  }
  function setNote(name, note) {
    setRecords(r => ({ ...r, [name]: { ...(r[name] || {}), note } }));
  }
  // Plain on/off — a half-day fork here just added a step nobody used and
  // made the label read as "Transfer — full day" for the common case.
  function toggleTransfer(name) {
    const cur = !!(records[name] || {}).transfer;
    setRecords(r => ({ ...r, [name]: { ...(r[name] || {}), transfer: cur ? 0 : 1 } }));
  }
  function toggleExtra(name) {
    const cur = !!(records[name] || {}).extra;
    setRecords(r => ({ ...r, [name]: { ...(r[name] || {}), extra: !cur } }));
  }

  const [saveErr, setSaveErr] = React.useState(null);
  async function save() {
    setSaveErr(null);
    // Only who actually changed, not the whole roster — otherwise saving
    // re-sends everyone else's last-known record too, and the backend
    // upserting exactly what's in this payload means whoever saves last
    // would silently overwrite a *different* person's edit made in
    // between with this saver's own possibly-stale copy of it. Same
    // reasoning as the garden/club attendance delta-saves.
    const delta = {};
    staff.forEach(s => {
      if (JSON.stringify(records[s.name]) !== JSON.stringify(savedRecords[s.name])) delta[s.name] = records[s.name];
    });
    if (Object.keys(delta).length === 0) return;
    try {
      await window.saveStaffAttendance(date, delta);
      setSavedRecords(records);
    } catch (e) {
      setSaveErr(L('Ошибка сохранения', 'Save failed'));
    }
  }

  // ── week view ─────────────────────────────────────────────────────────
  const [weekStart, setWeekStart] = React.useState(() => mondayOf(new Date()));
  const [weekStaff, setWeekStaff] = React.useState([]);
  const [weekData, setWeekData] = React.useState({});
  const [weekLoading, setWeekLoading] = React.useState(true);
  const [picker, setPicker] = React.useState(null);

  // Mon–Fri only — weekends aren't workdays for this staff, so a full
  // 7-column week would just waste two columns of dead space. A week at a
  // time (instead of a whole month) means those 5 columns can be wide
  // enough to actually read comfortably.
  const weekdays = Array.from({length: 5}, (_, i) => {
    const d = new Date(weekStart); d.setDate(weekStart.getDate() + i); return d;
  });
  const DOW_RU = ['Пн','Вт','Ср','Чт','Пт'], DOW_EN = ['Mon','Tue','Wed','Thu','Fri'];

  React.useEffect(() => {
    if (view !== 'week') return;
    setWeekLoading(true);
    // A week can straddle two calendar months near the boundary — fetch
    // whichever month(s) its 5 days actually fall in and merge them,
    // rather than adding a dedicated date-range endpoint for just this.
    const monthKeys = [...new Set(weekdays.map(d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`))];
    Promise.all([withRetry(window.loadStaff), ...monthKeys.map(mk => withRetry(() => window.getStaffMonthly(mk)))])
      .then(([s, ...monthDatas]) => {
        setWeekStaff(s);
        const merged = {};
        monthDatas.forEach(md => {
          Object.entries(md).forEach(([name, days]) => {
            merged[name] = { ...(merged[name] || {}), ...days };
          });
        });
        setWeekData(merged);
      })
      .catch(() => {})
      .finally(() => setWeekLoading(false));
  }, [view, weekStart.getTime()]);

  function prevWeek() { setWeekStart(w => { const d = new Date(w); d.setDate(w.getDate() - 7); return d; }); }
  function nextWeek() { setWeekStart(w => { const d = new Date(w); d.setDate(w.getDate() + 7); return d; }); }

  function getCell(name, d) {
    return weekData[name]?.[dateKey(d)] || null;
  }

  function openPicker(name, d) {
    const dk = dateKey(d);
    const rec = weekData[name]?.[dk];
    setPicker({ name, date: dk, day: d.getDate(), status: rec?.status || null, arrival_time: rec?.arrival_time || '' });
  }

  async function handlePick(status, arrival_time) {
    const { name, date: pickedDate } = picker;
    const prevRec = weekData[name]?.[pickedDate]; // for reverting the optimistic update on failure
    if (!status) {
      setWeekData(prev => {
        const n = { ...prev, [name]: { ...(prev[name] || {}) } };
        delete n[name][pickedDate];
        return n;
      });
      try {
        await window.clearStaffDay(pickedDate, name);
      } catch (e) {
        setWeekData(prev => ({ ...prev, [name]: { ...(prev[name] || {}), [pickedDate]: prevRec } }));
        window.showToast(L('Не удалось сохранить: ', 'Failed to save: ') + String(e));
      }
    } else {
      setWeekData(prev => ({
        ...prev,
        [name]: { ...(prev[name] || {}), [pickedDate]: { status, arrival_time: arrival_time || '' } }
      }));
      try {
        await window.setStaffDay(pickedDate, name, { status, arrival_time: arrival_time || '' });
      } catch (e) {
        setWeekData(prev => {
          const n = { ...prev, [name]: { ...(prev[name] || {}) } };
          if (prevRec === undefined) delete n[name][pickedDate]; else n[name][pickedDate] = prevRec;
          return n;
        });
        window.showToast(L('Не удалось сохранить: ', 'Failed to save: ') + String(e));
      }
    }
    setPicker(null);
  }

  const NAME_W = 72;
  const CELL_W = 58;
  const CELL_H = 46;

  const weekEnd = weekdays[4];
  const sameMonth = weekStart.getMonth() === weekEnd.getMonth();
  const weekLabel = sameMonth
    ? (window.__lang === 'ru'
        ? `${weekStart.getDate()}–${weekEnd.getDate()} ${MONTHS_RU[weekEnd.getMonth()]}`
        : `${MONTHS_EN[weekStart.getMonth()].slice(0,3)} ${weekStart.getDate()}–${weekEnd.getDate()}`)
    : (window.__lang === 'ru'
        ? `${weekStart.getDate()} ${MONTHS_RU[weekStart.getMonth()].slice(0,3)} – ${weekEnd.getDate()} ${MONTHS_RU[weekEnd.getMonth()].slice(0,3)}`
        : `${MONTHS_EN[weekStart.getMonth()].slice(0,3)} ${weekStart.getDate()} – ${MONTHS_EN[weekEnd.getMonth()].slice(0,3)} ${weekEnd.getDate()}`);

  return (
    <div style={{ padding: '4px 20px 28px' }}>
      <StaffTabBar go={go} active="staff-daily" />

      {/* Дата / День / Неделя — "Дата" replaces the old separate Календарь
          tab and the day-view's own calendar-square button (both opened
          the exact same picker, having both was a plain duplicate). */}
      <div style={{ display: 'flex', gap: 4, marginBottom: 16, background: '#FBF7F2', borderRadius: 999, padding: 4 }}>
        <button onClick={() => setCalOpen(true)} className="bk-press" style={{
          flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 13, fontWeight: 700,
          padding: '8px 4px', borderRadius: 999, background: 'transparent', color: 'var(--ink-soft)' }}>
          📅 {L('Дата', 'Date')}
        </button>
        <button onClick={() => setView('day')} className="bk-press" style={{
          flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 13, fontWeight: 700,
          padding: '8px 4px', borderRadius: 999,
          background: view === 'day' ? '#B07848' : 'transparent',
          color: view === 'day' ? '#fff' : 'var(--ink-soft)' }}>
          {L('День', 'Day')}
        </button>
        <button onClick={() => setView('week')} className="bk-press" style={{
          flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 13, fontWeight: 700,
          padding: '8px 4px', borderRadius: 999,
          background: view === 'week' ? '#B07848' : 'transparent',
          color: view === 'week' ? '#fff' : 'var(--ink-soft)' }}>
          {L('Неделя', 'Week')}
        </button>
      </div>
      {calOpen && <Portal><MiniCalendar selected={date}
        onSelect={d => { setDate(d); setView('day'); setCalOpen(false); }}
        onClose={() => setCalOpen(false)} disableWeekends={false} disableFuture={false} /></Portal>}

      {view === 'day' ? (
      <>
      {staff.length === 0 && (
        <div style={{ textAlign: 'center', padding: 40, color: 'var(--ink-faint)', fontSize: 13 }}>
          {L('Нет сотрудников', 'No staff')}
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      {staff.map(s => {
        const rec      = records[s.name] || {};
        const status   = rec.status || 'present';
        const isLate   = status === 'late';
        const transfer = rec.transfer || 0;
        const extra    = !!rec.extra;
        return (
          <Card key={s.name} pad={14}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10 }}>
              <Avatar emoji={positionEmoji(s.position)} color="#EDE8E0" size={40} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 800, fontSize: 14, color: 'var(--ink)' }}>{s.name}</div>
                <div style={{ fontSize: 12, color: 'var(--ink-soft)' }}>{s.position}</div>
              </div>
            </div>
            {/* Status pills */}
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7 }}>
              {STAFF_STATUSES.map(opt => (
                <button key={opt.id} onClick={() => setStatus(s.name, opt.id)} className="bk-press" style={{
                  border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 12, fontWeight: 700,
                  padding: '6px 12px', borderRadius: 999,
                  background: status === opt.id ? (SSTAFF_COLOR[opt.id] || '#B07848') : '#F0EBE3',
                  color: status === opt.id ? (SSTAFF_INK[opt.id] || '#fff') : 'var(--ink-soft)',
                  transition: 'all 0.12s' }}>
                  {opt.emoji} {window.__lang === 'en' ? opt.en : opt.ru}
                </button>
              ))}
            </div>
            {/* Extras — transfer (bus escort) and overtime, both
                independent of status: someone can be "present" AND have
                done either (or both) that same day, it's extra-paid on
                top of their regular work. */}
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7, marginTop: 8 }}>
              <button onClick={() => toggleTransfer(s.name)} className="bk-press" style={{
                border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 12, fontWeight: 700,
                padding: '6px 12px', borderRadius: 999,
                background: transfer ? EXTRA_COLOR : '#F0EBE3',
                color: transfer ? EXTRA_INK : 'var(--ink-soft)',
                transition: 'all 0.12s' }}>
                🚌 {L('Трансфер', 'Transfer')}
              </button>
              <button onClick={() => toggleExtra(s.name)} className="bk-press" style={{
                border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 12, fontWeight: 700,
                padding: '6px 12px', borderRadius: 999,
                background: extra ? EXTRA_COLOR : '#F0EBE3',
                color: extra ? EXTRA_INK : 'var(--ink-soft)',
                transition: 'all 0.12s' }}>
                ⏰ {L('Переработка', 'Overtime')}
              </button>
            </div>
            {/* Time picker for late */}
            {isLate && (
              <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 10 }}>
                <span style={{ fontSize: 12, color: 'var(--ink-soft)', fontWeight: 700 }}>
                  🕐 {L('Время прихода', 'Arrival')}:
                </span>
                <input type="time" value={rec.arrival_time || ''}
                  onChange={e => setTime(s.name, e.target.value)}
                  style={{ border: '1.5px solid #DDD8CF', borderRadius: 10, padding: '5px 10px',
                    fontFamily: 'inherit', fontSize: 13, background: '#FBF7F2', color: 'var(--ink)', outline: 'none' }} />
              </div>
            )}
            {/* Note */}
            <textarea value={rec.note || ''} onChange={e => setNote(s.name, e.target.value)}
              placeholder={L('Заметка…', 'Note…')} rows={1}
              style={{ marginTop: 10, width: '100%', boxSizing: 'border-box', resize: 'none',
                border: '1.5px solid #DDD8CF', borderRadius: 10, padding: '7px 12px',
                fontFamily: 'inherit', fontSize: 12.5, background: '#FBF7F2',
                color: 'var(--ink)', outline: 'none', lineHeight: 1.4,
                overflow: 'hidden', minHeight: 34 }}
              onInput={e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }} />
          </Card>
        );
      })}
      </div>

      {saveErr && <div style={{ textAlign: 'center', color: 'var(--no)', fontSize: 13, fontWeight: 600, padding: '6px 0' }}>{saveErr}</div>}
      {staff.length > 0 && <SaveBar hasChanges={hasChanges} onSave={save} />}
      </>
      ) : (
      <>
      {/* Week nav */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 14, marginBottom: 14 }}>
        <button onClick={prevWeek} className="bk-press" style={{
          border: 'none', background: 'none', cursor: 'pointer', padding: '0 10px' }}><Chevron dir="left" size={18} /></button>
        <span style={{ fontSize: 14, fontWeight: 800, color: 'var(--ink-soft)', minWidth: 150, textAlign: 'center' }}>
          {weekLabel} {weekEnd.getFullYear()}
        </span>
        <button onClick={nextWeek} className="bk-press" style={{
          border: 'none', background: 'none', cursor: 'pointer', padding: '0 10px' }}><Chevron dir="right" size={18} /></button>
      </div>

      {weekLoading && (
        <div style={{ textAlign: 'center', padding: '32px 20px', color: 'var(--ink-faint)', fontSize: 13 }}>…</div>
      )}
      {!weekLoading && weekStaff.length === 0 && (
        <div style={{ textAlign: 'center', padding: '32px 20px', color: 'var(--ink-soft)', fontSize: 14, fontWeight: 700 }}>
          {L('Сначала добавьте сотрудников в разделе «Команда»', 'Add staff members in the Team section first')}
        </div>
      )}

      {!weekLoading && weekStaff.length > 0 && (
        <div style={{ overflowX: 'auto', WebkitOverflowScrolling: 'touch', paddingBottom: 4 }}>
          <div style={{ display: 'inline-block',
            minWidth: NAME_W + weekdays.length * (CELL_W + 4) }}>

            {/* Weekday-name + date header */}
            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 6 }}>
              <div style={{ width: NAME_W, flexShrink: 0 }} />
              {weekdays.map((d, i) => (
                <div key={i} style={{ width: CELL_W, flexShrink: 0, marginRight: 4, textAlign: 'center' }}>
                  <div style={{ fontSize: 11.5, fontWeight: 800, color: 'var(--ink-soft)' }}>
                    {window.__lang === 'ru' ? DOW_RU[i] : DOW_EN[i]}
                  </div>
                  <div style={{ fontSize: 10, fontWeight: 600, color: 'var(--ink-faint)' }}>{d.getDate()}</div>
                </div>
              ))}
            </div>

            {/* Staff rows */}
            {weekStaff.map(s => {
              const parts = s.name.split(' ');
              const firstName = parts[0];
              const rest = parts.slice(1).join(' ');
              return (
                <div key={s.name} style={{ display: 'flex', alignItems: 'center', marginBottom: 5 }}>
                  <div style={{ width: NAME_W, flexShrink: 0, paddingRight: 5, overflow: 'hidden' }}>
                    <span style={{ fontSize: 11.5, fontWeight: 800, color: 'var(--ink)',
                      display: 'block', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                      {firstName}
                    </span>
                    {rest && <span style={{ fontSize: 9.5, fontWeight: 600, color: 'var(--ink-soft)',
                      display: 'block', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{rest}</span>}
                  </div>
                  {weekdays.map((d, i) => {
                    const rec = getCell(s.name, d);
                    const st  = rec?.status || null;
                    const ss  = st ? STAFF_STATUSES.find(x => x.id === st) : null;
                    const bg  = st ? SSTAFF_COLOR[st] : '#F5F3EE';
                    const stickers = [];
                    if (rec?.transfer) stickers.push('🚌');
                    if (rec?.extra) stickers.push('⏰');
                    return (
                      <button key={i} onClick={() => openPicker(s.name, d)} className="bk-press"
                        style={{ position: 'relative', width: CELL_W, height: CELL_H, flexShrink: 0, marginRight: 4,
                          border: 'none', cursor: 'pointer', borderRadius: 10,
                          background: bg, fontSize: 19, fontFamily: 'inherit',
                          display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        {ss?.emoji || ''}
                        {stickers.map((emoji, si) => (
                          <span key={emoji} style={{ position: 'absolute',
                            [si === 0 ? 'top' : 'bottom']: -4, right: -4, fontSize: 12 }}>{emoji}</span>
                        ))}
                      </button>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Legend */}
      <div style={{ padding: '14px 0 0', display: 'flex', flexWrap: 'wrap', gap: 6 }}>
        {STAFF_STATUSES.map(ss => (
          <span key={ss.id} style={{ fontSize: 11, fontWeight: 600,
            background: SSTAFF_COLOR[ss.id], color: SSTAFF_INK[ss.id],
            padding: '3px 8px', borderRadius: 999 }}>
            {ss.emoji} {window.__lang === 'ru' ? ss.ru : ss.en}
          </span>
        ))}
        <span style={{ fontSize: 11, fontWeight: 600, background: EXTRA_COLOR, color: EXTRA_INK,
          padding: '3px 8px', borderRadius: 999 }}>
          🚌 {L('Трансфер', 'Transfer')}
        </span>
        <span style={{ fontSize: 11, fontWeight: 600, background: EXTRA_COLOR, color: EXTRA_INK,
          padding: '3px 8px', borderRadius: 999 }}>
          ⏰ {L('Переработка', 'Overtime')}
        </span>
      </div>

      {picker && (
        <ScheduleCellPicker picker={picker} onClose={() => setPicker(null)} onPick={handlePick} />
      )}
      </>
      )}
    </div>
  );
}

// ── StaffMonthlyScreen ────────────────────────────────────────────────────────

// Shared by StaffMonthlyScreen and MyScheduleScreen — both render a month
// label from a "YYYY-MM" key.
const RU_MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const EN_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function StaffMonthlyScreen({ go, staff }) {
  // staff (the roster) comes from App() now, shared with Сотрудники/Задачи
  // so switching tabs doesn't re-fetch and flash a loading state for data
  // that's already there — only the month's attendance data below is
  // actually specific to this screen.
  const now = new Date();
  const [month, setMonth] = React.useState(
    `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`
  );
  const [data, setData]   = React.useState({});
  const [loading, setLoading] = React.useState(true);
  // Was one person at a time, flipped through with arrows — a square-card
  // grid (same as Team/Tasks) instead, tap a card to see that person's
  // calendar; null means "show the grid".
  const [selectedName, setSelectedName] = React.useState(null);

  React.useEffect(() => {
    setLoading(true);
    withRetry(() => window.getStaffMonthly(month))
      .then(setData)
      .catch(() => {})
      .finally(() => setLoading(false));
  }, [month]);

  const staffReady = staff !== null;
  const staffList = staff || [];

  const [yr, mo] = month.split('-').map(Number);
  const monthLabel = window.__lang === 'en' ? `${EN_MONTHS[mo-1]} ${yr}` : `${RU_MONTHS[mo-1]} ${yr}`;
  const daysInMonth = new Date(yr, mo, 0).getDate();

  function prevMonth() {
    const d = new Date(yr, mo - 2, 1);
    setMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  function nextMonth() {
    const d = new Date(yr, mo, 1);
    setMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }

  function countStatus(name, statusId) {
    const days = data[name] || {};
    return Object.values(days).filter(d => d.status === statusId).length;
  }
  // Sums each day's worked fraction (half day counts as 0.5) instead of
  // just counting days, so the "worked" total reflects a genuine half day
  // instead of counting it as a full one.
  function workedDays(name) {
    const days = data[name] || {};
    return Object.values(days).reduce((sum, d) => sum + (STAFF_STATUS_WORKED_VALUE[d.status] || 0), 0);
  }

  const s = staffList.find(x => x.name === selectedName);

  return (
    <div style={{ padding: '4px 20px 28px' }}>
      <StaffTabBar go={go} active="staff-monthly" />

      {/* The grid only needs the (already-shared, instantly-ready) staff
          list — it doesn't wait on this month's attendance data, so
          tabbing in here no longer flashes a loading state the roster
          grid itself never actually needed. Only the per-person detail
          below needs `loading` (see there). */}
      {!staffReady && <div style={{ textAlign: 'center', padding: 40, color: 'var(--ink-faint)', fontSize: 13 }}>…</div>}

      {staffReady && staffList.length === 0 && (
        <div style={{ textAlign: 'center', padding: 40, color: 'var(--ink-faint)', fontSize: 14 }}>
          {L('Нет сотрудников', 'No staff')}
        </div>
      )}

      {staffReady && !selectedName && staffList.length > 0 && (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
          {staffList.map(person => (
            <button key={person.name} onClick={() => setSelectedName(person.name)} className="bk-press" style={{
              border: 'none', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'center',
              background: '#FBF7F2', borderRadius: 18, padding: '16px 6px 12px',
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8,
              boxShadow: '0 1px 2px rgba(60,40,20,0.05)' }}>
              <Avatar emoji={positionEmoji(person.position)} color="#EDE8E0" size={46} />
              <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink)', lineHeight: 1.25 }}>{person.name}</div>
            </button>
          ))}
        </div>
      )}

      {selectedName && loading && (
        <div style={{ textAlign: 'center', padding: 40, color: 'var(--ink-faint)', fontSize: 13 }}>…</div>
      )}

      {!loading && selectedName && s && (() => {
        const worked   = workedDays(s.name);
        const halfDays = countStatus(s.name, 'half-day');
        const sick     = countStatus(s.name, 'sick');
        const dayOff   = countStatus(s.name, 'day-off');
        const absent   = countStatus(s.name, 'absent');
        const allDays  = data[s.name] || {};
        // Transfer and overtime are both "extras" — independent of the
        // day's status, someone can be "present" and still have done
        // either (or both) that same day — so both get the same treatment:
        // a small sticker on the day cell, plus their own dates-list block
        // below, rather than living in the status pills/chips above.
        const transferEntries = Object.entries(allDays)
          .filter(([, rec]) => rec.transfer)
          .map(([date, rec]) => ({ day: Number(date.slice(-2)), half: rec.transfer === 0.5 }))
          .sort((a, b) => a.day - b.day);
        const transferTotal = transferEntries.reduce((sum, e) => sum + (e.half ? 0.5 : 1), 0);
        const extraDays = Object.entries(allDays)
          .filter(([, rec]) => rec.extra)
          .map(([date]) => Number(date.slice(-2)))
          .sort((a, b) => a - b);

        return (
          <>
            {/* Back to the staff grid, instead of flipping to the next/prev person */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
              <button onClick={() => setSelectedName(null)} className="bk-press" style={{
                border: 'none', background: 'none', cursor: 'pointer', padding: 6 }}><Chevron dir="left" size={22} /></button>
              <Avatar emoji={positionEmoji(s.position)} color="#EDE8E0" size={44} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 800, fontSize: 15.5, color: 'var(--ink)' }}>{s.name}</div>
                <div style={{ fontSize: 12, color: 'var(--ink-soft)' }}>{s.position}</div>
              </div>
            </div>

            {/* Month navigation — only shown once a person is picked, so
                flipping through months always means flipping through this
                one person's calendar, not affecting the grid behind it. */}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              background: '#FBF7F2', borderRadius: 999, padding: '4px 6px', marginBottom: 16,
              boxShadow: '0 1px 2px rgba(60,40,20,0.05)' }}>
              <button onClick={prevMonth} className="bk-press" style={{
                border: 'none', background: 'none', cursor: 'pointer', padding: 8,
                display: 'grid', placeItems: 'center' }}><Chevron dir="left" size={16} /></button>
              <div style={{ fontSize: 13.5, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)' }}>
                {monthLabel}
              </div>
              <button onClick={nextMonth} className="bk-press" style={{
                border: 'none', background: 'none', cursor: 'pointer', padding: 8,
                display: 'grid', placeItems: 'center' }}><Chevron dir="right" size={16} /></button>
            </div>

            <Card pad={14}>
              {/* Calendar mini-grid — one person fills the whole screen now,
                  so this can be noticeably bigger than when it had to share
                  space with everyone else's card in a scrolling list. */}
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 6, marginBottom: 14 }}>
                {Array.from({ length: daysInMonth }, (_, i) => {
                  const d = String(i + 1).padStart(2, '0');
                  const key = `${month}-${d}`;
                  const rec = allDays[key];
                  const st = rec?.status;
                  const time = st === 'late' && rec?.arrival_time ? rec.arrival_time : null;
                  // First sticker takes the top-right corner; a second one
                  // goes to the bottom-right corner instead of stacking
                  // right under the first — two badges crammed at the top
                  // of such a small cell read as clutter.
                  const stickers = [];
                  if (rec?.transfer) stickers.push('🚌');
                  if (rec?.extra) stickers.push('⏰');
                  return (
                    <div key={d} style={{
                      position: 'relative', borderRadius: 11, fontSize: 16, fontWeight: 800,
                      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                      padding: '10px 2px',
                      background: st ? (SSTAFF_COLOR[st] || '#EDE8E0') : '#F5F2EE',
                      color: st ? (SSTAFF_INK[st] || '#5a4a30') : '#C8BEB0' }}>
                      <span>{i + 1}</span>
                      {time && <span style={{ fontSize: 11, lineHeight: 1.2, opacity: 0.85 }}>{time.slice(0,5)}</span>}
                      {stickers.map((emoji, si) => (
                        <span key={emoji} style={{ position: 'absolute',
                          [si === 0 ? 'top' : 'bottom']: -5, right: -5, fontSize: 12 }}>{emoji}</span>
                      ))}
                    </div>
                  );
                })}
              </div>

              {/* Summary chips */}
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7 }}>
                <span style={{ background: '#D4F0DF', color: '#1f7a55', padding: '4px 11px', borderRadius: 999, fontSize: 12, fontWeight: 700 }}>
                  ✅ {worked % 1 === 0 ? worked : worked.toFixed(1)} {L('дн', 'd')}
                </span>
                {halfDays > 0 && <span style={{ background: SSTAFF_COLOR['half-day'], color: SSTAFF_INK['half-day'], padding: '4px 11px', borderRadius: 999, fontSize: 12, fontWeight: 700 }}>
                  🌗 {halfDays}
                </span>}
                {sick > 0 && <span style={{ background: '#FBD9E1', color: '#a8456a', padding: '4px 11px', borderRadius: 999, fontSize: 12, fontWeight: 700 }}>
                  🤒 {sick}
                </span>}
                {dayOff > 0 && <span style={{ background: '#E8D5FB', color: '#5a2a86', padding: '4px 11px', borderRadius: 999, fontSize: 12, fontWeight: 700 }}>
                  🏖️ {dayOff}
                </span>}
                {absent > 0 && <span style={{ background: '#FFE0E0', color: '#a03030', padding: '4px 11px', borderRadius: 999, fontSize: 12, fontWeight: 700 }}>
                  ❌ {absent}
                </span>}
              </div>

              {/* Extras — transfer (bus escort) and overtime, both extra-paid
                  and independent of the day's status, so shown separately
                  with their own dates rather than folded into the status
                  chips above. Half-days on transfer count as 0.5 toward the
                  total, matching Ольга's own paper tracking ("18 and half
                  days"); overtime has no half-day case. */}
              {transferEntries.length > 0 && (
                <div style={{ marginTop: 8, background: '#EAF4FD', borderRadius: 12, padding: '8px 11px',
                  display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                  <span style={{ fontSize: 12, fontWeight: 800, color: '#1f5f86' }}>
                    🚌 {L('Трансфер', 'Transfer')}: {transferTotal % 1 === 0 ? transferTotal : `${Math.floor(transferTotal)}.5`} {L('дн', 'd')}
                  </span>
                  <span style={{ fontSize: 11.5, color: '#1f5f86', opacity: 0.85 }}>
                    ({transferEntries.map(e => e.half ? `${e.day}½` : `${e.day}`).join(', ')})
                  </span>
                </div>
              )}
              {extraDays.length > 0 && (
                <div style={{ marginTop: 8, background: '#EAF4FD', borderRadius: 12, padding: '8px 11px',
                  display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                  <span style={{ fontSize: 12, fontWeight: 800, color: '#1f5f86' }}>
                    ⏰ {L('Переработка', 'Overtime')}: {extraDays.length} {L('дн', 'd')}
                  </span>
                  <span style={{ fontSize: 11.5, color: '#1f5f86', opacity: 0.85 }}>
                    ({extraDays.join(', ')})
                  </span>
                </div>
              )}
            </Card>
          </>
        );
      })()}
    </div>
  );
}

const TITLES = {
  home: 'appName', children: 'children', attendance: 'markDay',
  payments: 'payments', 'payments-garden': 'payments', 'payments-clubs': 'payments',
  activities: 'activities', club: 'activities', summary: 'daySummary', notifications: 'notifications', compose: 'compose',
  team: 'team', 'staff-daily': 'staffLog', 'staff-monthly': 'monthSummary', 'staff-tasks': 'staffTasks',
  'my-tasks': 'myTasks', 'my-schedule': 'mySchedule',
};

const WEEKDAY_LABELS_RU = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WEEKDAY_LABELS_EN = ['Mo','Tu','We','Th','Fr','Sa','Su'];

// Same idea as Lo(), for a task's title specifically — titleEn is only
// ever set once Ольга actually taps translate (see TaskFormSheet/
// TaskEditSheet), so an untranslated task correctly still shows its
// Russian text even when the viewer's app is set to English.
function taskTitleLo(t) {
  return (window.__lang === 'en' && t.titleEn) ? t.titleEn : t.title;
}

function taskRecurrenceLabel(t) {
  if (t.recurrence === 'once') return L('Разово', 'One-time');
  if (t.recurrence === 'count') return L(`${t.targetCount} раз`, `${t.targetCount}×`);
  const names = t.weekdays.map(w => window.__lang === 'ru' ? WEEKDAY_LABELS_RU[w] : WEEKDAY_LABELS_EN[w]);
  return L(`Каждую неделю: ${names.join(', ')}`, `Weekly: ${names.join(', ')}`);
}

function TaskFormSheet({ staffName, onClose, onSaved }) {
  const [title,       setTitle]       = React.useState('');
  // Same one-tap RU->EN helper as Уведомления (see ComposeScreen.translate)
  // — tapping the flag replaces the visible text with its English
  // translation and keeps the original Russian here, so Save can send both.
  const [titleRu,      setTitleRu]      = React.useState('');
  const [translating,  setTranslating]  = React.useState(false);
  const [recurrence,  setRecurrence]  = React.useState('once');
  const [weekdays,    setWeekdays]    = React.useState([]);
  const [targetCount, setTargetCount] = React.useState('3');
  const [startDate,   setStartDate]   = React.useState(todayStr());
  const [endDate,     setEndDate]     = React.useState('');
  const [saving,      setSaving]      = React.useState(false);
  const [error,       setError]       = React.useState(null);

  function toggleWeekday(w) {
    setWeekdays(ws => ws.includes(w) ? ws.filter(x => x !== w) : [...ws, w].sort());
  }

  async function translateTitle() {
    if (!title.trim()) return;
    setTranslating(true);
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(title.trim())}&langpair=ru|en`);
      const data = await res.json();
      const en = data.responseData?.translatedText;
      if (en) { setTitleRu(title); setTitle(en); }
    } catch {}
    finally { setTranslating(false); }
  }

  async function handleSave() {
    if (!title.trim()) { setError(L('Введите текст задачи', 'Enter a task description')); return; }
    if (recurrence === 'weekly' && weekdays.length === 0) {
      setError(L('Выберите хотя бы один день недели', 'Pick at least one weekday')); return;
    }
    if (recurrence === 'count' && (!targetCount || Number(targetCount) < 1)) {
      setError(L('Укажите количество раз', 'Enter how many times')); return;
    }
    setSaving(true); setError(null);
    try {
      await window.createStaffTask({
        staffName, title: (titleRu || title).trim(), titleEn: titleRu ? title.trim() : null, recurrence, weekdays,
        targetCount: recurrence === 'count' ? Number(targetCount) : null,
        startDate, endDate: (recurrence === 'weekly' && endDate) ? endDate : null,
      });
      onSaved();
    } catch (e) { setError(e.message); setSaving(false); }
  }

  const INP = { width: '100%', boxSizing: 'border-box', border: '1.5px solid #DDD8CF', borderRadius: 12,
    padding: '11px 14px', fontFamily: 'inherit', fontSize: 14, background: '#FBF7F2',
    color: 'var(--ink)', outline: 'none' };
  const LBL = { fontSize: 11, fontWeight: 700, letterSpacing: '0.05em', textTransform: 'uppercase',
    color: 'var(--ink-soft)', marginBottom: 5, display: 'block' };

  return (
    <Portal>
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'flex', alignItems: 'flex-end',
      background: 'rgba(0,0,0,0.4)' }} onClick={onClose}>
      <div style={{ width: '100%', background: 'var(--bg)', borderRadius: '24px 24px 0 0',
        maxHeight: '92vh', display: 'flex', flexDirection: 'column' }}
        onClick={e => e.stopPropagation()}>

        <div style={{ flexShrink: 0, padding: '12px 20px 12px', borderBottom: '1px solid rgba(60,40,20,0.07)' }}>
          <div style={{ width: 40, height: 4, background: 'rgba(60,40,20,0.15)', borderRadius: 2, margin: '0 auto 12px' }} />
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)' }}>
              {L('Новая задача', 'New task')} — {staffName}
            </div>
            <button onClick={onClose} style={{ border: 'none', background: 'none', fontSize: 24,
              cursor: 'pointer', color: 'var(--ink-faint)', padding: 4 }}>×</button>
          </div>
        </div>

        <div style={{ flex: 1, overflowY: 'auto', padding: '16px 20px 8px' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div>
              <label style={LBL}>{L('Задача', 'Task')}</label>
              <div style={{ position: 'relative' }}>
                <textarea style={{ ...INP, resize: 'none', paddingBottom: 38 }} rows={2} value={title}
                  onChange={e => { setTitle(e.target.value); setTitleRu(''); }}
                  placeholder={L('Скидывать отчёт о состоянии площадки и склада', 'Send a report on playground/warehouse status')} />
                <button onClick={translateTitle} disabled={!title.trim() || translating} className="bk-press"
                  title={L('Перевести на английский', 'Translate to English')} style={{
                  position: 'absolute', bottom: 8, right: 8,
                  border: 'none', cursor: title.trim() && !translating ? 'pointer' : 'default',
                  fontSize: 18, lineHeight: 1, padding: '4px 8px', borderRadius: 10,
                  background: 'rgba(255,255,255,0.7)', opacity: translating ? 0.4 : title.trim() ? 1 : 0.3,
                  transition: 'opacity .2s', boxShadow: '0 1px 4px rgba(60,40,20,0.1)' }}>
                  🇬🇧
                </button>
              </div>
            </div>

            <div>
              <label style={LBL}>{L('Периодичность', 'Recurrence')}</label>
              <div style={{ display: 'flex', gap: 6 }}>
                {[['once', L('Разово', 'Once')], ['weekly', L('Еженедельно', 'Weekly')], ['count', L('N раз', 'N times')]].map(([id, lbl]) => (
                  <button key={id} onClick={() => setRecurrence(id)} className="bk-press" style={{
                    flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
                    padding: '9px 4px', borderRadius: 12, fontSize: 12.5, fontWeight: 800,
                    background: recurrence === id ? '#B07848' : '#FBF7F2',
                    color: recurrence === id ? '#fff' : 'var(--ink-soft)' }}>
                    {lbl}
                  </button>
                ))}
              </div>
            </div>

            {recurrence === 'weekly' && (
              <div>
                <label style={LBL}>{L('Дни недели', 'Weekdays')}</label>
                <div style={{ display: 'flex', gap: 5 }}>
                  {(window.__lang === 'ru' ? WEEKDAY_LABELS_RU : WEEKDAY_LABELS_EN).map((lbl, w) => (
                    <button key={w} onClick={() => toggleWeekday(w)} className="bk-press" style={{
                      flex: 1, border: 'none', cursor: 'pointer', fontFamily: 'inherit',
                      padding: '8px 2px', borderRadius: 10, fontSize: 12, fontWeight: 800,
                      background: weekdays.includes(w) ? '#B07848' : '#FBF7F2',
                      color: weekdays.includes(w) ? '#fff' : 'var(--ink-soft)' }}>
                      {lbl}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {recurrence === 'count' && (
              <div>
                <label style={LBL}>{L('Сколько раз', 'How many times')}</label>
                <input style={INP} type="number" inputMode="numeric" min="1" value={targetCount}
                  onChange={e => setTargetCount(e.target.value)} placeholder="3" />
              </div>
            )}

            <div>
              <label style={LBL}>{recurrence === 'once' ? L('Дата', 'Date') : L('Начиная с', 'Starting')}</label>
              <input style={INP} type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
            </div>

            {recurrence === 'weekly' && (
              <div>
                <label style={LBL}>{L('До какой даты (необязательно)', 'Until (optional)')}</label>
                <input style={INP} type="date" value={endDate} onChange={e => setEndDate(e.target.value)} />
              </div>
            )}
          </div>

          {error && <div style={{ marginTop: 12, fontSize: 13, color: 'var(--no)', fontWeight: 600 }}>{error}</div>}

          <button onClick={handleSave} disabled={saving} className="bk-press" style={{
            width: '100%', border: 'none', cursor: 'pointer', fontFamily: 'var(--font-display)',
            background: '#B07848', color: '#fff', fontSize: 15, fontWeight: 800,
            padding: 14, borderRadius: 16, margin: '20px 0 24px', opacity: saving ? 0.7 : 1 }}>
            {saving ? '…' : L('Создать', 'Create')}
          </button>
        </div>
      </div>
    </div>
    </Portal>
  );
}

function TaskEditSheet({ task, onClose, onSaved, onDelete }) {
  // Deliberately scoped to just text + deadline, not a full reconfigure of
  // the recurrence pattern (weekdays/count) — changing those after
  // instances already exist would mean reconciling already-answered ones
  // against a new schedule, a bigger feature than what was asked for.
  const [title, setTitle] = React.useState(task.title);
  // Same one-tap RU->EN helper as Уведомления (see ComposeScreen.translate).
  // If she doesn't touch it, whatever translation already existed carries
  // over unchanged (see handleSave) — editing the date shouldn't silently
  // wipe out a translation she made earlier.
  const [titleRu,     setTitleRu]     = React.useState('');
  const [translating, setTranslating] = React.useState(false);
  const [startDate, setStartDate] = React.useState(task.startDate || '');
  const [endDate, setEndDate] = React.useState(task.endDate || '');
  const [saving, setSaving] = React.useState(false);
  const [error, setError] = React.useState(null);
  // Same two-step confirm as deleting a staff member (see StaffFormSheet) —
  // replaces the long-press-to-delete gesture this used to rely on, which
  // wasn't how deletion works anywhere else in the app.
  const [deleteConfirm, setDeleteConfirm] = React.useState(false);

  async function translateTitle() {
    if (!title.trim()) return;
    setTranslating(true);
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(title.trim())}&langpair=ru|en`);
      const data = await res.json();
      const en = data.responseData?.translatedText;
      if (en) { setTitleRu(title); setTitle(en); }
    } catch {}
    finally { setTranslating(false); }
  }

  async function handleSave() {
    if (!title.trim()) { setError(L('Введите текст задачи', 'Enter a task description')); return; }
    setSaving(true); setError(null);
    // Re-translated just now -> use it. Otherwise, if the Russian text
    // itself is unchanged, keep whatever translation already existed;
    // if she edited it without re-translating, the old one's stale, so
    // it's cleared rather than silently showing a mismatched English text.
    const titleEnToSend = titleRu
      ? title.trim()
      : (title.trim() === task.title ? (task.titleEn || null) : null);
    try {
      await window.updateStaffTask(task.id, {
        title: (titleRu || title).trim(),
        titleEn: titleEnToSend,
        startDate: task.recurrence === 'once' ? startDate : null,
        endDate: task.recurrence === 'weekly' ? (endDate || null) : null,
      });
      onSaved();
    } catch (e) { setError(e.message); setSaving(false); }
  }

  const INP = { width: '100%', boxSizing: 'border-box', border: '1.5px solid #DDD8CF', borderRadius: 12,
    padding: '11px 14px', fontFamily: 'inherit', fontSize: 14, background: '#FBF7F2',
    color: 'var(--ink)', outline: 'none' };
  const LBL = { fontSize: 11, fontWeight: 700, letterSpacing: '0.05em', textTransform: 'uppercase',
    color: 'var(--ink-soft)', marginBottom: 5, display: 'block' };

  return (
    <Portal>
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'flex', alignItems: 'flex-end',
      background: 'rgba(0,0,0,0.4)' }} onClick={onClose}>
      <div style={{ width: '100%', background: 'var(--bg)', borderRadius: '24px 24px 0 0',
        maxHeight: '92vh', display: 'flex', flexDirection: 'column' }}
        onClick={e => e.stopPropagation()}>

        <div style={{ flexShrink: 0, padding: '12px 20px 12px', borderBottom: '1px solid rgba(60,40,20,0.07)' }}>
          <div style={{ width: 40, height: 4, background: 'rgba(60,40,20,0.15)', borderRadius: 2, margin: '0 auto 12px' }} />
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: 'var(--ink)', fontFamily: 'var(--font-display)' }}>
              {L('Изменить задачу', 'Edit task')}
            </div>
            <button onClick={onClose} style={{ border: 'none', background: 'none', fontSize: 24,
              cursor: 'pointer', color: 'var(--ink-faint)', padding: 4 }}>×</button>
          </div>
        </div>

        <div style={{ flex: 1, overflowY: 'auto', padding: '16px 20px 8px' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div>
              <label style={LBL}>{L('Задача', 'Task')}</label>
              <div style={{ position: 'relative' }}>
                <textarea style={{ ...INP, resize: 'none', paddingBottom: 38 }} rows={2} value={title}
                  onChange={e => { setTitle(e.target.value); setTitleRu(''); }} autoFocus />
                <button onClick={translateTitle} disabled={!title.trim() || translating} className="bk-press"
                  title={L('Перевести на английский', 'Translate to English')} style={{
                  position: 'absolute', bottom: 8, right: 8,
                  border: 'none', cursor: title.trim() && !translating ? 'pointer' : 'default',
                  fontSize: 18, lineHeight: 1, padding: '4px 8px', borderRadius: 10,
                  background: 'rgba(255,255,255,0.7)', opacity: translating ? 0.4 : title.trim() ? 1 : 0.3,
                  transition: 'opacity .2s', boxShadow: '0 1px 4px rgba(60,40,20,0.1)' }}>
                  🇬🇧
                </button>
              </div>
            </div>

            {task.recurrence === 'once' && (
              <div>
                <label style={LBL}>{L('Дата', 'Date')}</label>
                <input style={INP} type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
              </div>
            )}

            {task.recurrence === 'weekly' && (
              <div>
                <label style={LBL}>{L('До какой даты (необязательно)', 'Until (optional)')}</label>
                <input style={INP} type="date" value={endDate} onChange={e => setEndDate(e.target.value)} />
              </div>
            )}
          </div>

          {error && <div style={{ marginTop: 12, fontSize: 13, color: 'var(--no)', fontWeight: 600 }}>{error}</div>}

          <button onClick={handleSave} disabled={saving} className="bk-press" style={{
            width: '100%', border: 'none', cursor: 'pointer', fontFamily: 'var(--font-display)',
            background: '#B07848', color: '#fff', fontSize: 15, fontWeight: 800,
            padding: 14, borderRadius: 16, marginTop: 20, opacity: saving ? 0.7 : 1 }}>
            {saving ? '…' : L('Сохранить', 'Save')}
          </button>

          {!deleteConfirm && (
            <button onClick={() => setDeleteConfirm(true)} className="bk-press" style={{
              width: '100%', border: 'none', cursor: 'pointer', fontFamily: 'inherit',
              background: 'none', color: '#E05555', fontSize: 14, fontWeight: 700,
              padding: '14px 0 4px' }}>
              🗑️ {L('Удалить задачу', 'Delete task')}
            </button>
          )}
          {deleteConfirm && (
            <div style={{ marginTop: 12, background: '#FFF0F0', borderRadius: 14, padding: 16 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: '#a03030', marginBottom: 12 }}>
                {L('Удалить задачу?', 'Delete task?')}
              </div>
              <div style={{ display: 'flex', gap: 10 }}>
                <button onClick={() => setDeleteConfirm(false)} className="bk-press" style={{
                  flex: 1, border: 'none', cursor: 'pointer', background: '#EDE8E0',
                  borderRadius: 12, padding: 11, fontFamily: 'inherit', fontSize: 14, fontWeight: 800 }}>
                  {L('Отмена', 'Cancel')}
                </button>
                <button onClick={onDelete} className="bk-press" style={{
                  flex: 1, border: 'none', cursor: 'pointer', background: '#E05555',
                  borderRadius: 12, padding: 11, fontFamily: 'inherit', fontSize: 14, fontWeight: 800, color: '#fff' }}>
                  {L('Удалить', 'Delete')}
                </button>
              </div>
            </div>
          )}
          <div style={{ height: 24 }} />
        </div>
      </div>
    </div>
    </Portal>
  );
}

function TaskInstanceRow({ instance, onSetStatus }) {
  const [cancelOpen, setCancelOpen] = React.useState(false);
  const [reason, setReason] = React.useState('');

  const label = instance.dueDate
    ? (() => { const [y,m,d] = instance.dueDate.split('-'); return `${d}.${m}.${y}`; })()
    : L(`Событие ${instance.seq}`, `Event ${instance.seq}`);

  const STATUS_BTN = (id, lbl, activeColor) => (
    <button key={id} onClick={() => id === 'cancelled' ? setCancelOpen(true) : onSetStatus(instance.id, id)}
      className="bk-press" style={{
        border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 11.5, fontWeight: 700,
        padding: '6px 10px', borderRadius: 999,
        background: instance.status === id ? activeColor : '#EDE8E0',
        color: instance.status === id ? '#fff' : 'var(--ink-soft)' }}>
      {lbl}
    </button>
  );

  return (
    // Stops a tap anywhere in here (a status button, the cancel-reason
    // input/OK button) from bubbling up into the task card's own onTap,
    // which now opens the edit sheet — marking a status shouldn't also
    // pop that open.
    <div onClick={e => e.stopPropagation()} style={{ padding: '8px 0', borderTop: '1px solid rgba(60,40,20,0.06)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
        <div style={{ fontSize: 12.5, fontWeight: 700, color: 'var(--ink)', minWidth: 60 }}>{label}</div>
        <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
          {STATUS_BTN('done', L('Сделано', 'Done'), '#1f7a55')}
          {STATUS_BTN('postponed', L('Перенос', 'Postponed'), '#B07848')}
          {STATUS_BTN('cancelled', L('Отмена', 'Cancelled'), '#c0392b')}
        </div>
      </div>
      {instance.status === 'cancelled' && instance.cancelReason && !cancelOpen && (
        <div style={{ fontSize: 11.5, color: 'var(--ink-faint)', marginTop: 4 }}>
          {L('Причина', 'Reason')}: {instance.cancelReason}
        </div>
      )}
      {cancelOpen && (
        <div style={{ marginTop: 8, display: 'flex', gap: 6 }}>
          <input value={reason} onChange={e => setReason(e.target.value)} autoFocus
            placeholder={L('Причина отмены…', 'Reason for cancelling…')}
            style={{ flex: 1, border: '1.5px solid #DDD8CF', borderRadius: 10, padding: '7px 10px',
              fontFamily: 'inherit', fontSize: 12.5, background: '#FBF7F2', color: 'var(--ink)', outline: 'none' }} />
          <button onClick={() => { if (reason.trim()) { onSetStatus(instance.id, 'cancelled', reason.trim()); setCancelOpen(false); setReason(''); } }}
            className="bk-press" style={{ border: 'none', cursor: 'pointer', fontFamily: 'inherit',
              background: '#c0392b', color: '#fff', fontSize: 12, fontWeight: 700, padding: '7px 14px', borderRadius: 10 }}>
            {L('OK', 'OK')}
          </button>
        </div>
      )}
    </div>
  );
}

function MyTasksScreen() {
  // Personal view for whoever's logged in — sees only their own tasks,
  // can mark status, but can't add/edit/delete a task (that stays with
  // whoever assigns them — Ольга or a manager, in Персонал → Задачи).
  const name = window.__teacherName;
  const [tasks, setTasks] = React.useState([]);
  const [loading, setLoading] = React.useState(true);

  function reload() {
    if (!name) return;
    setLoading(true);
    withRetry(() => window.loadStaffTasks(name)).then(setTasks).catch(() => setTasks([])).finally(() => setLoading(false));
  }
  React.useEffect(reload, [name]);

  function setInstanceStatus(instanceId, status, cancelReason) {
    const prevTasks = tasks;
    setTasks(ts => ts.map(t => ({ ...t, instances: t.instances.map(i =>
      i.id === instanceId ? { ...i, status, cancelReason: status === 'cancelled' ? (cancelReason || '') : null } : i
    ) })));
    window.updateStaffTaskInstance(instanceId, status, cancelReason).catch(() => {
      setTasks(prevTasks);
      window.showToast(L('Не удалось сохранить', 'Failed to save'));
    });
  }

  return (
    <div style={{ padding: '4px 20px 28px' }}>
      {loading && <div style={{ textAlign: 'center', padding: 40, color: 'var(--ink-faint)', fontSize: 13 }}>…</div>}

      {!loading && tasks.length === 0 && (
        <div style={{ textAlign: 'center', padding: 40, color: 'var(--ink-faint)', fontSize: 14 }}>
          {L('Нет задач', 'No tasks')}
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {!loading && tasks.map(t => {
          const done = t.instances.filter(i => i.status === 'done').length;
          const postponed = t.instances.filter(i => i.status === 'postponed').length;
          const cancelled = t.instances.filter(i => i.status === 'cancelled').length;
          const total = t.instances.length;
          return (
            <div key={t.id} style={{ background: '#FBF7F2', borderRadius: 18, padding: 13 }}>
              <div style={{ fontSize: 14.5, fontWeight: 700, color: 'var(--ink)' }}>{taskTitleLo(t)}</div>
              <div style={{ fontSize: 11.5, color: 'var(--ink-faint)', fontWeight: 600, marginTop: 2 }}>
                {taskRecurrenceLabel(t)}
              </div>
              <div>
                {t.instances.map(i => (
                  <TaskInstanceRow key={i.id} instance={i} onSetStatus={setInstanceStatus} />
                ))}
              </div>
              <div style={{ display: 'flex', gap: 10, marginTop: 8, fontSize: 11.5, fontWeight: 700, color: 'var(--ink-soft)' }}>
                <span>{L('Сделано', 'Done')}: {done} {L('из', 'of')} {total}</span>
                {postponed > 0 && <span>{L('Перенесено', 'Postponed')}: {postponed}</span>}
                {cancelled > 0 && <span>{L('Отменено', 'Cancelled')}: {cancelled}</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MyScheduleScreen() {
  // Read-only self-view for whoever's logged in — same calendar rendering
  // as StaffMonthlyScreen's per-person detail, but scoped to
  // window.__teacherName with no picker (there's only ever "me" to show)
  // and no editing (that stays director/manager-only, in Персонал →
  // Сводка). Purely informational — what's already recorded/planned for
  // me, today and in advance ("меня поставили", not "я отгулился") —
  // never a money figure (salary was explicitly cut from this module's
  // scope, see StaffMonthlyScreen's history).
  const name = window.__teacherName;
  const now = new Date();
  const [month, setMonth] = React.useState(
    `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`
  );
  const [data, setData] = React.useState({});
  const [loading, setLoading] = React.useState(true);

  React.useEffect(() => {
    if (!name) { setLoading(false); return; }
    setLoading(true);
    withRetry(() => window.getStaffMonthly(month))
      .then(setData)
      .catch(() => {})
      .finally(() => setLoading(false));
  }, [month, name]);

  const [yr, mo] = month.split('-').map(Number);
  const monthLabel = window.__lang === 'en' ? `${EN_MONTHS[mo-1]} ${yr}` : `${RU_MONTHS[mo-1]} ${yr}`;
  const daysInMonth = new Date(yr, mo, 0).getDate();

  function prevMonth() {
    const d = new Date(yr, mo - 2, 1);
    setMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  function nextMonth() {
    const d = new Date(yr, mo, 1);
    setMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }

  const allDays = data[name] || {};
  function countStatus(statusId) {
    return Object.values(allDays).filter(d => d.status === statusId).length;
  }

  // refetched every time you land back on it (e.g. after checking one off
  // and going back), so it doesn't go stale.
  const [todayBadges, setTodayBadges] = React.useState({});
  React.useEffect(() => {
    if (selectedName || staffList.length === 0) return;
    const today = todayStr();
    Promise.all(staffList.map(s => withRetry(() => window.loadStaffTasks(s.name)).catch(() => [])))
      .then(results => {
        const map = {};
        staffList.forEach((s, i) => {
          const dueToday = results[i].flatMap(t => t.instances.filter(inst => inst.dueDate === today));
          if (dueToday.length === 0) return;
          map[s.name] = dueToday.every(inst => inst.status === 'done') ? 'done' : 'pending';
        });
        setTodayBadges(map);
      });
  }, [selectedName, staff]);

  function reloadTasks(name) {
    if (!name) return;
    setTasksLoading(true);
    withRetry(() => window.loadStaffTasks(name))
      .then(setTasks)
      .catch(() => setTasks([]))
      .finally(() => setTasksLoading(false));
  }
  React.useEffect(() => { reloadTasks(selectedName); }, [selectedName]);

  function setInstanceStatus(instanceId, status, cancelReason) {
    const prevTasks = tasks;
    setTasks(ts => ts.map(t => ({ ...t, instances: t.instances.map(i =>
      i.id === instanceId ? { ...i, status, cancelReason: status === 'cancelled' ? (cancelReason || '') : null } : i

      setTasks(prevTasks);

// Attendance is marked fresh each day; persisted in localStorage so a reload
// during the same day doesn't lose today's marks (no backend for this yet).
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function isWeekend(date) {
  const d = date || new Date();
  const day = d.getDay(); // 0=Sun, 6=Sat
  return day === 0 || day === 6;
}
// normalize stored date to YYYY-MM-DD for comparison
// handles DD.MM.YYYY (Russian), YYYY.MM.DD and YYYY-MM-DD
function normDate(s) {
  s = (s || '').trim();
  if (!s) return s;
  const m = s.match(/^(\d{2})[.\-](\d{2})[.\-](\d{4})$/);
  if (m) return `${m[3]}-${m[2]}-${m[1]}`;   // DD.MM.YYYY → YYYY-MM-DD
  return s.replace(/\./g, '-');               // YYYY.MM.DD → YYYY-MM-DD
}

// The backend always writes this note in Russian (it's what lands in
// Ольга's Google Sheet too), but Payment history is bilingual UI — re-render
// it in whichever language is active instead of showing a fixed Russian
// sentence next to English labels. Real staff names pass through unchanged.
function formatMarkedBy(markedBy) {
  const m = (markedBy || '').match(/^Система: перенос пропуска (\d{2}\.\d{2}\.\d{4})$/);
  if (!m) return markedBy;
  return L(`Система: перенос пропуска ${m[1]}`, `System: carried over a missed day from ${m[1]}`);
}

function loadStoredAttendance() {
  try {
    const parsed = JSON.parse(localStorage.getItem('balu_attendance'));
    return parsed && parsed.date === todayStr() ? parsed.statuses : null;
  } catch { return null; }
}

function persistAttendance(statuses) {
  try { localStorage.setItem('balu_attendance', JSON.stringify({ date: todayStr(), statuses })); } catch {}
}

// Role is re-checked once per day — same daily-reset pattern as attendance.
function loadStoredRole() {
  try {
    const parsed = JSON.parse(localStorage.getItem('balu_role'));
    if (!parsed || parsed.date !== todayStr()) return null;
    return { role: parsed.role, name: parsed.name || null };
  } catch { return null; }
}

function persistRole(role, name = null, token = null) {
  try { localStorage.setItem('balu_role', JSON.stringify({ date: todayStr(), role, name, token })); } catch {}
}

function LoginGate({ onLogin }) {
  const [password, setPassword] = React.useState('');
  const [error, setError] = React.useState(false);
  const [loading, setLoading] = React.useState(false);

  async function submit(e) {
    e.preventDefault();
    if (!password.trim()) return;
    setLoading(true);
    setError(false);
    const data = await window.login(password.trim());
    setLoading(false);
    if (data) onLogin(data);
    else setError(true);
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center',
      justifyContent: 'center', gap: 18, padding: 24, background: 'var(--bg)' }}>
